<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业号员工管理 · 简化离职 Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef0f4;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#333}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{width:414px;max-width:100%;margin:24px auto;background:#fff;min-height:820px;position:relative;border:1px solid #e4e7ed}.top{padding:18px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}.top strong{font-size:18px}.muted{font-size:12px;color:#999;line-height:1.7}.tabs{display:flex;border-bottom:1px solid #eee}.tabs span{flex:1;text-align:center;padding:16px;color:#999}.tabs .active{color:#2b59c3;position:relative}.tabs .active:after{content:'';position:absolute;bottom:0;width:52px;height:2px;background:#2b59c3;left:calc(50% - 26px)}.form{padding:0 20px}.row{padding:20px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;gap:15px;align-items:center}.label{font-size:15px;margin-bottom:6px}.balance{display:flex;justify-content:space-between;border-top:1px solid #f0f0f0;padding-top:10px;margin-top:12px;font-size:12px;color:#666}.balance b{color:#2b59c3}.switch{appearance:none;width:42px;height:24px;border-radius:20px;background:#e8e8e8;position:relative;flex-shrink:0;cursor:pointer;margin:0}.switch:after{content:'';width:20px;height:20px;border-radius:50%;background:white;position:absolute;top:2px;left:2px;box-shadow:0 1px 3px #0001}.switch:checked{background:#2b59c3}.switch:checked:after{left:20px}.block{padding:20px 0;border-bottom:1px solid #eee}.options{display:flex;gap:10px;margin-top:12px}.option{flex:1;padding:12px;border:1px solid #e8e8e8;border-radius:6px;background:white;text-align:left}.option.active{border-color:#2b59c3;background:#f5f8ff;color:#2b59c3}.option small{display:block;font-size:11px;margin-top:5px;color:#888}.range{width:100%;accent-color:#2b59c3}.warning{font-size:12px;line-height:1.8;color:#a65b24;background:#fff8ef;padding:12px;margin-top:14px;border-radius:6px}.bottom{padding:20px}.btn{padding:13px;border:0;border-radius:6px;background:#f0f1f4;color:#666}.primary{background:#2b59c3;color:#fff}.full{width:100%}.demo{padding:12px 20px;background:#fafafa;border-top:1px solid #eee;font-size:11px;color:#999;line-height:1.8}.demo select{margin-left:8px;border:1px solid #ddd;padding:5px;background:#fff;border-radius:4px;color:#666;font-size:11px}.overlay{position:absolute;inset:0;background:#0006;display:flex;align-items:center;padding:20px;z-index:2}.overlay[hidden]{display:none}.dialog{background:#fff;width:100%;border-radius:12px;padding:22px;max-height:740px;overflow:auto}.dialog h2{font-size:19px;margin:0 0 8px}.summary{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.risk{font-size:13px;line-height:1.85;margin:16px 0}.risk strong{color:#c1493f}.check{display:flex;gap:9px;line-height:1.7;font-size:12px;margin:14px 0}.check input{accent-color:#2b59c3;margin-top:4px;flex-shrink:0}.link{border:0;background:none;color:#2b59c3;padding:0;font-size:inherit;cursor:pointer}.actions{display:flex;gap:10px;margin-top:20px}.actions .btn{flex:1}.article{font-size:12px;line-height:1.9}.article h3{font-size:13px;margin-bottom:5px}.success{text-align:center;padding:22px 0}.success i{font-style:normal;font-size:32px;color:#2b59c3;display:block;margin-bottom:20px}@media(max-width:500px){.app{margin:0;border:0;min-height:100dvh}}
</style></head><body><main class="app"><header class="top"><strong>权限管理</strong><span class="muted">用户1641</span></header><div class="tabs"><span class="active">员工权限</span><span>项目管理</span></div><div class="form"><div class="row"><div style="flex:1"><div class="label" id="employmentLabel">管理权限</div><div class="muted" id="employmentCopy">开启后员工状态为在职中，关闭则为离职</div><div class="balance"><span>当前待提现金额</span><b id="amount">¥43.39</b></div></div><input class="switch" id="employment" type="checkbox" checked aria-label="管理权限，在职状态"></div><div class="warning" id="inlineWarning" hidden>保存后将解除企业关联。历史余额与未结收益继续保留，请核对后确认。</div><div class="row"><div><div class="label">收益数据</div><div class="muted">开启后协作者可观看收益数据</div></div><input class="switch" type="checkbox" checked aria-label="收益数据"></div><div class="block"><div class="label">员工结算方式</div><div class="muted">仅调整结算归属与钱包权限，不改变分成比例计算</div><div class="options"><button class="option" data-settlement>线下结算<small>订单可见，收益归企业主</small></button><button class="option active" data-settlement>线上结算<small>订单归员工，可提现</small></button></div></div><div class="block"><div class="label">分成比例 <b id="rate" style="color:#2b59c3;float:right">5%</b></div><input type="range" min="0" max="100" value="5" class="range" id="slider" aria-label="员工分成比例"><div class="muted">企业主 <span id="ownerRate">95</span>% · 员工 <span id="staffRate">5</span>%</div></div><div class="row"><div><div class="label">进阶管理</div><div class="muted">配置员工业务管理权限</div></div><input class="switch" type="checkbox" aria-label="进阶管理"></div></div><div class="bottom"><button id="save" class="btn primary full">保存设置</button></div><div class="demo">交互 Demo · 示例数据，不提交真实操作<br>结算场景<select id="scenario"><option value="balance">有余额，可继续结算</option><option value="empty">无余额</option><option value="review">结算异常，提交审核</option></select><button class="link" id="reset" style="margin-left:12px">重置</button></div><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" id="dialog"></section></div></main><script>
const $=id=>document.getElementById(id);let agreed=false,authority=false,finished=false;const terms=[['授权及真实信息','企业主应具有合法操作授权，核对员工身份及离职依据，并履行必要告知。不得虚构事实或冒用权限。'],['企业关系切割','生效后解除当前企业的平台在职关联，停止相关企业权限及后续业务分配。重新加入需另行办理，原权限不自动恢复。'],['历史收益保护','解绑不代表款项结清、债务免除或员工放弃权益。已有余额、待结收益及争议款项继续保留，不因本次操作清零或回收至企业主。'],['结算与异议','企业应继续履行结算义务。异常款项进入平台核查流程；员工保留查询、结算和申诉入口，未回复不视为同意。'],['违规与平台责任','恶意解绑、侵占收益或规避付款，平台可依据已公示规则核查处理并提供申诉渠道。本确认不免除平台依法应承担的责任。'],['劳动关系与操作留痕','平台内状态不当然证明劳动关系已合法解除，不替代通知、证明、工资及补偿等法定手续。操作人、时间、协议版本及结算状态依法留存。']];
function update(){const leaving=!$('employment').checked;$('inlineWarning').hidden=!leaving||finished;$('employmentLabel').style.color=leaving?'#c1493f':'#333';$('employmentCopy').textContent=finished?'员工已离职，历史结算入口继续保留':leaving?'关闭后员工状态变更为离职':'开启后员工状态为在职中，关闭则为离职';$('save').textContent=finished?'已离职':leaving?($('scenario').value==='review'?'提交离职审核':'确认离职并保存'):'保存设置';$('save').disabled=finished}
function confirm(){const review=$('scenario').value==='review';$('overlay').hidden=false;$('dialog').innerHTML=`<h2 id="dialogTitle">${review?'提交离职审核？':'确认员工离职？'}</h2><div class="muted">用户1641 · 协作 ID 530</div><div class="summary"><span>当前待提现金额</span><b>${$('amount').textContent}</b></div><div class="risk">${review?'结算存在异常，审核通过前员工状态与企业关联维持原状。':'确认后将解除员工与当前企业的平台关联，停止相关企业权限及后续业务分配。'}<br><br><strong>历史余额与待结收益继续保留，不清零、不回收至企业主。</strong>企业的结算及其他法律责任不因离职而免除。恶意解绑或逃避付款，平台将依据规则核查处理。</div><label class="check"><input id="authority" type="checkbox" ${authority?'checked':''}><span>我具有合法操作授权，已核对员工身份并履行必要告知。</span></label><label class="check"><input id="agree" type="checkbox" ${agreed?'checked':''}><span>我理解企业关联解除及历史责任保留的影响，并同意<button class="link" id="terms">《离职及企业关系解绑确认书》</button></span></label><div class="actions"><button class="btn" id="cancel">返回修改</button><button class="btn primary" id="confirm" ${agreed&&authority?'':'disabled'}>${review?'提交审核':'确认离职'}</button></div>`;$('cancel').onclick=close;$('terms').onclick=agreement;['agree','authority'].forEach(id=>$(id).onchange=()=>{agreed=$('agree').checked;authority=$('authority').checked;$('confirm').disabled=!(agreed&&authority)});$('confirm').onclick=result;$('authority').focus()}
function close(){$('overlay').hidden=true;$('save').focus()}
function agreement(){$('dialog').innerHTML='<h2 id="dialogTitle">离职及企业关系解绑确认书</h2><div class="muted">v1.0 · 企业主操作确认</div><div class="article">'+terms.map((t,i)=>'<h3>'+ (i+1)+'. '+t[0]+'</h3><p>'+t[1]+'</p>').join('')+'</div><button class="btn primary full" id="return">返回确认</button>';$('return').onclick=confirm}
function result(){const review=$('scenario').value==='review';finished=!review;if(review)$('employment').checked=true;update();$('dialog').innerHTML=`<div class="success"><i>${review?'◷':'✓'}</i><h2 id="dialogTitle">${review?'离职审核已提交':'员工已设为离职'}</h2><p class="muted">${review?'审核通过前，员工状态及企业关联维持原状。':'企业关联已解除，员工站内通知已发送。'}</p></div><div class="warning">${review?'争议款项及记录继续保留，处理结果将通过站内通知送达。':'历史余额 '+$('amount').textContent+' 继续保留，员工可查询、结算和提出异议。'}</div><button id="done" class="btn primary full" style="margin-top:20px">完成</button>`;$('done').onclick=close}
$('employment').onchange=()=>{agreed=false;authority=false;update()};$('save').onclick=()=>{if(!$('employment').checked)confirm();else{$('overlay').hidden=false;$('dialog').innerHTML='<h2 id="dialogTitle">设置已保存</h2><p class="muted">仅更新本次演示配置。</p><button class="btn primary full" id="done">完成</button>';$('done').onclick=close}};$('scenario').onchange=()=>{$('amount').textContent=$('scenario').value==='empty'?'¥0.00':'¥43.39';finished=false;agreed=false;authority=false;$('employment').disabled=false;update()};$('reset').onclick=()=>{finished=false;agreed=false;authority=false;$('employment').checked=true;update()};$('slider').oninput=e=>{$('rate').textContent=e.target.value+'%';$('staffRate').textContent=e.target.value;$('ownerRate').textContent=100-e.target.value};document.querySelectorAll('[data-settlement]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-settlement]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});update();
</script></body></html>
