const sourceUpdates=[{"id": "ENT-UX-004", "originalContent": "## 最新确认：独立配置页与先选员工（2026-10-16）\n\n单员工：员工列表 → 管理 → 独立设置页 → 对应功能配置 → 确认。\n\n批量：批量操作 → 勾选员工 → 下一步 → 选择操作 → 配置 → 确认。保留已选员工；不符合规则的操作显示原因且禁用。\n\n项目采用左侧分类、右侧项目与权限；支持跨分类多选、当前结果全选、统一可用/禁用和按分类预览变更，未操作项目保持原配置。新增项目归入对应分类。此规则覆盖旧版先选操作、分组开关及管理浮层说明。\n\n# 员工管理 · 整合确认说明\n\n本文件是本轮员工管理 UX 的统一评审入口；原需求路径说明、身份与关联说明、项目配置多版对照保留为历史参考。发生冲突时，以本文件和《员工管理-整合确认稿.html》为准。\n\n交付范围：可点击原型和完整需求路径说明。未修改业务页面、未连接真实员工或权限接口，尚未部署上线。“确认稿”指集中评审稿，不代表全部业务细则已经确认。\n\n## 一、本轮统一采用的 UX 方向\n\n| 模块 | 合并后的方案 |\n| --- | --- |\n| 员工入口 | 一个员工列表；卡片“设置”处理个人；工具栏“批量设置”进入多选 |\n| 单人/多人路径 | 先确定员工，再选择配置项，共用分类与设置规则，不重复选择员工 |\n| 信息负担 | 多选自动收起经营数据；普通浏览可手动收起/展开数据；复杂配置进入独立页 |\n| 进阶管理 | 从每名员工设置首页进入，包含普通员工、小组长、组员及对应关联 |\n| 项目配置 | 采用已选定的“分组开关列表”，分类下直接展示项目开关，统一保存 |\n| 分类展开 | 默认全部展开；分类可独立收起/展开；提供全部展开/全部收起 |\n| 搜索与新增 | 搜索跨分类并自动展开命中项；新增项目进入所属分类，显示新增标识 |\n\n不再将折叠分类作为必须的浏览步骤，不再使用左侧分类切换配合单项目下拉框。项目操作保持录屏中“开关 → 保存”的简单顺序。\n\n## 二、统一页面与配置项\n\n### 员工列表\n\n搜索昵称或 ID；展示真实身份、展示标签、结算方式、用户 ID、所属小组长或组员人数。常规浏览可看少量经营数据，多选自动收起。标签是展示文字，不等于真实身份。\n\n“设置”进入当前员工设置首页。“批量设置”只进入选择员工状态，不预先选择某一种设置。0 人时禁止继续；选择 1 人也可继续。全选范围为当前结果，已选人数在搜索后仍显示累计人数。返回保留选择；取消退出多选并清空选择。\n\n### 设置首页\n\n| 分类 | 设置项 |\n| --- | --- |\n| 身份与关联 | 进阶管理（单个员工） |\n| 收益与结算 | 常规分成/进阶分成入口、结算方式 |\n| 展示与工具 | 展示标签、快捷提词 |\n| 权限与项目 | 项目权限、收益数据可见性、钱包权限 |\n\n范围区显示员工名称/ID，批量显示人数和本次目标名单。进阶身份的分成入口回到进阶管理，不把常规分成与进阶分成混为一谈；批量混选进阶身份时常规分成入口不适用，需分别处理。\n\n## 三、单人及批量的操作路径\n\n**单人基础设置**：员工列表 → 该员工设置 → 选择配置项 → 编辑 → 预览差异 → 确认 → 返回列表及结果提示。\n\n**批量基础设置**：批量设置 → 勾选员工 → 设置所选员工 → 选择配置项 → 编辑 → 逐员工预览当前值与目标值 → 确认 → 返回列表，保留选择继续设置。\n\n**项目配置**：当前员工/所选员工 → 项目权限 → 调整项目或分类开关 → 保存配置 → 返回同一设置首页。项目采用直接保存，不额外增加通用差异确认页；当前范围和待保存数量始终明确。\n\n**进阶管理**：某员工 → 进阶管理 → 选择身份 → 配置关联与分成 → 预览身份及关联人员变化 → 确认 → 列表双向更新。\n\n## 四、三种身份及关联闭环\n\n| 身份 | 关联 | 对应配置 |\n| --- | --- | --- |\n| 普通员工 | 无小组关联 | 常规分成 |\n| 小组长 | 多名在职组员，可添加/解除 | 个人分成、业绩分成、查看名下组员数据权限 |\n| 组员 | 唯一在职小组长，必选 | 组员个人分成，不高于所属小组长个人分成 |\n\n- 小组长新增关联普通员工时，确认页同时展示该员工变为组员，以及所属小组长的变化；保存后双方列表同步更新。\n- 本人、离职员工、其他小组长、已归属其他小组长的成员不可新增为组员，给出原因，不能静默抢占。\n- 有组员的小组长先解除并保存全部关联，再恢复普通员工或切换组员。仅在未提交草稿中取消勾选不算完成解绑。\n- 普通员工等价于不启用进阶管理；小组长/组员启用进阶规则。避免可保存“进阶开启但未选身份”的中间状态。\n- 现有页面规则为新订单按进阶规则分佣、历史订单不变。展示标签调整不改变身份与权限。\n- 多人设置暂不提供统一身份与关系修改；如需批量分配组员，应另设明确的小组长目标流程。\n\n## 五、项目分组开关列表\n\n### 浏览与折叠\n\n独立项目页默认展示所有分类与项目，长列表向下滚动。分类标题显示项目总数、可用数、配置不同数、新增数及待保存数量。点击分类标题收起/展开，头部提供全部展开/全部收起。\n\n折叠只影响显示，不更改权限、选择或未保存变更。搜索跨所有分类，自动展开命中的分类；搜索期间展示“搜索结果自动展开”，清空搜索后恢复之前的折叠状态。\n\n### 单项与多项配置\n\n单项直接调整右侧开关。分类“全部可用”支持全开/全关和半选状态；有搜索时改为“结果全开”，仅操作当前分类搜索命中项。选择某分类所有项目不代表授权未来新增项目。\n\n多员工配置不同的项目明确显示“配置不同 · X/N 人可用”，不假装成已关闭；可统一开启，或使用分类操作统一配置。未修改的项目保持各员工原值，不能以首位员工模板覆盖所有人。\n\n### 新增项目\n\n接口按分类 ID 返回，新项目进入所属分类；标记新增且计数自动更新。新增项目的默认权限依据服务端实际规则，不因归类自动授权。新分类动态加入展示；原型固定六类、36 项只用于演示。\n\n### 保存\n\n按真正变化的员工—项目组合增量写入；恢复原值不计入待保存数。单员工和多人共用保存流程。有未保存修改时返回可继续配置或放弃。提交失败要保留草稿；部分成功只重试失败项目及员工，避免重复提交已成功部分。\n\n## 六、需业务/接口确认的细则\n\n这些内容不阻碍本轮布局确认，但不能从原型样例推断成真实业务规则：\n\n1. 新项目默认可用还是禁用，以及“新增”标识的时间/已读窗口。\n2. 关闭项目权限对进行中任务的影响，项目是否允许追溯历史任务。\n3. 解绑后成员身份的服务端返回规则。本稿采用恢复普通员工；如业务不同，应一并修正确认文案与关系约束。\n4. 现有组员是否允许直接转组，或必须先解绑再关联；必须遵守接口权限规则。\n5. 批量与项目列表的分页全选范围；正式界面要明确“本页/已加载/全部匹配”，不能混用。\n6. 钱包、收益数据及分成调整的接口权限、精度、结算生效时点与角色适用条件。\n7. 多人身份关系及分佣更新的事务/版本校验，保证不会一侧成功一侧失败。\n\n## 七、原型验证与验收\n\n本轮已实测：列表到单员工设置、单员工标签更新回写、普通员工转为组员并双向更新关系、多选员工进入同一设置页、混合项目状态、分类批量关闭并保存、钱包批量设置回写、六类36项默认展开、全部收起、搜索自动展开及修改保留、项目直接保存。\n\n正式实现仍需分页/大数据性能、权限拒绝、并发变更、部分失败重试、未保存编辑离开等异常验收。原型保存仅写当前页面内存，刷新重置；无真实接口或真实财务影响。\n\n## 八、员工卡片最终展示要求\n\n本轮取消自定义指标需求。移除自定义指标入口、选择/排序/预览配置页、收益/推广快捷切换及个人指标偏好读取。卡片使用固定六项：推广任务、累计回填、推广收益、员工收益、企业收益、分成比例，按三列两行展示。金额和数量下方显示今日新增，分成比例不显示新增。\n\n卡片保留已确认的位置规则：用户 ID 在昵称后；在职状态、身份、展示标签和结算方式同一标签行；加入时间在标签下方；不显示“员工信息/更多信息”折叠区。保留角色关联摘要。仍可统一收起/展开数据，多选员工时自动隐藏指标。\n\n其余单人、批量、身份关系与项目配置沿用前文。历史自定义指标页的方案不再作为当前需求或实现范围。\n\n## 九、排序与界面精简\n\n工具栏增加排序，底部浮层提供收益从低到高、收益从高到低、加入时间从早到晚、加入时间从晚到早。选择即生效并关闭，入口显示当前排序；取消不修改。原型收益按累计推广收益排序，正式需与原接口字段对齐。同值稳定排序；搜索沿用当前顺序，排序不更改员工身份、配置与所选对象。\n\n去掉产品界面外的确认稿标题、副标题、示意提示。员工数据仍为原型示例，说明保留在本文档中；没有连接真实接口。其他已确认的列表、固定指标、单人/批量、身份与项目路径不变。\n\n## 十、最新页面形式：按现有管理录屏\n\n用户要求按 20261016180731_rec_.mp4 展示现有管理页面。本说明前文的独立单员工设置首页、多级子页以及批量先统一选人的形式均由[录屏管理页面-最终 ：某员工 → 进阶管理 → 选择身份 → 配置关联与分成 → 预览身份及关联人员变化 → 确认 → 列表双向更新。\n\n## 四、三种身份及关联闭环\n\n| 身份 | 关联 | 对应配置 |\n| --- | --- | --- |\n| 普通员工 | 无小组关联 | 常规分成 |\n| 小组长 | 多名在职组员，可添加/解除 | 个人分成、业绩分成、查看名下组员数据权限 |\n| 组员 | 唯一在职小组长，必选 | 组员个人分成，不高于所属小组长个人分成 |\n\n- 小组长新增关联普通员工时，确认页同时展示该员工变为组员，以及所属小组长的变化；保存后双方列表同步更新。\n- 本人、离职员工、其他小组长、已归属其他小组长的成员不可新增为组员，给出原因，不能静默抢占。\n- 有组员的小组长先解除并保存全部关联，再恢复普通员工或切换组员。仅在未提交草稿中取消勾选不算完成解绑。\n- 普通员工等价于不启用进阶管理；小组长/组员启用进阶规则。避免可保存“进阶开启但未选身份”的中间状态。\n- 现有页面规则为新订单按进阶规则分佣、历史订单不变。展示标签调整不改变身份与权限。\n- 多人设置暂不提供统一身份与关系修改；如需批量分配组员，应另设明确的小组长目标流程。\n\n## 五、项目分组开关列表\n\n### 浏览与折叠\n\n独立项目页默认展示所有分类与项目，长列表向下滚动。分类标题显示项目总数、可用数、配置不同数、新增数及待保存数量。点击分类标题收起/展开，头部提供全部展开/全部收起。\n\n折叠只影响显示，不更改权限、选择或未保存变更。搜索跨所有分类，自动展开命中的分类；搜索期间展示“搜索结果自动展开”，清空搜索后恢复之前的折叠状态。\n\n### 单项与多项配置\n\n单项直接调整右侧开关。分类“全部可用”支持全开/全关和半选状态；有搜索时改为“结果全开”，仅操作当前分类搜索命中项。选择某分类所有项目不代表授权未来新增项目。\n\n多员工配置不同的项目明确显示“配置不同 · X/N 人可用”，不假装成已关闭；可统一开启，或使用分类操作统一配置。未修改的项目保持各员工原值，不能以首位员工模板覆盖所有人。\n\n### 新增项目\n\n接口按分类 ID 返回，新项目进入所属分类；标记新增且计数自动更新。新增项目的默认权限依据服务端实际规则，不因归类自动授权。新分类动态加入展示；原型固定六类、36 项只用于演示。\n\n### 保存\n\n按真正变化的员工—项目组合增量写入；恢复原值不计入待保存数。单员工和多人共用保存流程。有未保存修改时返回可继续配置或放弃。提交失败要保留草稿；部分成功只重试失败项目及员工，避免重复提交已成功部分。\n\n## 六、需业务/接口确认的细则\n\n这些内容不阻碍本轮布局确认，但不能从原型样例推断成真实业务规则：\n\n1. 新项目默认可用还是禁用，以及“新增”标识的时间/已读窗口。\n2. 关闭项目权限对进行中任务的影响，项目是否允许追溯历史任务。\n3. 解绑后成员身份的服务端返回规则。本稿采用恢复普通员工；如业务不同，应一并修正确认文案与关系约束。\n4. 现有组员是否允许直接转组，或必须先解绑再关联；必须遵守接口权限规则。\n5. 批量与项目列表的分页全选范围；正式界面要明确“本页/已加载/全部匹配”，不能混用。\n6. 钱包、收益数据及分成调整的接口权限、精度、结算生效时点与角色适用条件。\n7. 多人身份关系及分佣更新的事务/版本校验，保证不会一侧成功一侧失败。\n\n## 七、原型验证与验收\n\n本轮已实测：列表到单员工设置、单员工标签更新回写、普通员工转为组员并双向更新关系、多选员工进入同一设置页、混合项目状态、分类批量关闭并保存、钱包批量设置回写、六类36项默认展开、全部收起、搜索自动展开及修改保留、项目直接保存。\n\n正式实现仍需分页/大数据性能、权限拒绝、并发变更、部分失败重试、未保存编辑离开等异常验收。原型保存仅写当前页面内存，刷新重置；无真实接口或真实财务影响。\n\n## 八、员工卡片最终展示要求\n\n本轮取消自定义指标需求。移除自定义指标入口、选择/排序/预览配置页、收益/推广快捷切换及个人指标偏好读取。卡片使用固定六项：推广任务、累计回填、推广收益、员工收益、企业收益、分成比例，按三列两行展示。金额和数量下方显示今日新增，分成比例不显示新增。\n\n卡片保留已确认的位置规则：用户 ID 在昵称后；在职状态、身份、展示标签和结算方式同一标签行；加入时间在标签下方；不显示“员工信息/更多信息”折叠区。保留角色关联摘要。仍可统一收起/展开数据，多选员工时自动隐藏指标。\n\n其余单人、批量、身份关系与项目配置沿用前文。历史自定义指标页的方案不再作为当前需求或实现范围。\n\n## 九、排序与界面精简\n\n工具栏增加排序，底部浮层提供收益从低到高、收益从高到低、加入时间从早到晚、加入时间从晚到早。选择即生效并关闭，入口显示当前排序；取消不修改。原型收益按累计推广收益排序，正式需与原接口字段对齐。同值稳定排序；搜索沿用当前顺序，排序不更改员工身份、配置与所选对象。\n\n去掉产品界面外的确认稿标题、副标题、示意提示。员工数据仍为原型示例，说明保留在本文档中；没有连接真实接口。其他已确认的列表、固定指标、单人/批量、身份与项目路径不变。\n\n## 十、最新页面形式：按现有管理录屏\n\n用户要求按 20261016180731_rec_.mp4 展示现有管理页面。本说明前文的独立单员工设置首页、多级子页以及批量先统一选人的形式均由[录屏管理页面-最终形式说明](录屏管理页面-最终形式说明.md)替代。单员工现在从“＋ 管理”进入带员工权限/项目管理页签的底部浮层；批量按功能进入专用表单。保留已经确认的排序、卡片布局、固定六项指标及项目分组折叠，取消自定义指标的决定不变。\n\n## 十一、页面承载方式最终调整\n\n保留 20261016180731 录屏的管理页签、表单、字段与资格规则，将管理、关联选择、批量操作和确认内容由底部悬浮层改为独立页面展示。管理入口进入完整权限管理页；标题左侧为返回；员工权限/项目管理仍同页切换。页面不显示员工列表背景、不出现遮罩，长内容随页面滚动。返回保留草稿和关联选择，保存后返回原列表及选择状态。排序仍保留原要求的轻量底部选择，不属于管理表单。此条替代第十节及录屏说明中的“浮层”承载形式，不改变已确认的功能规则。", "back": "原始资料未单列后端开发说明，接口契约需确认。以下为来源内容：\n\n## 最新确认：独立配置页与先选员工（2026-10-16）\n\n单员工：员工列表 → 管理 → 独立设置页 → 对应功能配置 → 确认。\n\n批量：批量操作 → 勾选员工 → 下一步 → 选择操作 → 配置 → 确认。保留已选员工；不符合规则的操作显示原因且禁用。\n\n项目采用左侧分类、右侧项目与权限；支持跨分类多选、当前结果全选、统一可用/禁用和按分类预览变更，未操作项目保持原配置。新增项目归入对应分类。此规则覆盖旧版先选操作、分组开关及管理浮层说明。\n\n# 员工管理 · 整合确认说明\n\n本文件是本轮员工管理 UX 的统一评审入口；原需求路径说明、身份与关联说明、项目配置多版对照保留为历史参考。发生冲突时，以本文件和《员工管理-整合确认稿.html》为准。\n\n交付范围：可点击原型和完整需求路径说明。未修改业务页面、未连接真实员工或权限接口，尚未部署上线。“确认稿”指集中评审稿，不代表全部业务细则已经确认。\n\n## 一、本轮统一采用的 UX 方向\n\n| 模块 | 合并后的方案 |\n| --- | --- |\n| 员工入口 | 一个员工列表；卡片“设置”处理个人；工具栏“批量设置”进入多选 |\n| 单人/多人路径 | 先确定员工，再选择配置项，共用分类与设置规则，不重复选择员工 |\n| 信息负担 | 多选自动收起经营数据；普通浏览可手动收起/展开数据；复杂配置进入独立页 |\n| 进阶管理 | 从每名员工设置首页进入，包含普通员工、小组长、组员及对应关联 |\n| 项目配置 | 采用已选定的“分组开关列表”，分类下直接展示项目开关，统一保存 |\n| 分类展开 | 默认全部展开；分类可独立收起/展开；提供全部展开/全部收起 |\n| 搜索与新增 | 搜索跨分类并自动展开命中项；新增项目进入所属分类，显示新增标识 |\n\n不再将折叠分类作为必须的浏览步骤，不再使用左侧分类切换配合单项目下拉框。项目操作保持录屏中“开关 → 保存”的简单顺序。\n\n## 二、统一页面与配置项\n\n### 员工列表\n\n搜索昵称或 ID；展示真实身份、展示标签、结算方式、用户 ID、所属小组长或组员人数。常规浏览可看少量经营数据，多选自动收起。标签是展示文字，不等于真实身份。\n\n“设置”进入当前员工设置首页。“批量设置”只进入选择员工状态，不预先选择某一种设置。0 人时禁止继续；选择 1 人也可继续。全选范围为当前结果，已选人数在搜索后仍显示累计人数。返回保留选择；取消退出多选并清空选择。\n\n### 设置首页\n\n| 分类 | 设置项 |\n| --- | --- |\n| 身份与关联 | 进阶管理（单个员工） |\n| 收益与结算 | 常规分成/进阶分成入口、结算方式 |\n| 展示与工具 | 展示标签、快捷提词 |\n| 权限与项目 | 项目权限、收益数据可见性、钱包权限 |\n\n范围区显示员工名称/ID，批量显示人数和本次目标名单。进阶身份的分成入口回到进阶管理，不把常规分成与进阶分成混为一谈；批量混选进阶身份时常规分成入口不适用，需分别处理。\n\n## 三、单人及批量的操作路径\n\n**单人基础设置**：员工列表 → 该员工设置 → 选择配置项 → 编辑 → 预览差异 → 确认 → 返回列表及结果提示。\n\n**批量基础设置**：批量设置 → 勾选员工 → 设置所选员工 → 选择配置项 → 编辑 → 逐员工预览当前值与目标值 → 确认 → 返回列表，保留选择继续设置。\n\n**项目配置**：当前员工/所选员工 → 项目权限 → 调整项目或分类开关 → 保存配置 → 返回同一设置首页。项目采用直接保存，不额外增加通用差异确认页；当前范围和待保存数量始终明确。\n\n**进阶管理**：某员工 → 进阶管理 → 选择身份 → 配置关联与分成 → 预览身份及关联人员变化 → 确认 → 列表双向更新。\n\n## 四、三种身份及关联闭环\n\n| 身份 | 关联 | 对应配置 |\n| --- | --- | --- |\n| 普通员工 | 无小组关联 | 常规分成 |\n| 小组长 | 多名在职组员，可添加/解除 | 个人分成、业绩分成、查看名下组员数据权限 |\n| 组员 | 唯一在职小组长，必选 | 组员个人分成，不高于所属小组长个人分成 |\n\n- 小组长新增关联普通员工时，确认页同时展示该员工变为组员，以及所属小组长的变化；保存后双方列表同步更新。\n- 本人、离职员工、其他小组长、已归属其他小组长的成员不可新增为组员，给出原因，不能静默抢占。\n- 有组员的小组长先解除并保存全部关联，再恢复普通员工或切换组员。仅在未提交草稿中取消勾选不算完成解绑。\n- 普通员工等价于不启用进阶管理；小组长/组员启用进阶规则。避免可保存“进阶开启但未选身份”的中间状态。\n- 现有页面规则为新订单按进阶规则分佣、历史订单不变。展示标签调整不改变身份与权限。\n- 多人设置暂不提供统一身份与关系修改；如需批量分配组员，应另设明确的小组长目标流程。\n\n## 五、项目分组开关列表\n\n### 浏览与折叠\n\n独立项目页默认展示所有分类与项目，长列表向下滚动。分类标题显示项目总数、可用数、配置不同数、新增数及待保存数量。点击分类标题收起/展开，头部提供全部展开/全部收起。\n\n折叠只影响显示，不更改权限、选择或未保存变更。搜索跨所有分类，自动展开命中的分类；搜索期间展示“搜索结果自动展开”，清空搜索后恢复之前的折叠状态。\n\n### 单项与多项配置\n\n单项直接调整右侧开关。分类“全部可用”支持全开/全关和半选状态；有搜索时改为“结果全开”，仅操作当前分类搜索命中项。选择某分类所有项目不代表授权未来新增项目。\n\n多员工配置不同的项目明确显示“配置不同 · X/N 人可用”，不假装成已关闭；可统一开启，或使用分类操作统一配置。未修改的项目保持各员工原值，不能以首位员工模板覆盖所有人。\n\n### 新增项目\n\n接口按分类 ID 返回，新项目进入所属分类；标记新增且计数自动更新。新增项目的默认权限依据服务端实际规则，不因归类自动授权。新分类动态加入展示；原型固定六类、36 项只用于演示。\n\n### 保存\n\n按真正变化的员工—项目组合增量写入；恢复原值不计入待保存数。单员工和多人共用保存流程。有未保存修改时返回可继续配置或放弃。提交失败要保留草稿；部分成功只重试失败项目及员工，避免重复提交已成功部分。\n\n## 六、需业务/接口确认的细则\n\n这些内容不阻碍本轮布局确认，但不能从原型样例推断成真实业务规则：\n\n1. 新项目默认可用还是禁用，以及“新增”标识的时间/已读窗口。\n2. 关闭项目权限对进行中任务的影响，项目是否允许追溯历史任务。\n3. 解绑后成员身份的服务端返回规则。本稿采用恢复普通员工；如业务不同，应一并修正确认文案与关系约束。\n4. 现有组员是否允许直接转组，或必须先解绑再关联；必须遵守接口权限规则。\n5. 批量与项目列表的分页全选范围；正式界面要明确“本页/已加载/全部匹配”，不能混用。\n6. 钱包、收益数据及分成调整的接口权限、精度、结算生效时点与角色适用条件。\n7. 多人身份关系及分佣更新的事务/版本校验，保证不会一侧成功一侧失败。\n\n## 七、原型验证与验收\n\n本轮已实测：列表到单员工设置、单员工标签更新回写、普通员工转为组员并双向更新关系、多选员工进入同一设置页、混合项目状态、分类批量关闭并保存、钱包批量设置回写、六类36项默认展开、全部收起、搜索自动展开及修改保留、项目直接保存。\n\n正式实现仍需分页/大数据性能、权限拒绝、并发变更、部分失败重试、未保存编辑离开等异常验收。原型保存仅写当前页面内存，刷新重置；无真实接口或真实财务影响。\n\n## 八、员工卡片最终展示要求\n\n本轮取消自定义指标需求。移除自定义指标入口、选择/排序/预览配置页、收益/推广快捷切换及个人指标偏好读取。卡片使用固定六项：推广任务、累计回填、推广收益、员工收益、企业收益、分成比例，按三列两行展示。金额和数量下方显示今日新增，分成比例不显示新增。\n\n卡片保留已确认的位置规则：用户 ID 在昵称后；在职状态、身份、展示标签和结算方式同一标签行；加入时间在标签下方；不显示“员工信息/更多信息”折叠区。保留角色关联摘要。仍可统一收起/展开数据，多选员工时自动隐藏指标。\n\n其余单人、批量、身份关系与项目配置沿用前文。历史自定义指标页的方案不再作为当前需求或实现范围。\n\n## 九、排序与界面精简\n\n工具栏增加排序，底部浮层提供收益从低到高、收益从高到低、加入时间从早到晚、加入时间从晚到早。选择即生效并关闭，入口显示当前排序；取消不修改。原型收益按累计推广收益排序，正式需与原接口字段对齐。同值稳定排序；搜索沿用当前顺序，排序不更改员工身份、配置与所选对象。\n\n去掉产品界面外的确认稿标题、副标题、示意提示。员工数据仍为原型示例，说明保留在本文档中；没有连接真实接口。其他已确认的列表、固定指标、单人/批量、身份与项目路径不变。\n\n## 十、最新页面形式：按现有管理录屏\n\n用户要求按 20261016180731_rec_.mp4 展示现有管理页面。本说明前文的独立单员工设置首页、多级子页以及批量先统一选人的形式均由[录屏管理页面-最终形式说明](录屏管理页面-最终形式说明.md)替代。单员工现在从“＋ 管理”进入带员工权限/项目管理页签的底部浮层；批量按功能进入专用表单。保留已经确认的排序、卡片布局、固定六项指标及项目分组折叠，取消自定义指标的决定不变。\n\n## 十一、页面承载方式最终调整\n\n保留 20261016180731 录屏的管理页签、表单、字段与资格规则，将管理、关联选择、批量操作和确认内容由底部悬浮层改为独立页面展示。管理入口进入完整权限管理页；标题左侧为返回；员工权限/项目管理仍同页切换。页面不显示员工列表背景、不出现遮罩，长内容随页面滚动。返回保留草稿和关联选择，保存后返回原列表及选择状态。排序仍保留原要求的轻量底部选择，不属于管理表单。此条替代第十节及录屏说明中的“浮层”承载形式，不改变已确认的功能规则。"}, {"id": "ENT-UX-005", "originalContent": "# 员工管理 UX 草稿\n\n总览：index.html\n\n交互原型：prototype.html\n\n双端消息：messages.html#all\n\n样例数据原型，未接入业务接口。", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n# 员工管理 UX 草稿\n\n总览：index.html\n\n交互原型：prototype.html\n\n双端消息：messages.html#all\n\n样例数据原型，未接入业务接口。", "back": "原始资料未单列后端开发说明，接口契约需确认。以下为来源内容：\n\n# 员工管理 UX 草稿\n\n总览：index.html\n\n交互原型：prototype.html\n\n双端消息：messages.html#all\n\n样例数据原型，未接入业务接口。"}, {"id": "ENT-TOOL-001", "originalContent": "# 员工首页工具权限：场景 UX 与开发需求\n\n版本：2026-10-27 · 需求确认稿\n\n最新样式调整：以文末第 10 节“首页紧凑单行”、第 11 节“全部工具列表”及完整 UX 页右侧抽屉为准，替代前文首页两行及前七项规则。\n\n配套原型：[employee.html](./employee.html)。顶部「权限展示场景」仅用于评审，不属于员工首页正式功能。\n\n## 1. 确认范围\n\n员工首页在搜索框下方、项目列表上方展示企业主已开放的工具。移除「常用工具」「工具专区」等模块标题，仅呈现图标和工具名称。员工侧不展示权限开关、配置入口、关闭的工具或锁定占位。\n\n工具及固定顺序：组合提词 → 快捷提词 → 知乎新文。企业主控制当前企业内每位员工的可见权限。三个工具支持独立授权，才能覆盖单独开放任意工具的场景。\n\n「知乎新文」点击后进入内部「知乎书单」页面，不配置外部 H5 跳转地址。页面样式参考用户提供的知乎书单截图。\n\n本次交付为场景 UX 和前后端开发需求，非后端已完成或正式上线证明。\n\n## 2. 场景 UX\n\n工具权限用三位顺序表示：组合提词 / 快捷提词 / 知乎新文，1 为开放，0 为关闭。\n\n| 场景 | 权限 | 员工首页展示 | 布局 |\n| --- | --- | --- | --- |\n| S01 | 100 | 仅组合提词 | 整行入口：左侧图标、中间名称、右侧箭头 |\n| S02 | 010 | 仅快捷提词 | 整行入口：左侧图标、中间名称、右侧箭头 |\n| S03 | 001 | 仅知乎新文 | 整行入口：左侧蓝色「知」字图标、中间名称、右侧箭头 |\n| S04 | 110 | 组合提词、快捷提词 | 两列等宽，图标上、名称下 |\n| S05 | 101 | 组合提词、知乎新文 | 两列等宽，图标上、名称下 |\n| S06 | 011 | 快捷提词、知乎新文 | 两列等宽，图标上、名称下 |\n| S07 | 111 | 三个工具全部展示 | 三列等宽，图标上、名称下 |\n| S08 | 000 | 无工具入口 | 工具模块整体隐藏，项目列表上移，无空白占位 |\n\n### 视觉与交互\n\n- 工具区使用单个白色圆角容器，左右与搜索框、项目列表对齐；不再增加标题行和说明文字。\n- 单工具使用紧凑整行入口，避免只占三分之一宽度或放大为宣传卡片；整行可点击。\n- 双工具 / 三工具平均分配可用宽度，不保留已关闭工具的位置；每个图标与名称构成完整可点击区域。\n- 建议容器圆角 12px、内边距 12px；图标 40–42px；名称 12–14px。单工具整行高度约 68–72px，多工具容器高度约 88–92px。以原型和实际屏幕适配为准。\n- 适配 320 / 375 / 414px 屏宽，名称不截断、不换行；触控区域至少 44×44px，支持键盘聚焦。\n- 首页不出现「未开通」「请联系企业主」等权限提示。仅在用户通过旧链接直接访问受限页面时提示无权限。\n- 组合提词、快捷提词沿用原有页面；知乎新文进入知乎书单。返回首页后保留项目筛选、搜索和列表位置。\n\n## 3. 前端开发需求\n\n### 3.1 权限驱动与动态排布\n\n1. 从服务端获取当前企业、当前员工关系下的有效工具权限，不以本地开关作为授权依据。\n2. 将允许的工具按固定顺序过滤为 visibleTools，按数量渲染 0 / 1 / 2 / 3 场景；图标与名称来自固定工具定义。\n3. 不再使用同一个提词权限同时决定两个入口，接入独立组合提词与快捷提词权限。\n4. 初次加载权限期间不展示工具；可暂时保留一个紧凑骨架，避免闪现未授权工具。加载失败或身份无效时隐藏工具区，不将失败当作「全部开放」。\n5. 用户重新进入首页时刷新权限。切换企业、退出登录或员工关系变化时立即清除旧权限与旧书单，不能沿用上一个企业的数据。\n6. 点击工具入口和进入工具页时均检查最新可用权限；接口返回权限失效时清空相关内容，提示并返回首页。前端校验不替代后端鉴权。\n7. 接口缺失某项权限默认关闭。显式返回 false 优先于旧字段，不得因兼容逻辑重新开启。\n\n### 3.2 知乎书单页面\n\n- 顶部返回 + 页面名「知乎书单」，保留参考图橙红渐变头图。\n- 搜索框按作品标题搜索，支持键盘搜索、清空、无结果状态；新查询重置分页。\n- 排序：更新时间最新优先、更新时间最早优先、盐选点赞从高到低。\n- 筛选：标签筛选（本期单选）；标签候选由接口返回。搜索、标签和排序共同生效。\n- 卡片包含作品标题、最多两行简介、标签、作者、作者获赞 / 粉丝、更新时间及五项数据：盐选点赞、盐选评论、回答点赞、回答评论、回答收藏。\n- 已知统计为 0 时显示 0，未知值显示「—」；不将缺失数据补成 0。暂无作者等非必要内容可省略。\n- 支持分页、加载更多、刷新、请求失败重试。筛选和排序作用于全部匹配数据，不能只处理当前已加载列表。\n- 多次搜索或筛选时只接收最后一次请求结果，防止较早请求覆盖新条件；分页失败保持已有卡片，重试不跳页、不重复插入。\n- 权限未开通、官方源未配置、书库暂无作品、搜索无结果、请求失败分别呈现对应状态。\n- 卡片暂作为书单信息展示，不新增申请、提词、复制或作品详情跳转流程。\n- 原型中的示例作品和数字仅用于样式评审，不作为正式数据写入。\n\n## 4. 后端开发需求\n\n### 4.1 权限模型与企业主配置\n\n- 按「企业 ID + 员工关系 ID + 工具标识」存储独立权限，不使用全平台用户 ID 作为唯一授权维度。\n- 工具标识固定为 compose_prompt、quick_prompt、zhihu_article；新员工默认关闭，企业主明确开启后生效。\n- 企业主员工权限管理中提供三个独立工具开关。可复用现有单员工 / 批量操作框架，批量接口使用员工关系 ID 列表。\n- 单次提交校验全部员工均属于当前企业且可管理；存在无效或越权对象时整批失败，不允许静默部分成功。校验通过后事务保存，返回最终权限版本。\n- 企业主只能管理自己企业内员工的权限。员工不能调用权限保存接口。\n- 所有工具业务接口及书单接口必须重新校验有效员工关系和工具权限；仅隐藏入口不足以限制访问。\n- 开关变化记录操作人、企业、员工关系、工具、修改前后值、时间与权限版本。\n- 默认关闭不追溯清空历史任务或历史记录；历史数据访问沿用原有业务规则。\n\n### 4.2 旧权限迁移与兼容\n\n当前仓库使用 can_quick_prompt / quick_prompt_enabled 同时控制组合提词与快捷提词，已有 quickPromptPermissionSave 接口及字节项目权限前置规则。\n\n- 迁移时按旧权限生成两项独立权限：旧开启 → 两项开启；旧关闭或缺失 → 两项关闭。知乎新文默认关闭。\n- 迁移后 compose_prompt 和 quick_prompt 独立保存；不能每次读取旧字段时覆盖新配置。\n- 新保存接口沿用现有字节项目依赖校验。确有项目依赖时返回明确错误，不隐式开放项目；若需联动开项目，复用已确认的显式授权流程并原子保存。\n- 旧客户端仅能表达「两项同时开关」，与新独立授权不完全兼容。发布时建议要求刷新 / 升级客户端；服务端应对旧写接口增加版本校验，避免覆盖已拆分权限。\n- 旧读取字段可暂按“两项都开启才返回开启”兼容，不能将两项取或后开放旧客户端两个入口。最终下线时间由发布计划确认。\n\n### 4.3 官方书库\n\n- 接入经确认的知乎官方 / 授权作品数据源，不凭页面截图构造线上作品数据。\n- 支持标题搜索、标签筛选、全量结果排序和分页；同更新时间按作品 ID 排序以保持顺序稳定。\n- 存储作品唯一 ID、标题、简介、标签、作者信息、五项统计、作品更新时间和数据同步时间；统计缺失保留 null。\n- 缓存必须带上数据源和必要的企业范围，权限检查不得被缓存绕过。设置可配置同步周期，失败保留上次有效数据并记录异常。\n- 不接受客户端提交任意任务 ID 来选择数据源；由服务端配置已确认的官方源，按当前身份返回可访问数据。\n\n## 5. 建议接口契约（新增提案，待后端确认）\n\n以下路径和结构是开发建议，不表示现有后端已提供。\n\n### 员工有效权限 GET /api/v1.enterprise.tools/permissions\n\n请求身份从登录态获取，不由客户端指定企业或员工。\n\n```json\n{\n  \"code\": 1,\n  \"data\": {\n    \"permission_version\": 12,\n    \"tools\": {\n      \"compose_prompt\": true,\n      \"quick_prompt\": false,\n      \"zhihu_article\": true\n    }\n  }\n}\n```\n\n### 企业主保存 POST /api/v1.enterprise.staff/toolPermissionsSave\n\n```json\n{\n  \"ids\": [634],\n  \"expected_versions\": { \"634\": 12 },\n  \"tools\": { \"compose_prompt\": true, \"quick_prompt\": false, \"zhihu_article\": true }\n}\n```\n\ntools 为局部更新，未传字段保持原值；不接受空对象和未知工具。若 expected_versions 与当前版本不一致，返回版本冲突，前端重新读取并让企业主确认后再提交。成功响应返回受影响员工关系及其最新工具权限、版本，不能仅回显请求。\n\n### 书单 GET /api/v1.enterprise.tools/zhihuBooks\n\n参数：keyword（标题关键词）、tag（单个标签 ID）、sort（updated_desc / updated_asc / yanxuan_likes_desc）、page、limit。limit 默认 20，最大 50；tag 不存在或 sort 不合法时返回参数错误。\n\n```json\n{\n  \"code\": 1,\n  \"data\": {\n    \"list\": [{\n      \"id\": \"official-book-id\",\n      \"title\": \"作品标题\",\n      \"intro\": \"作品简介\",\n      \"tags\": [{ \"id\": \"romance\", \"name\": \"言情\" }],\n      \"author\": { \"name\": \"作者名\", \"likes\": 237000, \"followers\": 21000 },\n      \"updated_at\": \"2026-10-27T18:27:00+08:00\",\n      \"metrics\": {\n        \"yanxuan_likes\": 1, \"yanxuan_comments\": 1,\n        \"answer_likes\": 0, \"answer_comments\": 0, \"answer_favorites\": null\n      }\n    }],\n    \"total\": 1, \"page\": 1, \"limit\": 20,\n    \"available_tags\": [{ \"id\": \"romance\", \"name\": \"言情\" }],\n    \"synced_at\": \"2026-10-27T18:30:00+08:00\"\n  }\n}\n```\n\navailable_tags 返回当前书库可用标签，不能只从本页结果提取。示例仅说明结构，不是生产数据。\n\n错误语义：未登录、无有效企业关系、无工具权限、数据源未配置、参数错误、版本冲突、源服务异常；具体业务错误码与项目现有规范统一。无结果是成功且 list 为空，不作为接口失败。\n\n## 6. 联调与验收\n\n- [ ] S01–S08 全部覆盖，分别检查工具数量、名称、图标、顺序、布局与点击目标。\n- [ ] 工具区无标题、无权限开关、无关闭项占位；S08 搜索框与项目列表之间无残余容器和空白。\n- [ ] 单独关闭组合提词不影响快捷提词，反之亦然；知乎新文独立控制。\n- [ ] 320 / 375 / 414px 下无遮挡、溢出或名称截断；单工具整行可点。\n- [ ] 未授权员工通过旧链接 / 手工 URL / 直接 API 请求均无法获取工具数据。\n- [ ] 关闭权限后员工再次进入首页和目标页正确刷新；切换企业、退出登录不串权限 / 数据。\n- [ ] 企业主保存与批量保存校验企业归属、原子性及版本；旧接口不能覆盖新独立配置。\n- [ ] 搜索 + 标签 + 排序 + 分页共同生效；连续切换条件不被旧响应覆盖。\n- [ ] 数据源未配置、空库、无搜索结果、首屏失败、分页失败、权限撤销分别验收。\n- [ ] 明确区分统计 0 与未知值，刷新后更新数据，返回首页保留原列表上下文。\n\n## 7. 当前实现与待开发差异\n\n- 场景原型已覆盖 8 种权限组合，移除标题，支持知乎书单跳转展示。\n- 此前应用代码仍以旧共享提词权限控制两个入口，且保留工具标题；不能视为已满足本需求稿。\n- 此前书单页面预留 zhihu_book_task_id、Task/detail 作为临时接入思路，排序和标签只处理已加载结果。这些不作为最终后端契约；正式开发应按确认后的书库接口改为服务端全量搜索 / 筛选 / 排序。\n- 待开发：三个工具独立授权、企业主保存及批量配置、权限迁移、正式书库服务、前端联调与完整验收。\n- 待业务提供：官方 / 授权书库的数据来源、访问方式及同步要求。本项不阻碍首页场景 UX 评审。\n\n## 8. 工具数量扩展方案（本次补充）\n\n首页仍无模块标题，始终按员工实际有权限的工具数量排布，新增工具不改变核心规则。\n\n| 开放数量 | 首页展示 | 交互 |\n| --- | --- | --- |\n| 0 | 整块隐藏 | 无空白占位 |\n| 1 | 整行，图标 + 名称 + 右箭头 | 整行点击 |\n| 2–3 | 同行等分 | 点击各工具 |\n| 4 | 一行四列 | 不做横向滑动 |\n| 5–8 | 每行四列，最多两行；末行从左向右连续排布 | 不强行拉大末行图标，不保留关闭项占位 |\n| 超过 8 | 首页前 7 个已授权工具 + 第 8 格「全部工具」 | 打开内部全部工具页，按四列宫格展示全部已授权工具 |\n\n### 为什么采用宫格\n\n横向滑动会将部分工具藏在屏幕外，员工不易发现；左右翻页也增加操作。纵向单行列表在工具多时过高，会将项目列表推离首屏。因此，首页采用最多两行的四列宫格，大量工具通过明确的「全部工具」入口进入独立页面。\n\n5 个或 6 个工具时，末行保持左对齐及同样的列宽，避免为了填满空间而把相同工具渲染成不同尺寸。卡片内各图标与文字仍保持居中。\n\n### 前端补充\n\n- 先过滤权限、停用项和客户端不支持项，再计算数量及首页前 7 个，不能先截断再过滤。\n- 「全部工具」是导航入口，不是一项企业主权限，不计入开放工具数量；数量小于等于 8 时不显示。\n- 全部工具页沿用同一权限源、固定排序和点击规则，返回保留首页上下文。权限降到 8 个以内时首页自动移除「全部工具」。\n- 全部工具页打开期间如权限关闭，立即在下一次权限刷新后移除对应工具；失去全部权限时显示简洁空态和返回首页入口。\n- 首期扩展布局按工具短名称最多 6 个汉字适配，后台配置时校验；更长名称需提供短名称，不将文字压缩至不可读。\n- 首页不自动轮播、不横滑、不新增员工自行排序配置。未来确有个人常用需求时另立需求。\n\n### 后端补充\n\n- 工具目录按 tool_key、display_name、icon_key、sort_order、status 管理；有效可见列表结合企业授权、员工授权和工具启用状态计算。\n- tool_key 为权限主键。工具路由由客户端已注册映射确定，接口不下发可执行脚本或未经校验的任意跳转目标。\n- 同 sort_order 时以 tool_key 作为稳定排序；首页和全部工具页使用同一顺序。\n- 可在当前权限接口中补充有序 tools 列表；需在联调前确定最终结构并统一替换文档第 5 节的三工具对象示例，避免两种结构混用。默认仍只开放已实现的三个工具，原型的工具四至工具十不属于正式目录。\n\n### 扩展验收\n\n覆盖 4、5、6、8、9、10 个可见工具；特别验证 8→9 时第八格变为「全部工具」，9→8 时恢复为真实工具。首七项必须是过滤后排序结果；全部工具页完整展示第八项及其后工具，无遗漏、重复。所有数量场景在 320px 屏宽下不横向溢出。\n\n以上为对前文三工具布局规则的扩展；正式工具数量和目录以实际上线功能为准。\n\n## 9. 平台后台配置与完整页面需求抽屉（补充确认）\n\n完整场景 UX 页已集成右侧可收起的开发需求抽屉，含场景规则、后台配置、前端、后端 / 验收四个标签。开发可边切换权限场景边查看需求；抽屉和场景切换器属于评审工具，不进入正式员工首页。\n\n后台统一配置每个工具的：唯一标识、前端名称、图标、适用端（企业主 / 员工，可多选）、企业主跳转、员工跳转、注意事项、排序、启用状态、开放企业范围。选择哪一端，就必须填写该端链接；两端允许使用不同链接。\n\n链接支持已注册内部页面和平台允许域名下的 HTTPS 页面。知乎新文当前仍使用内部知乎书单页。后台配置与服务端校验通过后才能启用；无效链接不发布。前文仅允许固定客户端映射的限制更新为此规则。\n\n注意事项不堆在首页：内部目标页提供「使用说明」入口；外部链接在跳转前的说明弹窗展示，有说明时确认后跳转。\n\n企业主自用工具可见范围由后台控制；企业主给员工授权时只能操作已对该企业开放且适用员工侧的工具。企业主可见不意味着员工自动可见，员工最终权限必须同时满足后台启用、开放企业范围、适用员工侧、企业主授权。\n\n有效列表返回当前端身份对应的名称、图标、已校验链接、注意事项、排序和配置版本。全部工具页使用同一有效列表，10 个真实工具按 4＋4＋2 展示；首页前 7 个加导航入口，不少算、不重复。\n\n## 10. 首页紧凑单行（最新确认）\n\n工具区过大，会挤占项目列表。首页改为最多一行，完整工具集合仍在独立页面展示。\n\n- 0 个：整体隐藏。\n- 1 个：图标 + 名称 + 右箭头的紧凑整行，约 56px 高。\n- 2–4 个：同行等分，28px 图标在上、名称在下，整个区域约 68px 高。\n- 5 个及以上：首页只展示排序前 3 个 +「全部工具」，同样约 68px 高。\n- 全部工具页保留四列宫格、40–42px 图标；10 个工具按 4＋4＋2 完整展示。\n- 无标题、不横滑、不在首页展开多行；后台排序和独立授权规则不变。\n- 特别验收 4↔5 个时导航入口切换；先过滤权限再取前 3 个，不遗漏隐藏工具。全部页中第 4–10 个实际工具都需出现。\n\n本节取代前文“首页前 7 个 + 全部工具”“首页最多两行”及首页图标 40–42px 的规则。右侧抽屉已同步更新。\n\n## 11. 全部工具列表（最新确认）\n\n点击首页「全部工具」后，使用纵向列表，不再使用宫格。10 个工具对应 10 行，页面自然滚动。\n\n- 每行：36px 图标、工具名称、右箭头，整行可点击；建议行高 60–64px。\n- 列表统一白色圆角容器，行间细分隔线，最后一行无分隔线。\n- 保持后台排序和当前员工有效权限过滤，首页与全部页顺序一致。\n- 点击执行该端配置的目标链接；返回首页保留原来的筛选与滚动位置。\n- 无工具时展示空态及返回入口，权限变化时刷新列表。\n\n本节替代前文全部工具页“四列宫格 / 4＋4＋2”的样式要求；首页仍按第 10 节保持紧凑单行。右侧抽屉已同步。\n\n## 12. 后台配置独立 UX 页面\n\n后台配置交互及开发需求已迁入 [admin.html](./admin.html)。包含 10 个工具样例、列表筛选、排序、启停、新增 / 编辑表单、两端链接联动、企业范围选择及校验。占位工具默认停用，未配置真实页面不能启用。\n\n右侧抽屉集中说明配置字段、前端操作、后端生效、权限异常与验收。员工首页 UX 保留场景与展示规则，通过链接进入后台 UX，不再重复展示后台需求。\n\n本页仅使用内存数据演示，刷新恢复初始样例。图标素材、企业检索、内部路由及外链域名校验等正式能力需对接真实服务；原型不代表这些服务已接通。\n\n## 13. 后台展示位置、图标上传与排序（最新确认）\n\n- 每个工具的前端展示位置只能单选：企业主（owner）或员工（employee）。取消多选，不允许一个工具同时展示两端。\n- 每个工具只保存一组链接：target_type + target，链接随选定展示位置生效。此前“两端独立链接”规则作废。\n- 图标配置改为上传，支持 PNG / JPG / WebP，≤2MB，建议 128×128px 方图；提供预览、替换、移除及失败提示。新增必须上传；编辑保留已有图标，失败不覆盖。\n- 正式上传由服务端校验真实文件类型、大小并返回素材 ID / URL，保存只引用成功的素材。UX 上传只在浏览器本地读取与预览。\n- 排序统一为数值越大越靠前；同值按工具标识稳定排序。后台列表、员工首页、全部工具页使用同一规则。\n- 后端字段 display_position 只接受 owner / employee 单值，拒绝多选数组；现有多端记录上线前由平台管理员明确选择位置后迁移，不能自动扩大或猜测显示位置。\n\n本节覆盖前文适用端多选和两端链接的旧方案。", "front": "## 3. 前端开发需求\n\n\n\n### 前端补充\n\n- 先过滤权限、停用项和客户端不支持项，再计算数量及首页前 7 个，不能先截断再过滤。\n- 「全部工具」是导航入口，不是一项企业主权限，不计入开放工具数量；数量小于等于 8 时不显示。\n- 全部工具页沿用同一权限源、固定排序和点击规则，返回保留首页上下文。权限降到 8 个以内时首页自动移除「全部工具」。\n- 全部工具页打开期间如权限关闭，立即在下一次权限刷新后移除对应工具；失去全部权限时显示简洁空态和返回首页入口。\n- 首期扩展布局按工具短名称最多 6 个汉字适配，后台配置时校验；更长名称需提供短名称，不将文字压缩至不可读。\n- 首页不自动轮播、不横滑、不新增员工自行排序配置。未来确有个人常用需求时另立需求。\n\n", "back": "## 4. 后端开发需求\n\n\n\n## 5. 建议接口契约（新增提案，待后端确认）\n\n以下路径和结构是开发建议，不表示现有后端已提供。\n\n\n\n### 后端补充\n\n- 工具目录按 tool_key、display_name、icon_key、sort_order、status 管理；有效可见列表结合企业授权、员工授权和工具启用状态计算。\n- tool_key 为权限主键。工具路由由客户端已注册映射确定，接口不下发可执行脚本或未经校验的任意跳转目标。\n- 同 sort_order 时以 tool_key 作为稳定排序；首页和全部工具页使用同一顺序。\n- 可在当前权限接口中补充有序 tools 列表；需在联调前确定最终结构并统一替换文档第 5 节的三工具对象示例，避免两种结构混用。默认仍只开放已实现的三个工具，原型的工具四至工具十不属于正式目录。\n\n"}, {"id": "ENT-TOOL-002", "originalContent": "# 员工首页工具权限：场景 UX 与开发需求\n\n版本：2026-10-27 · 需求确认稿\n\n最新样式调整：以文末第 10 节“首页紧凑单行”、第 11 节“全部工具列表”及完整 UX 页右侧抽屉为准，替代前文首页两行及前七项规则。\n\n配套原型：[employee.html](./employee.html)。顶部「权限展示场景」仅用于评审，不属于员工首页正式功能。\n\n## 1. 确认范围\n\n员工首页在搜索框下方、项目列表上方展示企业主已开放的工具。移除「常用工具」「工具专区」等模块标题，仅呈现图标和工具名称。员工侧不展示权限开关、配置入口、关闭的工具或锁定占位。\n\n工具及固定顺序：组合提词 → 快捷提词 → 知乎新文。企业主控制当前企业内每位员工的可见权限。三个工具支持独立授权，才能覆盖单独开放任意工具的场景。\n\n「知乎新文」点击后进入内部「知乎书单」页面，不配置外部 H5 跳转地址。页面样式参考用户提供的知乎书单截图。\n\n本次交付为场景 UX 和前后端开发需求，非后端已完成或正式上线证明。\n\n## 2. 场景 UX\n\n工具权限用三位顺序表示：组合提词 / 快捷提词 / 知乎新文，1 为开放，0 为关闭。\n\n| 场景 | 权限 | 员工首页展示 | 布局 |\n| --- | --- | --- | --- |\n| S01 | 100 | 仅组合提词 | 整行入口：左侧图标、中间名称、右侧箭头 |\n| S02 | 010 | 仅快捷提词 | 整行入口：左侧图标、中间名称、右侧箭头 |\n| S03 | 001 | 仅知乎新文 | 整行入口：左侧蓝色「知」字图标、中间名称、右侧箭头 |\n| S04 | 110 | 组合提词、快捷提词 | 两列等宽，图标上、名称下 |\n| S05 | 101 | 组合提词、知乎新文 | 两列等宽，图标上、名称下 |\n| S06 | 011 | 快捷提词、知乎新文 | 两列等宽，图标上、名称下 |\n| S07 | 111 | 三个工具全部展示 | 三列等宽，图标上、名称下 |\n| S08 | 000 | 无工具入口 | 工具模块整体隐藏，项目列表上移，无空白占位 |\n\n### 视觉与交互\n\n- 工具区使用单个白色圆角容器，左右与搜索框、项目列表对齐；不再增加标题行和说明文字。\n- 单工具使用紧凑整行入口，避免只占三分之一宽度或放大为宣传卡片；整行可点击。\n- 双工具 / 三工具平均分配可用宽度，不保留已关闭工具的位置；每个图标与名称构成完整可点击区域。\n- 建议容器圆角 12px、内边距 12px；图标 40–42px；名称 12–14px。单工具整行高度约 68–72px，多工具容器高度约 88–92px。以原型和实际屏幕适配为准。\n- 适配 320 / 375 / 414px 屏宽，名称不截断、不换行；触控区域至少 44×44px，支持键盘聚焦。\n- 首页不出现「未开通」「请联系企业主」等权限提示。仅在用户通过旧链接直接访问受限页面时提示无权限。\n- 组合提词、快捷提词沿用原有页面；知乎新文进入知乎书单。返回首页后保留项目筛选、搜索和列表位置。\n\n## 3. 前端开发需求\n\n### 3.1 权限驱动与动态排布\n\n1. 从服务端获取当前企业、当前员工关系下的有效工具权限，不以本地开关作为授权依据。\n2. 将允许的工具按固定顺序过滤为 visibleTools，按数量渲染 0 / 1 / 2 / 3 场景；图标与名称来自固定工具定义。\n3. 不再使用同一个提词权限同时决定两个入口，接入独立组合提词与快捷提词权限。\n4. 初次加载权限期间不展示工具；可暂时保留一个紧凑骨架，避免闪现未授权工具。加载失败或身份无效时隐藏工具区，不将失败当作「全部开放」。\n5. 用户重新进入首页时刷新权限。切换企业、退出登录或员工关系变化时立即清除旧权限与旧书单，不能沿用上一个企业的数据。\n6. 点击工具入口和进入工具页时均检查最新可用权限；接口返回权限失效时清空相关内容，提示并返回首页。前端校验不替代后端鉴权。\n7. 接口缺失某项权限默认关闭。显式返回 false 优先于旧字段，不得因兼容逻辑重新开启。\n\n### 3.2 知乎书单页面\n\n- 顶部返回 + 页面名「知乎书单」，保留参考图橙红渐变头图。\n- 搜索框按作品标题搜索，支持键盘搜索、清空、无结果状态；新查询重置分页。\n- 排序：更新时间最新优先、更新时间最早优先、盐选点赞从高到低。\n- 筛选：标签筛选（本期单选）；标签候选由接口返回。搜索、标签和排序共同生效。\n- 卡片包含作品标题、最多两行简介、标签、作者、作者获赞 / 粉丝、更新时间及五项数据：盐选点赞、盐选评论、回答点赞、回答评论、回答收藏。\n- 已知统计为 0 时显示 0，未知值显示「—」；不将缺失数据补成 0。暂无作者等非必要内容可省略。\n- 支持分页、加载更多、刷新、请求失败重试。筛选和排序作用于全部匹配数据，不能只处理当前已加载列表。\n- 多次搜索或筛选时只接收最后一次请求结果，防止较早请求覆盖新条件；分页失败保持已有卡片，重试不跳页、不重复插入。\n- 权限未开通、官方源未配置、书库暂无作品、搜索无结果、请求失败分别呈现对应状态。\n- 卡片暂作为书单信息展示，不新增申请、提词、复制或作品详情跳转流程。\n- 原型中的示例作品和数字仅用于样式评审，不作为正式数据写入。\n\n## 4. 后端开发需求\n\n### 4.1 权限模型与企业主配置\n\n- 按「企业 ID + 员工关系 ID + 工具标识」存储独立权限，不使用全平台用户 ID 作为唯一授权维度。\n- 工具标识固定为 compose_prompt、quick_prompt、zhihu_article；新员工默认关闭，企业主明确开启后生效。\n- 企业主员工权限管理中提供三个独立工具开关。可复用现有单员工 / 批量操作框架，批量接口使用员工关系 ID 列表。\n- 单次提交校验全部员工均属于当前企业且可管理；存在无效或越权对象时整批失败，不允许静默部分成功。校验通过后事务保存，返回最终权限版本。\n- 企业主只能管理自己企业内员工的权限。员工不能调用权限保存接口。\n- 所有工具业务接口及书单接口必须重新校验有效员工关系和工具权限；仅隐藏入口不足以限制访问。\n- 开关变化记录操作人、企业、员工关系、工具、修改前后值、时间与权限版本。\n- 默认关闭不追溯清空历史任务或历史记录；历史数据访问沿用原有业务规则。\n\n### 4.2 旧权限迁移与兼容\n\n当前仓库使用 can_quick_prompt / quick_prompt_enabled 同时控制组合提词与快捷提词，已有 quickPromptPermissionSave 接口及字节项目权限前置规则。\n\n- 迁移时按旧权限生成两项独立权限：旧开启 → 两项开启；旧关闭或缺失 → 两项关闭。知乎新文默认关闭。\n- 迁移后 compose_prompt 和 quick_prompt 独立保存；不能每次读取旧字段时覆盖新配置。\n- 新保存接口沿用现有字节项目依赖校验。确有项目依赖时返回明确错误，不隐式开放项目；若需联动开项目，复用已确认的显式授权流程并原子保存。\n- 旧客户端仅能表达「两项同时开关」，与新独立授权不完全兼容。发布时建议要求刷新 / 升级客户端；服务端应对旧写接口增加版本校验，避免覆盖已拆分权限。\n- 旧读取字段可暂按“两项都开启才返回开启”兼容，不能将两项取或后开放旧客户端两个入口。最终下线时间由发布计划确认。\n\n### 4.3 官方书库\n\n- 接入经确认的知乎官方 / 授权作品数据源，不凭页面截图构造线上作品数据。\n- 支持标题搜索、标签筛选、全量结果排序和分页；同更新时间按作品 ID 排序以保持顺序稳定。\n- 存储作品唯一 ID、标题、简介、标签、作者信息、五项统计、作品更新时间和数据同步时间；统计缺失保留 null。\n- 缓存必须带上数据源和必要的企业范围，权限检查不得被缓存绕过。设置可配置同步周期，失败保留上次有效数据并记录异常。\n- 不接受客户端提交任意任务 ID 来选择数据源；由服务端配置已确认的官方源，按当前身份返回可访问数据。\n\n## 5. 建议接口契约（新增提案，待后端确认）\n\n以下路径和结构是开发建议，不表示现有后端已提供。\n\n### 员工有效权限 GET /api/v1.enterprise.tools/permissions\n\n请求身份从登录态获取，不由客户端指定企业或员工。\n\n```json\n{\n  \"code\": 1,\n  \"data\": {\n    \"permission_version\": 12,\n    \"tools\": {\n      \"compose_prompt\": true,\n      \"quick_prompt\": false,\n      \"zhihu_article\": true\n    }\n  }\n}\n```\n\n### 企业主保存 POST /api/v1.enterprise.staff/toolPermissionsSave\n\n```json\n{\n  \"ids\": [634],\n  \"expected_versions\": { \"634\": 12 },\n  \"tools\": { \"compose_prompt\": true, \"quick_prompt\": false, \"zhihu_article\": true }\n}\n```\n\ntools 为局部更新，未传字段保持原值；不接受空对象和未知工具。若 expected_versions 与当前版本不一致，返回版本冲突，前端重新读取并让企业主确认后再提交。成功响应返回受影响员工关系及其最新工具权限、版本，不能仅回显请求。\n\n### 书单 GET /api/v1.enterprise.tools/zhihuBooks\n\n参数：keyword（标题关键词）、tag（单个标签 ID）、sort（updated_desc / updated_asc / yanxuan_likes_desc）、page、limit。limit 默认 20，最大 50；tag 不存在或 sort 不合法时返回参数错误。\n\n```json\n{\n  \"code\": 1,\n  \"data\": {\n    \"list\": [{\n      \"id\": \"official-book-id\",\n      \"title\": \"作品标题\",\n      \"intro\": \"作品简介\",\n      \"tags\": [{ \"id\": \"romance\", \"name\": \"言情\" }],\n      \"author\": { \"name\": \"作者名\", \"likes\": 237000, \"followers\": 21000 },\n      \"updated_at\": \"2026-10-27T18:27:00+08:00\",\n      \"metrics\": {\n        \"yanxuan_likes\": 1, \"yanxuan_comments\": 1,\n        \"answer_likes\": 0, \"answer_comments\": 0, \"answer_favorites\": null\n      }\n    }],\n    \"total\": 1, \"page\": 1, \"limit\": 20,\n    \"available_tags\": [{ \"id\": \"romance\", \"name\": \"言情\" }],\n    \"synced_at\": \"2026-10-27T18:30:00+08:00\"\n  }\n}\n```\n\navailable_tags 返回当前书库可用标签，不能只从本页结果提取。示例仅说明结构，不是生产数据。\n\n错误语义：未登录、无有效企业关系、无工具权限、数据源未配置、参数错误、版本冲突、源服务异常；具体业务错误码与项目现有规范统一。无结果是成功且 list 为空，不作为接口失败。\n\n## 6. 联调与验收\n\n- [ ] S01–S08 全部覆盖，分别检查工具数量、名称、图标、顺序、布局与点击目标。\n- [ ] 工具区无标题、无权限开关、无关闭项占位；S08 搜索框与项目列表之间无残余容器和空白。\n- [ ] 单独关闭组合提词不影响快捷提词，反之亦然；知乎新文独立控制。\n- [ ] 320 / 375 / 414px 下无遮挡、溢出或名称截断；单工具整行可点。\n- [ ] 未授权员工通过旧链接 / 手工 URL / 直接 API 请求均无法获取工具数据。\n- [ ] 关闭权限后员工再次进入首页和目标页正确刷新；切换企业、退出登录不串权限 / 数据。\n- [ ] 企业主保存与批量保存校验企业归属、原子性及版本；旧接口不能覆盖新独立配置。\n- [ ] 搜索 + 标签 + 排序 + 分页共同生效；连续切换条件不被旧响应覆盖。\n- [ ] 数据源未配置、空库、无搜索结果、首屏失败、分页失败、权限撤销分别验收。\n- [ ] 明确区分统计 0 与未知值，刷新后更新数据，返回首页保留原列表上下文。\n\n## 7. 当前实现与待开发差异\n\n- 场景原型已覆盖 8 种权限组合，移除标题，支持知乎书单跳转展示。\n- 此前应用代码仍以旧共享提词权限控制两个入口，且保留工具标题；不能视为已满足本需求稿。\n- 此前书单页面预留 zhihu_book_task_id、Task/detail 作为临时接入思路，排序和标签只处理已加载结果。这些不作为最终后端契约；正式开发应按确认后的书库接口改为服务端全量搜索 / 筛选 / 排序。\n- 待开发：三个工具独立授权、企业主保存及批量配置、权限迁移、正式书库服务、前端联调与完整验收。\n- 待业务提供：官方 / 授权书库的数据来源、访问方式及同步要求。本项不阻碍首页场景 UX 评审。\n\n## 8. 工具数量扩展方案（本次补充）\n\n首页仍无模块标题，始终按员工实际有权限的工具数量排布，新增工具不改变核心规则。\n\n| 开放数量 | 首页展示 | 交互 |\n| --- | --- | --- |\n| 0 | 整块隐藏 | 无空白占位 |\n| 1 | 整行，图标 + 名称 + 右箭头 | 整行点击 |\n| 2–3 | 同行等分 | 点击各工具 |\n| 4 | 一行四列 | 不做横向滑动 |\n| 5–8 | 每行四列，最多两行；末行从左向右连续排布 | 不强行拉大末行图标，不保留关闭项占位 |\n| 超过 8 | 首页前 7 个已授权工具 + 第 8 格「全部工具」 | 打开内部全部工具页，按四列宫格展示全部已授权工具 |\n\n### 为什么采用宫格\n\n横向滑动会将部分工具藏在屏幕外，员工不易发现；左右翻页也增加操作。纵向单行列表在工具多时过高，会将项目列表推离首屏。因此，首页采用最多两行的四列宫格，大量工具通过明确的「全部工具」入口进入独立页面。\n\n5 个或 6 个工具时，末行保持左对齐及同样的列宽，避免为了填满空间而把相同工具渲染成不同尺寸。卡片内各图标与文字仍保持居中。\n\n### 前端补充\n\n- 先过滤权限、停用项和客户端不支持项，再计算数量及首页前 7 个，不能先截断再过滤。\n- 「全部工具」是导航入口，不是一项企业主权限，不计入开放工具数量；数量小于等于 8 时不显示。\n- 全部工具页沿用同一权限源、固定排序和点击规则，返回保留首页上下文。权限降到 8 个以内时首页自动移除「全部工具」。\n- 全部工具页打开期间如权限关闭，立即在下一次权限刷新后移除对应工具；失去全部权限时显示简洁空态和返回首页入口。\n- 首期扩展布局按工具短名称最多 6 个汉字适配，后台配置时校验；更长名称需提供短名称，不将文字压缩至不可读。\n- 首页不自动轮播、不横滑、不新增员工自行排序配置。未来确有个人常用需求时另立需求。\n\n### 后端补充\n\n- 工具目录按 tool_key、display_name、icon_key、sort_order、status 管理；有效可见列表结合企业授权、员工授权和工具启用状态计算。\n- tool_key 为权限主键。工具路由由客户端已注册映射确定，接口不下发可执行脚本或未经校验的任意跳转目标。\n- 同 sort_order 时以 tool_key 作为稳定排序；首页和全部工具页使用同一顺序。\n- 可在当前权限接口中补充有序 tools 列表；需在联调前确定最终结构并统一替换文档第 5 节的三工具对象示例，避免两种结构混用。默认仍只开放已实现的三个工具，原型的工具四至工具十不属于正式目录。\n\n### 扩展验收\n\n覆盖 4、5、6、8、9、10 个可见工具；特别验证 8→9 时第八格变为「全部工具」，9→8 时恢复为真实工具。首七项必须是过滤后排序结果；全部工具页完整展示第八项及其后工具，无遗漏、重复。所有数量场景在 320px 屏宽下不横向溢出。\n\n以上为对前文三工具布局规则的扩展；正式工具数量和目录以实际上线功能为准。\n\n## 9. 平台后台配置与完整页面需求抽屉（补充确认）\n\n完整场景 UX 页已集成右侧可收起的开发需求抽屉，含场景规则、后台配置、前端、后端 / 验收四个标签。开发可边切换权限场景边查看需求；抽屉和场景切换器属于评审工具，不进入正式员工首页。\n\n后台统一配置每个工具的：唯一标识、前端名称、图标、适用端（企业主 / 员工，可多选）、企业主跳转、员工跳转、注意事项、排序、启用状态、开放企业范围。选择哪一端，就必须填写该端链接；两端允许使用不同链接。\n\n链接支持已注册内部页面和平台允许域名下的 HTTPS 页面。知乎新文当前仍使用内部知乎书单页。后台配置与服务端校验通过后才能启用；无效链接不发布。前文仅允许固定客户端映射的限制更新为此规则。\n\n注意事项不堆在首页：内部目标页提供「使用说明」入口；外部链接在跳转前的说明弹窗展示，有说明时确认后跳转。\n\n企业主自用工具可见范围由后台控制；企业主给员工授权时只能操作已对该企业开放且适用员工侧的工具。企业主可见不意味着员工自动可见，员工最终权限必须同时满足后台启用、开放企业范围、适用员工侧、企业主授权。\n\n有效列表返回当前端身份对应的名称、图标、已校验链接、注意事项、排序和配置版本。全部工具页使用同一有效列表，10 个真实工具按 4＋4＋2 展示；首页前 7 个加导航入口，不少算、不重复。\n\n## 10. 首页紧凑单行（最新确认）\n\n工具区过大，会挤占项目列表。首页改为最多一行，完整工具集合仍在独立页面展示。\n\n- 0 个：整体隐藏。\n- 1 个：图标 + 名称 + 右箭头的紧凑整行，约 56px 高。\n- 2–4 个：同行等分，28px 图标在上、名称在下，整个区域约 68px 高。\n- 5 个及以上：首页只展示排序前 3 个 +「全部工具」，同样约 68px 高。\n- 全部工具页保留四列宫格、40–42px 图标；10 个工具按 4＋4＋2 完整展示。\n- 无标题、不横滑、不在首页展开多行；后台排序和独立授权规则不变。\n- 特别验收 4↔5 个时导航入口切换；先过滤权限再取前 3 个，不遗漏隐藏工具。全部页中第 4–10 个实际工具都需出现。\n\n本节取代前文“首页前 7 个 + 全部工具”“首页最多两行”及首页图标 40–42px 的规则。右侧抽屉已同步更新。\n\n## 11. 全部工具列表（最新确认）\n\n点击首页「全部工具」后，使用纵向列表，不再使用宫格。10 个工具对应 10 行，页面自然滚动。\n\n- 每行：36px 图标、工具名称、右箭头，整行可点击；建议行高 60–64px。\n- 列表统一白色圆角容器，行间细分隔线，最后一行无分隔线。\n- 保持后台排序和当前员工有效权限过滤，首页与全部页顺序一致。\n- 点击执行该端配置的目标链接；返回首页保留原来的筛选与滚动位置。\n- 无工具时展示空态及返回入口，权限变化时刷新列表。\n\n本节替代前文全部工具页“四列宫格 / 4＋4＋2”的样式要求；首页仍按第 10 节保持紧凑单行。右侧抽屉已同步。\n\n## 12. 后台配置独立 UX 页面\n\n后台配置交互及开发需求已迁入 [admin.html](./admin.html)。包含 10 个工具样例、列表筛选、排序、启停、新增 / 编辑表单、两端链接联动、企业范围选择及校验。占位工具默认停用，未配置真实页面不能启用。\n\n右侧抽屉集中说明配置字段、前端操作、后端生效、权限异常与验收。员工首页 UX 保留场景与展示规则，通过链接进入后台 UX，不再重复展示后台需求。\n\n本页仅使用内存数据演示，刷新恢复初始样例。图标素材、企业检索、内部路由及外链域名校验等正式能力需对接真实服务；原型不代表这些服务已接通。\n\n## 13. 后台展示位置、图标上传与排序（最新确认）\n\n- 每个工具的前端展示位置只能单选：企业主（owner）或员工（employee）。取消多选，不允许一个工具同时展示两端。\n- 每个工具只保存一组链接：target_type + target，链接随选定展示位置生效。此前“两端独立链接”规则作废。\n- 图标配置改为上传，支持 PNG / JPG / WebP，≤2MB，建议 128×128px 方图；提供预览、替换、移除及失败提示。新增必须上传；编辑保留已有图标，失败不覆盖。\n- 正式上传由服务端校验真实文件类型、大小并返回素材 ID / URL，保存只引用成功的素材。UX 上传只在浏览器本地读取与预览。\n- 排序统一为数值越大越靠前；同值按工具标识稳定排序。后台列表、员工首页、全部工具页使用同一规则。\n- 后端字段 display_position 只接受 owner / employee 单值，拒绝多选数组；现有多端记录上线前由平台管理员明确选择位置后迁移，不能自动扩大或猜测显示位置。\n\n本节覆盖前文适用端多选和两端链接的旧方案。", "front": "## 3. 前端开发需求\n\n\n\n### 前端补充\n\n- 先过滤权限、停用项和客户端不支持项，再计算数量及首页前 7 个，不能先截断再过滤。\n- 「全部工具」是导航入口，不是一项企业主权限，不计入开放工具数量；数量小于等于 8 时不显示。\n- 全部工具页沿用同一权限源、固定排序和点击规则，返回保留首页上下文。权限降到 8 个以内时首页自动移除「全部工具」。\n- 全部工具页打开期间如权限关闭，立即在下一次权限刷新后移除对应工具；失去全部权限时显示简洁空态和返回首页入口。\n- 首期扩展布局按工具短名称最多 6 个汉字适配，后台配置时校验；更长名称需提供短名称，不将文字压缩至不可读。\n- 首页不自动轮播、不横滑、不新增员工自行排序配置。未来确有个人常用需求时另立需求。\n\n", "back": "## 4. 后端开发需求\n\n\n\n## 5. 建议接口契约（新增提案，待后端确认）\n\n以下路径和结构是开发建议，不表示现有后端已提供。\n\n\n\n### 后端补充\n\n- 工具目录按 tool_key、display_name、icon_key、sort_order、status 管理；有效可见列表结合企业授权、员工授权和工具启用状态计算。\n- tool_key 为权限主键。工具路由由客户端已注册映射确定，接口不下发可执行脚本或未经校验的任意跳转目标。\n- 同 sort_order 时以 tool_key 作为稳定排序；首页和全部工具页使用同一顺序。\n- 可在当前权限接口中补充有序 tools 列表；需在联调前确定最终结构并统一替换文档第 5 节的三工具对象示例，避免两种结构混用。默认仍只开放已实现的三个工具，原型的工具四至工具十不属于正式目录。\n\n"}, {"id": "ENT-UX-006", "originalContent": "员工端 · 页面适配 UX\n\n员工端 · 页面适配 UX\n按提供的线上截图还原 · 首页 / 我的调整预览\n员工侧 UX 预览企业号需求池 3\n\n  \n\n企业号需求池\n集中查看需求内容、UX 方案与交付路线待评审\n\nENT-UX-003员工 / 企业主消息中心2026-10-16 · 待评审\n员工消息中心与离职双向确认通知\n站内信分类规则\n企业主与员工消息中心统一提供“系统”“平台”两个 Tab，默认展示系统。\n系统：员工加入、离职相关通知；离职待确认、主动确认、拒绝、超时确认均归入系统。\n平台：出单审核结果、订单结果；两端按同一规则分类，仅展示当前账号有权限接收的消息。\n切换分类仅筛选消息，不改变已读和申请状态；无消息时展示对应分类空态。倒计时仅在系统分类及离职详情展示。\n24小时超时确认\n2026-10-19 补充：计时从企业主成功提交离职申请的服务端时间开始，截止时间为提交时间 + 24小时。员工消息及风险弹窗显示一句动态提示：“请在 HH:MM:SS 内处理离职申请，逾期未操作将默认同意离职（超时确认）。”\n待确认 → 员工主动确认 / 员工拒绝 / 超时确认。超时确认不伪装为员工主动同意，双方消息、处理时间及操作来源须分别留痕。\n倒计时刷新、切换页面及暂不处理均不重置；每条新申请使用独立提交时间，拒绝或主动确认后停止计时。\n到期由服务端任务原子检查最新状态，只处理仍待确认的申请。员工确认、拒绝与超时竞争只能有一个最终结果，使用服务端时间。\n企业主收到“员工xx离职超时确认”；员工收到对应回执；若解绑异常，展示“超时确认，解绑处理中”，不能误报成功。\n企业主协议与员工风险提示均显著说明24小时默认同意规则；待法务评审，不以本原型证明该规则法律效力。\nDemo 支持实时倒计时、刷新保留及“模拟24小时到期”，正式系统须保证关页、离线时服务端仍能执行。\n三页 UX 结构\n01 企业主员工列表与权限管理：从对应员工进入权限管理，关闭管理权限 → 保存 → 阅读并勾选企业主协议 → 发送申请。关闭开关或取消均不直接生效。\n02 企业主消息中心：独立位置，仅查看待确认、已确认、已拒绝通知及详情，不放离职控制开关。\n03 员工消息中心：查看离职待确认消息，打开简洁风险弹窗，勾选确认或拒绝、暂不处理。\n企业主发起离职后进入待确认，员工阅读风险并确认或拒绝。企业主收到待确认、确认、拒绝三类站内消息。本需求更新 ENT-UX-002：员工主动确认或24小时超时确认前不直接解绑。\n查看双端消息中心与确认弹窗 Demo →\n需求与操作流程\n企业主发起\n保留关闭管理权限并保存的入口，通过弹窗展示企业主离职协议全文入口、操作授权及责任确认；默认不勾选，全部勾选后才可发送申请。协议包含关联切割、历史结算、禁止恶意操作、员工意愿、平台责任边界及操作留痕。生成唯一申请编号，推送员工“离职待确认通知”，同时推送企业主“员工xx离职待确认”。待确认期间关系、权限保持不变，不回收余额。\n员工消息中心\n新增站内消息入口、未读数量及列表。通知详情展示发起企业、企业主、员工和时间，询问是否与该企业主解除当前企业关联。阅读不等于同意；暂不处理在24小时期限内维持待确认；自企业主提交申请起24小时未确认或拒绝，则进入“超时确认”，按默认同意执行并通知双方。\n风险告知与勾选\n说明企业权限、后续任务、部分企业共享数据访问会因关系解除停止或变化，开发前列明具体受影响数据。底层规则保留历史收益结算及合法查询、申诉渠道，不因弹窗简化而改变。员工弹窗仅展示精简的关系解除和企业关联数据风险告知、风险知悉及自愿解除勾选，支持确认、拒绝、暂不处理。移除重复询问句、余额权益说明、金额及劳动关系提示；上述结算责任等完整内容保留在企业主协议和平台规则中。勾选默认不选，全选后可确认。\n确认并通知\n员工确认后校验身份、申请编号和最新状态，执行解绑。企业主收到“员工xx已进行离职确认”；存在异常审核时应展示“员工已确认，解绑审核中”，不得误显示已离职。员工也收到回执，历史结算继续。\n拒绝并通知\n独立拒绝按钮无需勾选同意，二次确认并支持选填原因。企业主收到“员工xx已拒绝离职申请”，展示时间和原因；本次申请结束，关系不变。沟通后可重新发起新申请，旧记录保留。\n验收及约束\n待确认、确认、拒绝均推送企业主；未读状态和业务状态分别保存。\n同一企业和员工仅一条有效申请；重复提交、消息重试均去重。\n服务端校验身份、编号、版本、最新状态；确认与拒绝原子更新，只允许一次成功。\n旧消息只读，不允许操作另一条新申请；拒绝后重发使用新编号。\n通知持久化、跨端可见、可靠投递及失败重试；记录操作时间、风险告知及协议版本。\n只有关联员工和有权限的企业主可访问；覆盖加载失败、提交失败、通知失败及异常审核。\n不因离职阻断员工历史结算与申诉；确认状态与解绑执行状态分开展示。\n路线与待确认\n需求与 Demo 已整理 → 产品 / 法务评审 → 消息和关联状态接口 → 双端开发 → 测试 → 上线。负责人、优先级、排期待定，需补齐受影响数据清单及异常审核规则。Demo 仅为单页模拟，尚未接入真实站内消息与服务端。\n\n    \nENT-UX-002企业主 · 员工管理更新：2026-10-14待产品 / 法务评审\n\n员工离职确认弹窗\n2026-10-16 更新：以 ENT-UX-003 的双向确认为准，员工确认前不直接解绑；旧 Demo 仅作样式参考。\n\n沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。\n\n打开可交互弹窗 Demo →\n\n单项需求范围\n\n      \n触发方式\n仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。\n\n弹窗展示\n显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。\n\n协议与确认\n提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。\n\n结算分流\n无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。\n\n结果与留痕\n防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。\n\n    \n验收标准\n\n沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。\n身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。\n取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。\n有余额、零余额、结算异常及余额加载失败分别验证。\n离职不清零、不自动回收员工已有款项；审核中不提前解绑。\n员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。\n\n交付路线与评审事项\n需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。\n\n  \n\nENT-UX-001员工侧更新：2026-10-14\n\n员工首页与“我的”页面信息调整\n\n将身份与企业信息集中到“我的”，首页原位置承接 Banner，并按后台配置数量适配组件布局。\n    查看对应 UX 预览 →\n\n需求内容\n\n      \n顶部卡片迁移与整合\n首页原顶部卡片移至“我的”，与原个人卡片合并。保留用户头像、昵称、角色、手机号、用户 ID、企业头像、企业名称、简介和加入时间。重复字段只展示一次；缺失字段不展示“null”或“undefined”。站外登录入口保留在“我的”。\n\n首页 Banner 区域\n在原卡片位置展示同尺寸 Banner，保留线上圆角、间距及页面顺序。支持多张轮播和指示点，单张不展示指示点。预览中的 Banner 文案为示意；实际素材和跳转目标由配置提供。\n\n组件数量兼容\n按有效配置顺序展示 1–4 个组件。1 个通栏；2 个两列；3 个首项通栏、后两项并排；4 个两行两列。不留空白占位，长标题允许换行。第 4 项为布局示意，实际名称及入口由配置决定。\n\n线上样式保真\n以提供的线上截图为基准，保留淡紫色卡片、按钮、字体层级、项目卡片和首页 / 收益台 / 我的导航。搜索、项目分类及任务操作沿用既有流程。\n\n    \n需求路线\n\n      \n已整理需求录入需求稿 + UX 预览\n\n待评审产品 / UX 评审确认布局与配置边界\n\n待开始开发适配前端页面 + 配置对接\n\n待开始测试验收视觉、数量、数据与跳转\n\n待开始上线确认发布后核对实际页面\n\n    \n路线用于需求交接；负责人、优先级与排期尚未确认。当前仅完成需求及预览，开发、测试与上线尚未开始。\n\n验收标准\n\n      \n首页不再展示原身份卡片；Banner 与原卡片位置、尺寸一致。\n\n“我的”顶部只有一张整合卡片，用户和企业信息完整且无重复。\n\n1、2、3、4 个组件均无空位、遮挡或溢出，顺序与配置一致。\n\n在 320 / 375 / 414px 宽度下内容可读；底部导航不遮挡操作。\n\n站外登录、搜索、项目分类、参与任务和回填流程可正常使用。\n\n实际 Banner 素材、链接及组件名称与后台配置一致。\n\n    \n评审需确认\n\n无 Banner 配置时的展示方式；组件配置为 0 个、异常或超过 4 个时的处理；Banner 是否自动轮播及切换间隔。以上边界尚未由本次需求确定。\n\n交接方式\n转发完整预览压缩包，解压后打开 employee-home-profile-ux.html。需求池与 UX 在同一页面，头像及项目图标已附带；图标库加载需要网络。复制需求摘要\n\n  \n\n    配置组件数量 1 个 · 通栏2 个 · 两列3 个 · 首项通栏 + 两列4 个 · 两行两列\n\n  \n\n    \n\n      首页•••　│　◉\n\n        \n\n          员工专属活动\n精选项目 · 创作新机会\n精选任务上线，开启新的机会\n\n查看活动 →\n\n          \n\n        \n输入任务名 / 项目名搜索\n\n        \n项目列表\n\n全部品牌推文品牌短剧品牌网盘品牌应用海外短剧\n\n          \n网易云有声书 \n数据更新：06-25\n参与任务立即回填\n\n次元姬 \n数据更新：06-25\n参与任务立即回填\n\n红果短剧APP-网文 \n数据更新：06-25\n参与任务立即回填\n\n知乎故事聚星 \n数据更新：06-25\n参与任务立即回填\n\n      \n      首页收益台我的\n\n    \n\n      我的•••　│　◉\n\n        \n\n          \n\n用户2317 歪比巴卜\n152****2317　用户ID: 6\n\n?\n横说竖说\n\n加入时间　2026-09-09 21:53:41\n\n        \n更多功能\n账号报备\n\n我的词库\n\n站外登录\n\n      首页收益台我的\n\n  \n\n首页 · 同尺寸替换\n原企业 + 员工卡片替换为轮播 Banner，保留顶部高度与圆角。示意内容可切换。我的 · 信息合并\n用户头像、昵称、手机号、ID、角色及企业 Logo、名称、简介、加入时间整合为一张卡片。组件 · 按配置适配\n1 个通栏；2 个并排；3 个首项通栏 + 两项并排；4 个两行两列。第 4 项为占位示意。", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n员工端 · 页面适配 UX\n\n员工端 · 页面适配 UX\n按提供的线上截图还原 · 首页 / 我的调整预览\n员工侧 UX 预览企业号需求池 3\n\n  \n\n企业号需求池\n集中查看需求内容、UX 方案与交付路线待评审\n\nENT-UX-003员工 / 企业主消息中心2026-10-16 · 待评审\n员工消息中心与离职双向确认通知\n站内信分类规则\n企业主与员工消息中心统一提供“系统”“平台”两个 Tab，默认展示系统。\n系统：员工加入、离职相关通知；离职待确认、主动确认、拒绝、超时确认均归入系统。\n平台：出单审核结果、订单结果；两端按同一规则分类，仅展示当前账号有权限接收的消息。\n切换分类仅筛选消息，不改变已读和申请状态；无消息时展示对应分类空态。倒计时仅在系统分类及离职详情展示。\n24小时超时确认\n2026-10-19 补充：计时从企业主成功提交离职申请的服务端时间开始，截止时间为提交时间 + 24小时。员工消息及风险弹窗显示一句动态提示：“请在 HH:MM:SS 内处理离职申请，逾期未操作将默认同意离职（超时确认）。”\n待确认 → 员工主动确认 / 员工拒绝 / 超时确认。超时确认不伪装为员工主动同意，双方消息、处理时间及操作来源须分别留痕。\n倒计时刷新、切换页面及暂不处理均不重置；每条新申请使用独立提交时间，拒绝或主动确认后停止计时。\n到期由服务端任务原子检查最新状态，只处理仍待确认的申请。员工确认、拒绝与超时竞争只能有一个最终结果，使用服务端时间。\n企业主收到“员工xx离职超时确认”；员工收到对应回执；若解绑异常，展示“超时确认，解绑处理中”，不能误报成功。\n企业主协议与员工风险提示均显著说明24小时默认同意规则；待法务评审，不以本原型证明该规则法律效力。\nDemo 支持实时倒计时、刷新保留及“模拟24小时到期”，正式系统须保证关页、离线时服务端仍能执行。\n三页 UX 结构\n01 企业主员工列表与权限管理：从对应员工进入权限管理，关闭管理权限 → 保存 → 阅读并勾选企业主协议 → 发送申请。关闭开关或取消均不直接生效。\n02 企业主消息中心：独立位置，仅查看待确认、已确认、已拒绝通知及详情，不放离职控制开关。\n03 员工消息中心：查看离职待确认消息，打开简洁风险弹窗，勾选确认或拒绝、暂不处理。\n企业主发起离职后进入待确认，员工阅读风险并确认或拒绝。企业主收到待确认、确认、拒绝三类站内消息。本需求更新 ENT-UX-002：员工主动确认或24小时超时确认前不直接解绑。\n查看双端消息中心与确认弹窗 Demo →\n需求与操作流程\n企业主发起\n保留关闭管理权限并保存的入口，通过弹窗展示企业主离职协议全文入口、操作授权及责任确认；默认不勾选，全部勾选后才可发送申请。协议包含关联切割、历史结算、禁止恶意操作、员工意愿、平台责任边界及操作留痕。生成唯一申请编号，推送员工“离职待确认通知”，同时推送企业主“员工xx离职待确认”。待确认期间关系、权限保持不变，不回收余额。\n员工消息中心\n新增站内消息入口、未读数量及列表。通知详情展示发起企业、企业主、员工和时间，询问是否与该企业主解除当前企业关联。阅读不等于同意；暂不处理在24小时期限内维持待确认；自企业主提交申请起24小时未确认或拒绝，则进入“超时确认”，按默认同意执行并通知双方。\n风险告知与勾选\n说明企业权限、后续任务、部分企业共享数据访问会因关系解除停止或变化，开发前列明具体受影响数据。底层规则保留历史收益结算及合法查询、申诉渠道，不因弹窗简化而改变。员工弹窗仅展示精简的关系解除和企业关联数据风险告知、风险知悉及自愿解除勾选，支持确认、拒绝、暂不处理。移除重复询问句、余额权益说明、金额及劳动关系提示；上述结算责任等完整内容保留在企业主协议和平台规则中。勾选默认不选，全选后可确认。\n确认并通知\n员工确认后校验身份、申请编号和最新状态，执行解绑。企业主收到“员工xx已进行离职确认”；存在异常审核时应展示“员工已确认，解绑审核中”，不得误显示已离职。员工也收到回执，历史结算继续。\n拒绝并通知\n独立拒绝按钮无需勾选同意，二次确认并支持选填原因。企业主收到“员工xx已拒绝离职申请”，展示时间和原因；本次申请结束，关系不变。沟通后可重新发起新申请，旧记录保留。\n验收及约束\n待确认、确认、拒绝均推送企业主；未读状态和业务状态分别保存。\n同一企业和员工仅一条有效申请；重复提交、消息重试均去重。\n服务端校验身份、编号、版本、最新状态；确认与拒绝原子更新，只允许一次成功。\n旧消息只读，不允许操作另一条新申请；拒绝后重发使用新编号。\n通知持久化、跨端可见、可靠投递及失败重试；记录操作时间、风险告知及协议版本。\n只有关联员工和有权限的企业主可访问；覆盖加载失败、提交失败、通知失败及异常审核。\n不因离职阻断员工历史结算与申诉；确认状态与解绑执行状态分开展示。\n路线与待确认\n需求与 Demo 已整理 → 产品 / 法务评审 → 消息和关联状态接口 → 双端开发 → 测试 → 上线。负责人、优先级、排期待定，需补齐受影响数据清单及异常审核规则。Demo 仅为单页模拟，尚未接入真实站内消息与服务端。\n\n    \nENT-UX-002企业主 · 员工管理更新：2026-10-14待产品 / 法务评审\n\n员工离职确认弹窗\n2026-10-16 更新：以 ENT-UX-003 的双向确认为准，员工确认前不直接解绑；旧 Demo 仅作样式参考。\n\n沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。\n\n打开可交互弹窗 Demo →\n\n单项需求范围\n\n      \n触发方式\n仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。\n\n弹窗展示\n显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。\n\n协议与确认\n提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。\n\n结算分流\n无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。\n\n结果与留痕\n防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。\n\n    \n验收标准\n\n沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。\n身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。\n取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。\n有余额、零余额、结算异常及余额加载失败分别验证。\n离职不清零、不自动回收员工已有款项；审核中不提前解绑。\n员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。\n\n交付路线与评审事项\n需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。\n\n  \n\nENT-UX-001员工侧更新：2026-10-14\n\n员工首页与“我的”页面信息调整\n\n将身份与企业信息集中到“我的”，首页原位置承接 Banner，并按后台配置数量适配组件布局。\n    查看对应 UX 预览 →\n\n需求内容\n\n      \n顶部卡片迁移与整合\n首页原顶部卡片移至“我的”，与原个人卡片合并。保留用户头像、昵称、角色、手机号、用户 ID、企业头像、企业名称、简介和加入时间。重复字段只展示一次；缺失字段不展示“null”或“undefined”。站外登录入口保留在“我的”。\n\n首页 Banner 区域\n在原卡片位置展示同尺寸 Banner，保留线上圆角、间距及页面顺序。支持多张轮播和指示点，单张不展示指示点。预览中的 Banner 文案为示意；实际素材和跳转目标由配置提供。\n\n组件数量兼容\n按有效配置顺序展示 1–4 个组件。1 个通栏；2 个两列；3 个首项通栏、后两项并排；4 个两行两列。不留空白占位，长标题允许换行。第 4 项为布局示意，实际名称及入口由配置决定。\n\n线上样式保真\n以提供的线上截图为基准，保留淡紫色卡片、按钮、字体层级、项目卡片和首页 / 收益台 / 我的导航。搜索、项目分类及任务操作沿用既有流程。\n\n    \n需求路线\n\n      \n已整理需求录入需求稿 + UX 预览\n\n待评审产品 / UX 评审确认布局与配置边界\n\n待开始开发适配前端页面 + 配置对接\n\n待开始测试验收视觉、数量、数据与跳转\n\n待开始上线确认发布后核对实际页面\n\n    \n路线用于需求交接；负责人、优先级与排期尚未确认。当前仅完成需求及预览，开发、测试与上线尚未开始。\n\n验收标准\n\n      \n首页不再展示原身份卡片；Banner 与原卡片位置、尺寸一致。\n\n“我的”顶部只有一张整合卡片，用户和企业信息完整且无重复。\n\n1、2、3、4 个组件均无空位、遮挡或溢出，顺序与配置一致。\n\n在 320 / 375 / 414px 宽度下内容可读；底部导航不遮挡操作。\n\n站外登录、搜索、项目分类、参与任务和回填流程可正常使用。\n\n实际 Banner 素材、链接及组件名称与后台配置一致。\n\n    \n评审需确认\n\n无 Banner 配置时的展示方式；组件配置为 0 个、异常或超过 4 个时的处理；Banner 是否自动轮播及切换间隔。以上边界尚未由本次需求确定。\n\n交接方式\n转发完整预览压缩包，解压后打开 employee-home-profile-ux.html。需求池与 UX 在同一页面，头像及项目图标已附带；图标库加载需要网络。复制需求摘要\n\n  \n\n    配置组件数量 1 个 · 通栏2 个 · 两列3 个 · 首项通栏 + 两列4 个 · 两行两列\n\n  \n\n    \n\n      首页•••　│　◉\n\n        \n\n          员工专属活动\n精选项目 · 创作新机会\n精选任务上线，开启新的机会\n\n查看活动 →\n\n          \n\n        \n输入任务名 / 项目名搜索\n\n        \n项目列表\n\n全部品牌推文品牌短剧品牌网盘品牌应用海外短剧\n\n          \n网易云有声书 \n数据更新：06-25\n参与任务立即回填\n\n次元姬 \n数据更新：06-25\n参与任务立即回填\n\n红果短剧APP-网文 \n数据更新：06-25\n参与任务立即回填\n\n知乎故事聚星 \n数据更新：06-25\n参与任务立即回填\n\n      \n      首页收益台我的\n\n    \n\n      我的•••　│　◉\n\n        \n\n          \n\n用户2317 歪比巴卜\n152****2317　用户ID: 6\n\n?\n横说竖说\n\n加入时间　2026-09-09 21:53:41\n\n        \n更多功能\n账号报备\n\n我的词库\n\n站外登录\n\n      首页收益台我的\n\n  \n\n首页 · 同尺寸替换\n原企业 + 员工卡片替换为轮播 Banner，保留顶部高度与圆角。示意内容可切换。我的 · 信息合并\n用户头像、昵称、手机号、ID、角色及企业 Logo、名称、简介、加入时间整合为一张卡片。组件 · 按配置适配\n1 个通栏；2 个并排；3 个首项通栏 + 两项并排；4 个两行两列。第 4 项为占位示意。", "back": "原始资料未单列后端开发说明，接口契约需确认。以下为来源内容：\n\n员工端 · 页面适配 UX\n\n员工端 · 页面适配 UX\n按提供的线上截图还原 · 首页 / 我的调整预览\n员工侧 UX 预览企业号需求池 3\n\n  \n\n企业号需求池\n集中查看需求内容、UX 方案与交付路线待评审\n\nENT-UX-003员工 / 企业主消息中心2026-10-16 · 待评审\n员工消息中心与离职双向确认通知\n站内信分类规则\n企业主与员工消息中心统一提供“系统”“平台”两个 Tab，默认展示系统。\n系统：员工加入、离职相关通知；离职待确认、主动确认、拒绝、超时确认均归入系统。\n平台：出单审核结果、订单结果；两端按同一规则分类，仅展示当前账号有权限接收的消息。\n切换分类仅筛选消息，不改变已读和申请状态；无消息时展示对应分类空态。倒计时仅在系统分类及离职详情展示。\n24小时超时确认\n2026-10-19 补充：计时从企业主成功提交离职申请的服务端时间开始，截止时间为提交时间 + 24小时。员工消息及风险弹窗显示一句动态提示：“请在 HH:MM:SS 内处理离职申请，逾期未操作将默认同意离职（超时确认）。”\n待确认 → 员工主动确认 / 员工拒绝 / 超时确认。超时确认不伪装为员工主动同意，双方消息、处理时间及操作来源须分别留痕。\n倒计时刷新、切换页面及暂不处理均不重置；每条新申请使用独立提交时间，拒绝或主动确认后停止计时。\n到期由服务端任务原子检查最新状态，只处理仍待确认的申请。员工确认、拒绝与超时竞争只能有一个最终结果，使用服务端时间。\n企业主收到“员工xx离职超时确认”；员工收到对应回执；若解绑异常，展示“超时确认，解绑处理中”，不能误报成功。\n企业主协议与员工风险提示均显著说明24小时默认同意规则；待法务评审，不以本原型证明该规则法律效力。\nDemo 支持实时倒计时、刷新保留及“模拟24小时到期”，正式系统须保证关页、离线时服务端仍能执行。\n三页 UX 结构\n01 企业主员工列表与权限管理：从对应员工进入权限管理，关闭管理权限 → 保存 → 阅读并勾选企业主协议 → 发送申请。关闭开关或取消均不直接生效。\n02 企业主消息中心：独立位置，仅查看待确认、已确认、已拒绝通知及详情，不放离职控制开关。\n03 员工消息中心：查看离职待确认消息，打开简洁风险弹窗，勾选确认或拒绝、暂不处理。\n企业主发起离职后进入待确认，员工阅读风险并确认或拒绝。企业主收到待确认、确认、拒绝三类站内消息。本需求更新 ENT-UX-002：员工主动确认或24小时超时确认前不直接解绑。\n查看双端消息中心与确认弹窗 Demo →\n需求与操作流程\n企业主发起\n保留关闭管理权限并保存的入口，通过弹窗展示企业主离职协议全文入口、操作授权及责任确认；默认不勾选，全部勾选后才可发送申请。协议包含关联切割、历史结算、禁止恶意操作、员工意愿、平台责任边界及操作留痕。生成唯一申请编号，推送员工“离职待确认通知”，同时推送企业主“员工xx离职待确认”。待确认期间关系、权限保持不变，不回收余额。\n员工消息中心\n新增站内消息入口、未读数量及列表。通知详情展示发起企业、企业主、员工和时间，询问是否与该企业主解除当前企业关联。阅读不等于同意；暂不处理在24小时期限内维持待确认；自企业主提交申请起24小时未确认或拒绝，则进入“超时确认”，按默认同意执行并通知双方。\n风险告知与勾选\n说明企业权限、后续任务、部分企业共享数据访问会因关系解除停止或变化，开发前列明具体受影响数据。底层规则保留历史收益结算及合法查询、申诉渠道，不因弹窗简化而改变。员工弹窗仅展示精简的关系解除和企业关联数据风险告知、风险知悉及自愿解除勾选，支持确认、拒绝、暂不处理。移除重复询问句、余额权益说明、金额及劳动关系提示；上述结算责任等完整内容保留在企业主协议和平台规则中。勾选默认不选，全选后可确认。\n确认并通知\n员工确认后校验身份、申请编号和最新状态，执行解绑。企业主收到“员工xx已进行离职确认”；存在异常审核时应展示“员工已确认，解绑审核中”，不得误显示已离职。员工也收到回执，历史结算继续。\n拒绝并通知\n独立拒绝按钮无需勾选同意，二次确认并支持选填原因。企业主收到“员工xx已拒绝离职申请”，展示时间和原因；本次申请结束，关系不变。沟通后可重新发起新申请，旧记录保留。\n验收及约束\n待确认、确认、拒绝均推送企业主；未读状态和业务状态分别保存。\n同一企业和员工仅一条有效申请；重复提交、消息重试均去重。\n服务端校验身份、编号、版本、最新状态；确认与拒绝原子更新，只允许一次成功。\n旧消息只读，不允许操作另一条新申请；拒绝后重发使用新编号。\n通知持久化、跨端可见、可靠投递及失败重试；记录操作时间、风险告知及协议版本。\n只有关联员工和有权限的企业主可访问；覆盖加载失败、提交失败、通知失败及异常审核。\n不因离职阻断员工历史结算与申诉；确认状态与解绑执行状态分开展示。\n路线与待确认\n需求与 Demo 已整理 → 产品 / 法务评审 → 消息和关联状态接口 → 双端开发 → 测试 → 上线。负责人、优先级、排期待定，需补齐受影响数据清单及异常审核规则。Demo 仅为单页模拟，尚未接入真实站内消息与服务端。\n\n    \nENT-UX-002企业主 · 员工管理更新：2026-10-14待产品 / 法务评审\n\n员工离职确认弹窗\n2026-10-16 更新：以 ENT-UX-003 的双向确认为准，员工确认前不直接解绑；旧 Demo 仅作样式参考。\n\n沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。\n\n打开可交互弹窗 Demo →\n\n单项需求范围\n\n      \n触发方式\n仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。\n\n弹窗展示\n显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。\n\n协议与确认\n提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。\n\n结算分流\n无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。\n\n结果与留痕\n防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。\n\n    \n验收标准\n\n沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。\n身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。\n取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。\n有余额、零余额、结算异常及余额加载失败分别验证。\n离职不清零、不自动回收员工已有款项；审核中不提前解绑。\n员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。\n\n交付路线与评审事项\n需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。\n\n  \n\nENT-UX-001员工侧更新：2026-10-14\n\n员工首页与“我的”页面信息调整\n\n将身份与企业信息集中到“我的”，首页原位置承接 Banner，并按后台配置数量适配组件布局。\n    查看对应 UX 预览 →\n\n需求内容\n\n      \n顶部卡片迁移与整合\n首页原顶部卡片移至“我的”，与原个人卡片合并。保留用户头像、昵称、角色、手机号、用户 ID、企业头像、企业名称、简介和加入时间。重复字段只展示一次；缺失字段不展示“null”或“undefined”。站外登录入口保留在“我的”。\n\n首页 Banner 区域\n在原卡片位置展示同尺寸 Banner，保留线上圆角、间距及页面顺序。支持多张轮播和指示点，单张不展示指示点。预览中的 Banner 文案为示意；实际素材和跳转目标由配置提供。\n\n组件数量兼容\n按有效配置顺序展示 1–4 个组件。1 个通栏；2 个两列；3 个首项通栏、后两项并排；4 个两行两列。不留空白占位，长标题允许换行。第 4 项为布局示意，实际名称及入口由配置决定。\n\n线上样式保真\n以提供的线上截图为基准，保留淡紫色卡片、按钮、字体层级、项目卡片和首页 / 收益台 / 我的导航。搜索、项目分类及任务操作沿用既有流程。\n\n    \n需求路线\n\n      \n已整理需求录入需求稿 + UX 预览\n\n待评审产品 / UX 评审确认布局与配置边界\n\n待开始开发适配前端页面 + 配置对接\n\n待开始测试验收视觉、数量、数据与跳转\n\n待开始上线确认发布后核对实际页面\n\n    \n路线用于需求交接；负责人、优先级与排期尚未确认。当前仅完成需求及预览，开发、测试与上线尚未开始。\n\n验收标准\n\n      \n首页不再展示原身份卡片；Banner 与原卡片位置、尺寸一致。\n\n“我的”顶部只有一张整合卡片，用户和企业信息完整且无重复。\n\n1、2、3、4 个组件均无空位、遮挡或溢出，顺序与配置一致。\n\n在 320 / 375 / 414px 宽度下内容可读；底部导航不遮挡操作。\n\n站外登录、搜索、项目分类、参与任务和回填流程可正常使用。\n\n实际 Banner 素材、链接及组件名称与后台配置一致。\n\n    \n评审需确认\n\n无 Banner 配置时的展示方式；组件配置为 0 个、异常或超过 4 个时的处理；Banner 是否自动轮播及切换间隔。以上边界尚未由本次需求确定。\n\n交接方式\n转发完整预览压缩包，解压后打开 employee-home-profile-ux.html。需求池与 UX 在同一页面，头像及项目图标已附带；图标库加载需要网络。复制需求摘要\n\n  \n\n    配置组件数量 1 个 · 通栏2 个 · 两列3 个 · 首项通栏 + 两列4 个 · 两行两列\n\n  \n\n    \n\n      首页•••　│　◉\n\n        \n\n          员工专属活动\n精选项目 · 创作新机会\n精选任务上线，开启新的机会\n\n查看活动 →\n\n          \n\n        \n输入任务名 / 项目名搜索\n\n        \n项目列表\n\n全部品牌推文品牌短剧品牌网盘品牌应用海外短剧\n\n          \n网易云有声书 \n数据更新：06-25\n参与任务立即回填\n\n次元姬 \n数据更新：06-25\n参与任务立即回填\n\n红果短剧APP-网文 \n数据更新：06-25\n参与任务立即回填\n\n知乎故事聚星 \n数据更新：06-25\n参与任务立即回填\n\n      \n      首页收益台我的\n\n    \n\n      我的•••　│　◉\n\n        \n\n          \n\n用户2317 歪比巴卜\n152****2317　用户ID: 6\n\n?\n横说竖说\n\n加入时间　2026-09-09 21:53:41\n\n        \n更多功能\n账号报备\n\n我的词库\n\n站外登录\n\n      首页收益台我的\n\n  \n\n首页 · 同尺寸替换\n原企业 + 员工卡片替换为轮播 Banner，保留顶部高度与圆角。示意内容可切换。我的 · 信息合并\n用户头像、昵称、手机号、ID、角色及企业 Logo、名称、简介、加入时间整合为一张卡片。组件 · 按配置适配\n1 个通栏；2 个并排；3 个首项通栏 + 两项并排；4 个两行两列。第 4 项为占位示意。"}, {"id": "ENT-UX-007", "originalContent": "企业主 · 小组数据 UX\n\nENTERPRISE WORKSPACE / UX V1\n企业主，一眼看清每个小组的贡献\n首页明细统计 → 组长列表 → 查看下级\n\n⌂总览▣运营中心\n开发说明 ☰\n\n前后端开发说明关闭 ×\n页面与前端组件\n首页组长列表点击“查看下级”进入独立团队统计页，带入组长 ID 与时间筛选。TeamFilters 负责时间和团队选择，TeamSummary 展示汇总，ContributionSection 分为组长与组员，PersonRow 身份信息按一行展示：脱敏昵称、用户 ID、状态；下方展示四项指标。组长身份标签与昵称、ID、状态同一行展示。时间与团队选择器使用日历、团队图标，保留选中值、下拉箭头及无障碍名称。昵称将第二个字符替换为 *（单字昵称替换该字），用户 ID 保持原值；脱敏规则应由后端统一执行，前端示例仅模拟效果。团队汇总说明放在卡片内底部。返回时恢复首页展开和滚动位置。\n大额展示与预览\n切换 10 万级示例 恢复普通示例\n团队汇总与人员明细均保持一排四列。金额绝对值达到 10,000 元后以万为单位，保留两位小数，仅用于展示，不影响计算与汇总。点击任意金额显示带千分位的完整金额。订单笔数保持整数并加千分位。长数值不截断、不横向滚动；小屏仍保持四列，万级金额格式化并适当缩小字号。大额示例只改变原型数据，不代表真实业务。\n字体规则\n系统字体：-apple-system / BlinkMacSystemFont / PingFang SC / sans-serif。页面标题 23px / 650；团队标题 17px / 650；分区标题 13–14px / 600；姓名 13px / 600；汇总数值 19px / 650；个人数值 15px / 550；标签与辅助文案 11px / 400。行高 1.5–1.6，数字使用 tabular-nums。\n色调规则\n页面背景 #F7F8FA，明细白底 #FFFFFF；主文字 #30313A，辅助 #9294A3，分隔线 #F0F0F4；交互主色 #827DE0。汇总底色 #EEECFF → #F7F6FF，边框 #DEDBF7，数字 #625CBA。个人数字深色 #3D3E47。在职浅绿底 #EDF8F2、文字 #419372，同时保留状态文字。\n布局与组件状态\n4px 间距基准，内容边距 14px，卡片内边距 12–18px，卡片间距 10px，分区间距 22px，圆角 12px。汇总强调、个人明细弱化。默认四列，窄屏或长金额改两列，不截断金额。选择器触控区域至少 44px。加载用骨架屏；空列表显示“暂无下属组员”；无数据为 0，失败或未返回用“—”并提供重试。筛选触发整页刷新，过期响应不得覆盖新筛选结果。\n后端接口建议（未接入）\nGET /enterprise/teams：组长 ID、昵称、下属人数。\nGET /enterprise/teams/{leaderId}/statistics?startAt=…&endAt=…&cursor=…：返回 summary、leaderContribution、memberContributions、nextCursor、asOf。指标字段：orderCount、enterpriseRevenue、employeeRevenue、promotionRevenue；人员字段：userId、nickname、employmentStatus。\n金额使用分单位整数，前端转元显示两位小数。后端汇总全部人员，不能只累加当前页。团队汇总 = 组长贡献 + 全体组员贡献。统一 Asia/Shanghai 时区，时间区间左闭右开；团队切换保留时间。后端校验企业及团队访问权限，成员分页稳定排序。\n口径待确认与验收\n订单状态范围、按何种时间统计、退款处理、换组历史归属、离职员工历史统计、推广收益与企业及员工收益的关系，需产品和后端确认。原型为示例口径。验收包含团队和时间切换、零订单、空组员、分页汇总、长昵称大金额、失败重试及请求乱序，适配 320 / 375 / 430px。\n\n知道了", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n企业主 · 小组数据 UX\n\nENTERPRISE WORKSPACE / UX V1\n企业主，一眼看清每个小组的贡献\n首页明细统计 → 组长列表 → 查看下级\n\n⌂总览▣运营中心\n开发说明 ☰\n\n前后端开发说明关闭 ×\n页面与前端组件\n首页组长列表点击“查看下级”进入独立团队统计页，带入组长 ID 与时间筛选。TeamFilters 负责时间和团队选择，TeamSummary 展示汇总，ContributionSection 分为组长与组员，PersonRow 身份信息按一行展示：脱敏昵称、用户 ID、状态；下方展示四项指标。组长身份标签与昵称、ID、状态同一行展示。时间与团队选择器使用日历、团队图标，保留选中值、下拉箭头及无障碍名称。昵称将第二个字符替换为 *（单字昵称替换该字），用户 ID 保持原值；脱敏规则应由后端统一执行，前端示例仅模拟效果。团队汇总说明放在卡片内底部。返回时恢复首页展开和滚动位置。\n大额展示与预览\n切换 10 万级示例 恢复普通示例\n团队汇总与人员明细均保持一排四列。金额绝对值达到 10,000 元后以万为单位，保留两位小数，仅用于展示，不影响计算与汇总。点击任意金额显示带千分位的完  示例数据，非真实经营数据\n\n      \n\n企业号经营数据看板\n以订单收益为核心，查看企业主开通、员工加入、任务执行与项目使用\n全部企业涛哥 OPC小说研究所逐光创作云上工作室规则说明开发标注导出字段\n\n统计周期\n今日近7天本月累计至查询示例数据截止 2026-09-12 10:30\n\n统计口径 默认展示本月至数据截止日。右豹 ID 加白只产生企业主身份；企业主通过企业号邀请码建立名下员工关系。受邀员工按在职、离职状态展示，有效员工另按任务或订单行为判定。订单笔数按创建日，收益归回订单创建日。当前仅提供本月演示数据。\n\n      \n\n订单收益总览重点经营结果 · 新增订单与有效推广收益分口径展示\n\n        \n有效订单推广收益¥18,642.50较上周期 -2.1%\n\n新增订单笔数536按创建日，订单 ID 去重\n企业主账户入账¥13,996.20线下全额 + 线上分成\n员工账户入账¥4,646.30仅线上结算分成\n订单新建即计入笔数；审核通过且未退款后，推广收益按订单创建日归回。分成按订单确认时快照计算，退款/冲销按原订单回退。\n\n订单结果趋势按订单创建日\n推广收益 · 左轴元新增订单 · 右轴笔\n柱为收益、线为订单；左右轴单位不同，仅比较各自趋势，不比较图形高度。收益经审核后归回订单创建日。\n\n      \n\n开通、邀请与有效员工加白只产生企业主；邀请成功后才形成企业主名下员工关系\n\n        \n\n企业主开通 右豹 ID 加白，只产生企业主身份\n\n已开通企业号的右豹用户48累计有效加白企业主\n本月新开通3按加白生效日\n\n企业主邀请员工 邀请成功并绑定关系后计入\n\n本月邀请成功143按员工右豹 ID 去重\n受邀后仍在职125目前仍绑定企业主\n受邀后已离职18关系已解除，历史保留\n其中：有效员工83本期提词、回填或新建订单\n本月邀请成功 = 受邀后仍在职 + 受邀后已离职；当前全部在职员工 1,238 人。有效员工按行为判定，可包含后来离职者，不与邀请人数相加。\n\n      \n\n项目任务表现按成功提交时间 · 用项目维度定位执行差异\n\n任务提词量2,418成功提交的关键词记录\n任务回填量986成功提交的回填记录\n回填 / 提词40.8%记录量比值，非人员转化率\n示例项目提词记录回填记录回填 / 提词\n\n按项目汇总便于发现任务集中或回填偏低的项目；回填可能对应历史提词，不应解读为严格漏斗转化。\n\n右豹来源项目使用路径从来源到企业号实际使用，按项目 ID 去重\n\n34.1%43 / 126 个项目\n实际使用占右豹来源项目\n企业使用明细 示例企业 · 按使用项目数降序；切换企业后同步筛选\n\n企业同步项目数使用项目数同步后使用率\n“同步”是项目关联到企业；“实际使用”是本月该项目至少有 1 次成功提词或回填。全局项目按项目 ID 去重，逐企业按企业—项目关系去重，跨企业复用项目不可直接求和。\n\n企业主名下员工经营排行按员工有效订单推广收益降序展示前 4 名 · 金额非企业主入账\n企业主员工推广收益 · 相对最高值有效订单任务提词任务回填当前在职\n\n条形长度用于比较企业间收益差距；金额为订单推广收益，不是企业主入账。归属按任务或订单发生时的企业主—员工关系快照，离职员工历史贡献仍归原企业主。\n\n  \n\n业务与统计规则×\n\n  \n六个模块的口径\n企业主开通右豹用户经 ID 加白后只获得企业主身份；截至周期末按有效加白的企业主右豹 ID 去重，周期新增按加白生效时间。不把加白计作新增员工。\n邀请加入与有效员工企业主通过企业号邀请码邀请，员工成功绑定到该企业主后计入本月邀请成功人数，按员工右豹 ID 去重。将这批受邀员工按截止时状态分为“仍在职”和“已离职”两组，两组之和等于邀请成功人数；离职表示员工与企业主关系解除。有效员工是这批受邀员工中，本期至少成功提词、回填或新建订单者，可包含后来离职者；有效员工是子集，不与两种状态相加。历史行为保留。\n项目任务表现提词和回填分别按成功提交的记录 ID 计数，项目行按任务发生时的项目 ID 汇总。回填 / 提词为记录量比值，不是人员转化率；登录、浏览、失败和取消记录不计入。\n订单笔数 / 收益新增订单按订单创建时间和订单 ID 去重计笔数，创建一单即新增一笔；推广收益仅计审核通过且未退款的有效订单，按原订单创建日展示。晚审核会回填历史日期；退款或作废按原单冲销，分成用订单确认时快照。组合图左右轴单位不同，仅比较各自走势。\n项目使用路径来源项目、已上线、已同步企业、实际使用依次展示；在当前企业筛选范围内均按项目 ID 去重。已同步表示项目与企业已建立关联；实际使用指周期内至少成功提词或回填一次。核心占比 = 实际使用 ÷ 来源项目；分母为 0 时显示“—”。逐企业明细按企业—项目关系去重，跨企业项目复用时不可直接加总。\n企业主排行汇总企业主名下员工在周期内的提词、回填、有效订单及订单推广收益；事件发生时的员工归属快照决定企业主，离职不回溯扣减历史。按推广收益金额降序，以横向条形比较收益差距。\n\n订单金额与入账\n线下结算：订单推广收益全额入企业主账户；平台不拆分员工入账。\n线上结算：根据订单确认时的员工分成比例，将一笔订单拆成企业主与员工两笔入账。\n看板的“订单金额 / 收益”是订单推广收益，不是企业主入账；全量推广收益 = 企业主入账 + 员工入账（冲销后净额）。\n\n筛选与对比\n默认本月：北京时间当月 1 日至最新数据截止日；企业筛选控制全部模块。此交互稿仅提供 2026-09-01 至 2026-09-12 的示例数据，正式环境按所选周期请求接口。\n周期指标与上一等长周期比较；累计存量指标对比上月末。示例值仅演示结构，不代表真实业务表现。\n\n开发对接说明×\n\n建议数据接口\n概览与收益GET /enterprise/dashboard/summary：allowlisted_owner_count、new_owner_count、invited_staff_count、invited_still_bound_count、invited_departed_count、effective_invited_staff_count、active_staff_count、keyword_count、backfill_count、created_order_count、promotion_revenue、owner_credit、staff_credit。受邀员工在职与离职之和等于邀请成功总数；有效员工为其行为子集。\n订单趋势GET /enterprise/dashboard/order-trend：created_date、created_order_count、promotion_revenue；按订单创建日聚合。新增订单创建即计笔数；收益仅计有效订单，审核后回填对应创建日。左右轴独立缩放，仅作趋势对照。\n项目任务GET /enterprise/dashboard/project-tasks：project_id、project_name、keyword_count、backfill_count；项目行按成功任务记录归属汇总，正式环境按项目量排序分页，本页仅为示例。\n项目使用GET /enterprise/dashboard/project-usage：youbao_source_project_count、online_project_count、synced_project_count、used_project_count、enterprise_usage_rows［enterprise_id、enterprise_name、synced_project_count、used_project_count］；全局按项目 ID 去重，逐企业按企业—项目关系去重。\n企业主排行GET /enterprise/dashboard/owner-ranking：owner_youbao_id、owner_name、active_staff_count、keyword_count、backfill_count、valid_order_count、promotion_revenue；服务端按金额降序分页。\n核对约束\n同一企业筛选和日期窗口必须应用于全部周期指标；存量指标使用结束日快照。\n订单归属、结算方式和分成比例以订单快照为准，不读取员工当前配置重算历史。\n排行金额是订单推广收益；企业主和员工入账是该收益的分配，避免重复相加。\n生产环境无数据展示空态；本交互稿所有数值都是演示数据。\n\n导出表单字段说明×\n\n正式环境按当前企业与日期筛选异步导出 Excel；本交互稿只展示字段定义，不生成真实数据文件。\n经营汇总企业 ID、企业主右豹 ID、企业名称、统计开始 / 结束时间、有效加白企业主数、新增加白企业主数、邀请成功员工数、受邀后仍在职数、受邀后已离职数、其中有效员工数、当前全部在职员工数、提词量、回填量、新增订单笔数、有效订单推广收益、企业主入账、员工入账、右豹来源项目数、已上线项目数、已同步企业项目数、实际使用项目数、使用占比。\n订单趋势订单创建日期、新增订单笔数、有效订单推广收益；日期为北京时间自然日，收益经审核后回填创建日。\n项目任务表现项目 ID、项目名称、统计开始 / 结束时间、成功提词记录数 已离职；当前全部在职员工 1,238 人。有效员工按行为判定，可包含后来离职者，不与邀请人数相加。\n\n      \n\n项目任务表现按成功提交时间 · 用项目维度定位执行差异\n\n任务提词量2,418成功提交的关键词记录\n任务回填量986成功提交的回填记录\n回填 / 提词40.8%记录量比值，非人员转化率\n示例项目提词记录回填记录回填 / 提词\n\n按项目汇总便于发现任务集中或回填偏低的项目；回填可能对应历史提词，不应解读为严格漏斗转化。\n\n右豹来源项目使用路径从来源到企业号实际使用，按项目 ID 去重\n\n34.1%43 / 126 个项目\n实际使用占右豹来源项目\n企业使用明细 示例企业 · 按使用项目数降序；切换企业后同步筛选\n\n企业同步项目数使用项目数同步后使用率\n“同步”是项目关联到企业；“实际使用”是本月该项目至少有 1 次成功提词或回填。全局项目按项目 ID 去重，逐企业按企业—项目关系去重，跨企业复用项目不可直接求和。\n\n企业主名下员工经营排行按员工有效订单推广收益降序展示前 4 名 · 金额非企业主入账\n企业主员工推广收益 · 相对最高值有效订单任务提词任务回填当前在职\n\n条形长度用于比较企业间收益差距；金额为订单推广收益，不是企业主入账。归属按任务或订单发生时的企业主—员工关系快照，离职员工历史贡献仍归原企业主。\n\n  \n\n业务与统计规则×\n\n  \n六个模块的口径\n企业主开通右豹用户经 ID 加白后只获得企业主身份；截至周期末按有效加白的企业主右豹 ID 去重，周期新增按加白生效时间。不把加白计作新增员工。\n邀请加入与有效员工企业主通过企业号邀请码邀请，员工成功绑定到该企业主后计入本月邀请成功人数，按员工右豹 ID 去重。将这批受邀员工按截止时状态分为“仍在职”和“已离职”两组，两组之和等于邀请成功人数；离职表示员工与企业主关系解除。有效员工是这批受邀员工中，本期至少成功提词、回填或新建订单者，可包含后来离职者；有效员工是子集，不与两种状态相加。历史行为保留。\n项目任务表现提词和回填分别按成功提交的记录 ID 计数，项目行按任务发生时的项目 ID 汇总。回填 / 提词为记录量比值，不是人员转化率；登录、浏览、失败和取消记录不计入。\n订单笔数 / 收益新增订单按订单创建时间和订单 ID 去重计笔数，创建一单即新增一笔；推广收益仅计审核通过且未退款的有效订单，按原订单创建日展示。晚审核会回填历史日期；退款或作废按原单冲销，分成用订单确认时快照。组合图左右轴单位不同，仅比较各自走势。\n项目使用路径来源项目、已上线、已同步企业、实际使用依次展示；在当前企业筛选范围内均按项目 ID 去重。已同步表示项目与企业已建立关联；实际使用指周期内至少成功提词或回填一次。核心占比 = 实际使用 ÷ 来源项目；分母为 0 时显示“—”。逐企业明细按企业—项目关系去重，跨企业项目复用时不可直接加总。\n企业主排行汇总企业主名下员工在周期内的提词、回填、有效订单及订单推广收益；事件发生时的员工归属快照决定企业主，离职不回溯扣减历史。按推广收益金额降序，以横向条形比较收益差距。\n\n订单金额与入账\n线下结算：订单推广收益全额入企业主账户；平台不拆分员工入账。\n线上结算：根据订单确认时的员工分成比例，将一笔订单拆成企业主与员工两笔入账。\n看板的“订单金额 / 收益”是订单推广收益，不是企业主入账；全量推广收益 = 企业主入账 + 员工入账（冲销后净额）。\n\n筛选与对比\n默认本月：北京时间当月 1 日至最新数据截止日；企业筛选控制全部模块。此交互稿仅提供 2026-09-01 至 2026-09-12 的示例数据，正式环境按所选周期请求接口。\n周期指标与上一等长周期比较；累计存量指标对比上月末。示例值仅演示结构，不代表真实业务表现。\n\n开发对接说明×\n\n建议数据接口\n概览与收益GET /enterprise/dashboard/summary：allowlisted_owner_count、new_owner_count、invited_staff_count、invited_still_bound_count、invited_departed_count、effective_invited_staff_count、active_staff_count、keyword_count、backfill_count、created_order_count、promotion_revenue、owner_credit、staff_credit。受邀员工在职与离职之和等于邀请成功总数；有效员工为其行为子集。\n订单趋势GET /enterprise/dashboard/order-trend：created_date、created_order_count、promotion_revenue；按订单创建日聚合。新增订单创建即计笔数；收益仅计有效订单，审核后回填对应创建日。左右轴独立缩放，仅作趋势对照。\n项目任务GET /enterprise/dashboard/project-tasks：project_id、project_name、keyword_count、backfill_count；项目行按成功任务记录归属汇总，正式环境按项目量排序分页，本页仅为示例。\n项目使用GET /enterprise/dashboard/project-usage：youbao_source_project_count、online_project_count、synced_project_count、used_project_count、enterprise_usage_rows［enterprise_id、enterprise_name、synced_project_count、used_project_count］；全局按项目 ID 去重，逐企业按企业—项目关系去重。\n企业主排行GET /enterprise/dashboard/owner-ranking：owner_youbao_id、owner_name、active_staff_count、keyword_count、backfill_count、valid_order_count、promotion_revenue；服务端按金额降序分页。\n核对约束\n同一企业筛选和日期窗口必须应用于全部周期指标；存量指标使用结束日快照。\n订单归属、结算方式和分成比例以订单快照为准，不读取员工当前配置重算历史。\n排行金额是订单推广收益；企业主和员工入账是该收益的分配，避免重复相加。\n生产环境无数据展示空态；本交互稿所有数值都是演示数据。\n\n导出表单字段说明×\n\n正式环境按当前企业与日期筛选异步导出 Excel；本交互稿只展示字段定义，不生成真实数据文件。\n经营汇总企业 ID、企业主右豹 ID、企业名称、统计开始 / 结束时间、有效加白企业主数、新增加白企业主数、邀请成功员工数、受邀后仍在职数、受邀后已离职数、其中有效员工数、当前全部在职员工数、提词量、回填量、新增订单笔数、有效订单推广收益、企业主入账、员工入账、右豹来源项目数、已上线项目数、已同步企业项目数、实际使用项目数、使用占比。\n订单趋势订单创建日期、新增订单笔数、有效订单推广收益；日期为北京时间自然日，收益经审核后回填创建日。\n项目任务表现项目 ID、项目名称、统计开始 / 结束时间、成功提词记录数、成功回填记录数、回填 / 提词比值；一项目一行。\n企业主排行排名、企业主右豹 ID、企业名称、在职员工数、员工提词量、员工回填量、有效订单笔数、有效订单推广收益；一位企业主一行，默认收益降序。\n订单收益明细订单 ID、订单创建时间、审核通过时间、企业主右豹 ID、员工右豹 ID、项目 ID、订单状态、推广收益、结算方式、企业主分成比例快照、员工分成比例快照、企业主入账、员工入账、退款 / 冲销金额。\n企业项目使用汇总企业 ID、企业名称、同步项目数、使用项目数、同步后使用率、统计开始 / 结束时间；一企业一行。\n项目使用明细企业 ID、企业名称、右豹来源项目 ID、项目名称、项目状态、上线时间、企业号关联时间、周期内成功提词量、成功回填量、是否实际使用、最后任务时间。\n金额单位元，保留两位小数；时间为北京时间；右豹 ID 去重；仅后台授权人员可导出并记录导出人、时间与筛选条件。"}, {"id": "ENT-TOOL-003", "originalContent": "企业号 · 字节开白管理", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n企业号 · 字节开白管理", "back": "原始资料未单列后端开发说明，接口契约需确认。以下为来源内容：\n\n企业号 · 字节开白管理"}, {"id": "ENT-HIS-061", "originalContent": "# v61 企业号员工离职收益回收规则\n\n## H5 已完成\n\n- 企业主把员工从“在职”改为“离职”并保存时，新增离职二次确认。\n- 员工管理弹层直接展示当前待提现金额；切换为离职后同步展示回收提示，并将保存按钮改为“确认离职并保存”。\n- 二次确认改为定制交互层，明确展示员工、余额以及员工负流水、企业主正流水、回收统计三步处理结果。\n- 弹窗展示员工当前待提现金额，文案为：`当前员工余额：xx元。员工离职后，该笔待提现金额将回收至企业主收益，确认将员工状态变更为离职？`\n- 待提现金额大于 0 时不做前端拦截，确认后仍提交离职状态。\n- 企业主“我的”收益卡新增“离职员工回收金额”。\n- 企业主订单卡优先展示订单拉取时固化的 `employment_status_snapshot` 在职/离职状态。\n- 员工详情/列表、企业主收益卡、订单记录及钱包流水补充了对应字段类型。\n\n## 正式接口契约\n\n### 员工列表与详情\n\n`GET /api/v1.enterprise.Staff/list` 和 `GET /api/v1.enterprise.Staff/detail`：\n\n- 返回 `pending_withdrawal_amount`，单位为元，表示员工当前待提现金额。\n\n### 员工离职\n\n`POST /api/v1.enterprise.Staff/config` 的 `status` 从 `1` 变为 `0` 时，服务端必须在同一数据库事务内：\n\n1. 锁定员工关系和员工/企业主钱包，重新读取员工在职状态及待提现金额。\n2. 不再因待提现金额大于 0 拒绝离职。\n3. 将员工状态更新为离职。\n4. 员工侧生成一笔“离职收益回收”流水，`amount_signed` 为负数。\n5. 企业主侧生成一笔等额“离职员工收益回收”流水，`amount_signed` 为正数。\n6. 员工待提现金额扣减至 0，企业主离职回收累计金额增加相同数额。\n7. 两笔流水共用唯一 `recovery_pair_no`，并记录 `related_staff_id`，便于对账和保证幂等。\n\n若员工已经离职，重复请求不得再次回收；任一步失败必须整体回滚。\n\n### 企业主“我的”\n\n`GET /api/v1.enterprise.Mine/index` 的 `data.revenue_card`：\n\n- 新增 `resigned_staff_recovery_amount`，单位为元，统计已离职员工被回收的待提现金额累计值。\n\n### 订单定时拉取\n\n订单拉取任务处理每笔订单前必须按企业、用户查询员工关系，并固化：\n\n- `employment_status_snapshot`: `1` 在职，`0` 离职。\n- 仅在员工在职时按员工分佣规则计入员工待提现收益。\n- 员工已离职时不得再向该员工钱包入账；收益按服务端既定的离职订单归属规则计入企业主。\n- 状态查询、订单幂等校验、收益入账和流水写入必须放在一致的事务边界内，避免离职与订单拉取并发造成重复或错账。\n\n## 验收重点\n\n- 待提现金额为 0 和大于 0 时均可离职，且都出现二次确认。\n- 取消弹窗不提交；确认后只回收一次。\n- 员工负流水、企业主正流水金额完全一致，且可通过 `recovery_pair_no` 配对。\n- 离职回收累计金额等于全部有效企业主正向回收流水之和。\n- 离职操作与订单定时拉取并发时，不出现员工离职后新增待提现金额。", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n# v61 企业号员工离职收益回收规则\n\n## H5 已完成\n\n- 企业主把员工从“在职”改为“离职”并保存时，新增离职二次确认。\n- 员工管理弹层直接展示当前待提现金额；切换为离职后同步展示回收提示，并将保存按钮改为“确认离职并保存”。\n- 二次确认改为定制交互层，明确展示员工、余额以及员工负流水、企业主正流水、回收统计三步处理结果。\n- 弹窗展示员工当前待提现金额，文案为：`当前员工余额：xx元。员工离职后，该笔待提现金额将回收至企业主收益，确认将员工状态变更为离职？`\n- 待提现金额大于 0 时不做前端拦截，确认后仍提交离职状态。\n- 企业主“我的”收益卡新增“离职员工回收金额”。\n- 企业主订单卡优先展示订单拉取时固化的 `employment_status_snapshot` 在职/离职状态。\n- 员工详情/列表、企业主收益卡、订单记录及钱包流水补充了对应字段类型。\n\n## 正式接口契约\n\n### 员工列表与详情\n\n`GET /api/v1.enterprise.Staff/list` 和 `GET /api/v1.enterprise.Staff/detail`：\n\n- 返回 `pending_withdrawal_amount`，单位为元，表示员工当前待提现金额。\n\n### 员工离职\n\n`POST /api/v1.enterprise.Staff/config` 的 `status` 从 `1` 变为 # 员工管理\n\n- 按测试环境原有“员工权限”表单布局展示，不引入新的大卡片或额外配置字段。\n- 复用原“管理权限”开关，并在同一行内补充“当前待提现金额”，便于企业主判断是否调整员工状态。\n- 切换为离职后仅保留金额警示，详细回收说明集中在二次确认弹窗中。\n- 保留原有收益数据、分成比例、进阶管理和项目管理结构，减少前后端调整范围。\n- 离职确认弹窗精简为标题、余额、确认内容及两个操作按钮；“我的”页面查看回收记录作为小字号 PS 说明展示。\n\n## 组合提词书籍选择\n\n- 组合提词页增加“从书库选择”入口，复用快捷提词现有书籍列表和查询接口，不新增书库接口或重复开发书籍列表。\n- 用户从书库选择一本书后，自动带回书籍名称、书籍 ID；书库有作者信息时同步带回作者名称。\n- 原“书籍 ID”“书籍名称”两个独立输入框调整为一张书籍信息卡，展示书名、书籍 ID 和“更换书籍”操作，减少复制与手工填写。\n- 未选择书籍时展示空状态及“选择书籍”按钮；选择后可点击整张卡片或“更换书籍”重新进入书库选择。\n- 快捷提词页增加选择器模式：从组合提词进入时只负责选择并回传书籍，不进入快捷提词的关键词提交流程。\n- 回传优先复用组合提词现有草稿能力，字段使用 `book_id`、`book_name`、`author`；返回组合提词页时立即消费回传数据并刷新书籍信息卡。\n- 保留原手工录入作为兼容入口，用于书库尚未收录、数据未同步或书籍接口不可用的情况。\n- 提交接口及组合提词原有参数结构保持不变，仍按书籍 ID、书籍名称、作者名称提交，后端无需配套改造。"}, {"id": "ENT-UX-002", "originalContent": "# ENT-UX-002 员工离职确认弹窗\n\n状态：待产品 / 法务评审；2026-10-14。\n\n  <article class=\"req-detail\" id=\"ENT-UX-002\">\n    <div class=\"req-meta\"><span>ENT-UX-002</span><span>企业主 · 员工管理</span><span>更新：2026-10-14</span><span>待产品 / 法务评审</span></div>\n    <h2>员工离职确认弹窗</h2>\n    <p class=\"req-summary\">沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。</p>\n    <p><a href=\"employee-offboarding-simple-demo.html\" target=\"_blank\" rel=\"noopener\">打开可交互弹窗 Demo →</a></p>\n    <h3>单项需求范围</h3>\n    <ol class=\"req-list\">\n      <li><b>触发方式</b><p>仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。</p></li>\n      <li><b>弹窗展示</b><p>显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。</p></li>\n      <li><b>协议与确认</b><p>提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。</p></li>\n      <li><b>结算分流</b><p>无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。</p></li>\n      <li><b>结果与留痕</b><p>防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。</p></li>\n    </ol>\n    <h3>验收标准</h3>\n    <ul class=\"req-checks\"><li>沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。</li><li>身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。</li><li>取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。</li><li>有余额、零余额、结算异常及余额加载失败分别验证。</li><li>离职不清零、不自动回收员工已有款项；审核中不提前解绑。</li><li>员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。</li></ul>\n    <h3>交付路线与评审事项</h3><p class=\"req-hint\">需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。</p>\n  </article>\n\nDemo：employee-offboarding-simple-demo.html", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n# ENT-UX-002 员工离职确认弹窗\n\n状态：待产品 / 法务评审；2026-10-14。\n\n  <article class=\"req-detail\" id=\"ENT-UX-002\">\n    <div class=\"req-meta\"><span>ENT-UX-002</span><span>企业主 · 员工管理</span><span>更新：2026-10-14</span><span>待产品 / 法务评审</span></div>\n    <h2>员工离职确认弹窗</h2>\n    <p class=\"req-summary\">沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。</p>\n    <p><a href=\"employee-offboarding-simple-demo.html\" target=\"_blank\" rel=\"noopener\">打开可交互弹窗 Demo →</a></p>\n    <h3>单项需求范围</h3>\n    <ol class=\"req-list\">\n      <li><b>触发方式</b><p>仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。</p></li>\n      <li><b>弹窗展示</b><p>显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。</p></li>\n      <li><b>协议与确认</b><p>提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。</p></li>\n      <li><b>结算分流</b><p>无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。</p></li>\n      <li><b>结果与留痕</b><p>防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。</p></li>\n    </ol>\n    <h3>验收标准</h3>\n    <ul class=\"req-checks\"><li>沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。</li><li>身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。</li><li>取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。</li><li>有余额、零余额、结算异常及余额加载失败分别验证。</li><li>离职不清零、不自动回收员工已有款项；审核中不提前解绑。</li><li>员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。</li></ul>\n    <h3>交付路线与评审事项</h3><p class=\"req-hint\">需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。</p>\n  </article>\n\nDemo：employee-offboarding-simple-demo.html", "back": "原始资料未单列后端开发说明，接口契约需确认。以下为来源内容：\n\n# ENT-UX-002 员工离职确认弹窗\n\n状态：待产品 / 法务评审；2026-10-14。\n\n  <article class=\"req-detail\" id=\"ENT-UX-002\">\n    <div class=\"req-meta\"><span>ENT-UX-002</span><span>企业主 · 员工管理</span><span>更新：2026-10-14</span><span>待产品 / 法务评审</span></div>\n    <h2>员工离职确认弹窗</h2>\n    <p class=\"req-summary\">沿用现有“权限管理 → 员工权限 → 关闭管理权限 → 保存”入口，通过一个弹窗完成风险提示、协议阅读和离职确认，不新增多步页面。</p>\n    <p><a href=\"employee-offboarding-simple-demo.html\" target=\"_blank\" rel=\"noopener\">打开可交互弹窗 Demo →</a></p>\n    <h3>单项需求范围</h3>\n    <ol class=\"req-list\">\n      <li><b>触发方式</b><p>仅在员工由在职调整为离职并点击保存时弹出；开关关闭不立即生效。取消后返回表单，不提交离职。</p></li>\n      <li><b>弹窗展示</b><p>显示员工昵称、协作 ID、待提现金额，显著说明企业关联解除、相关企业权限和后续业务分配停止，以及历史收益、结算责任和申诉权利保留。不得将本次确认表述为现实劳动关系已合法解除。</p></li>\n      <li><b>协议与确认</b><p>提供《离职及企业关系解绑确认书》全文入口。操作授权及协议确认默认不勾选，全部勾选后启用确认按钮；协议返回后保留勾选状态。禁止以企业主单方确认代替员工放弃收益。</p></li>\n      <li><b>结算分流</b><p>无余额或支持独立结算时可确认离职；结算异常或无法保障历史款项时提交审核，审核通过前维持原状态。不得因余额少而清零或自动回收至企业主。余额读取失败应阻止直接确认并支持重试。</p></li>\n      <li><b>结果与留痕</b><p>防止重复提交；成功后刷新员工状态并通知员工，保留历史收益查询、结算及异议入口。失败不显示成功。记录操作人、员工、企业、时间、协议版本及结算快照。</p></li>\n    </ol>\n    <h3>验收标准</h3>\n    <ul class=\"req-checks\"><li>沿用现有表单和蓝色开关样式，通过弹窗确认，无新增多步流程。</li><li>身份、金额、关系切割及责任保留文案清晰，未勾选不可提交。</li><li>取消不改变员工在职状态；重复点击不产生重复操作；失败可重试。</li><li>有余额、零余额、结算异常及余额加载失败分别验证。</li><li>离职不清零、不自动回收员工已有款项；审核中不提前解绑。</li><li>员工通知、结算和申诉路径可用；320 / 375 / 414px 下弹窗可滚动且按钮可操作。</li></ul>\n    <h3>交付路线与评审事项</h3><p class=\"req-hint\">需求与 Demo 已整理 → 产品 / 法务评审 → 前后端实现 → 测试验收 → 上线核对。负责人、优先级、排期待定。正式开发前需确认历史收益独立结算能力、异常审核机制，并替换现有“离职余额回收至企业主”逻辑。当前发布为需求与演示，不表示业务功能已上线。</p>\n  </article>\n\nDemo：employee-offboarding-simple-demo.html"}, {"id": "ENT-UX-003", "originalContent": "<article class=\"req-detail\" id=\"ENT-UX-003\"><div class=\"req-meta\"><span>ENT-UX-003</span><span>员工 / 企业主消息中心</span><span>2026-10-16 · 待评审</span></div><h2>员工消息中心与离职双向确认通知</h2><p class=\"req-summary\">企业主发起离职后进入待确认，员工阅读风险并确认或拒绝。企业主收到待确认、确认、拒绝三类站内消息。本需求更新 ENT-UX-002：员工确认前不直接解绑。</p><p><a href=\"employee-message-confirm-demo.html\" target=\"_blank\" rel=\"noopener\">查看双端消息中心与确认弹窗 Demo →</a></p><h3>需求与操作流程</h3><ol class=\"req-list\"><li><b>企业主发起</b><p>保留关闭管理权限并保存的入口，通过弹窗发送申请。生成唯一申请编号，推送员工“离职待确认通知”，同时推送企业主“员工xx离职待确认”。待确认期间关系、权限保持不变，不回收余额。</p></li><li><b>员工消息中心</b><p>新增站内消息入口、未读数量及列表。通知详情展示发起企业、企业主、员工和时间，询问是否与该企业主解除当前企业关联。阅读不等于同意；暂不处理维持待确认，不设置默认同意或自动解绑。</p></li><li><b>风险告知与勾选</b><p>说明企业权限、后续任务、部分企业共享数据访问会因关系解除停止或变化，开发前列明具体受影响数据。历史余额、待结收益、合法查询及申诉权利保留，不清零、不自动转给企业主；必要结算和维权记录仍有查询或申请渠道。风险知悉与自愿解除默认不勾选，全选后才能确认。不捆绑放弃收益，不替代现实劳动关系解除手续。</p></li><li><b>确认并通知</b><p>员工确认后校验身份、申请编号和最新状态，执行解绑。企业主收到“员工xx已进行离职确认”；存在异常审核时应展示“员工已确认，解绑审核中”，不得误显示已离职。员工也收到回执，历史结算继续。</p></li><li><b>拒绝并通知</b><p>独立拒绝按钮无需勾选同意，二次确认并支持选填原因。企业主收到“员工xx已拒绝离职申请”，展示时间和原因；本次申请结束，关系不变。沟通后可重新发起新申请，旧记录保留。</p></li></ol><h3>验收及约束</h3><ul class=\"req-checks\"><li>待确认、确认、拒绝均推送企业主；未读状态和业务状态分别保存。</li><li>同一企业和员工仅一条有效申请；重复提交、消息重试均去重。</li><li>服务端校验身份、编号、版本、最新状态；确认与拒绝原子更新，只允许一次成功。</li><li>旧消息只读，不允许操作另一条新申请；拒绝后重发使用新编号。</li><li>通知持久化、跨端可见、可靠投递及失败重试；记录操作时间、风险告知及协议版本。</li><li>只有关联员工和有权限的企业主可访问；覆盖加载失败、提交失败、通知失败及异常审核。</li><li>不因离职阻断员工历史结算与申诉；确认状态与解绑执行状态分开展示。</li></ul><h3>路线与待确认</h3><p class=\"req-hint\">需求与 Demo 已整理 → 产品 / 法务评审 → 消息和关联状态接口 → 双端开发 → 测试 → 上线。负责人、优先级、排期待定，需补齐受影响数据清单及异常审核规则。Demo 仅为单页模拟，尚未接入真实站内消息与服务端。</p></article>", "front": "原始资料未单列前端开发说明。以下为完整来源内容，实施前需按本需求范围确认：\n\n<article class=\"req-detail\" id=\"ENT-UX-003\"><div class=\"req-meta\"><span>ENT-UX-003</span><span>员工 / 企业主消息中心</span><span>2026-10-16 · 待评审</span></div><h2>员工消息中心与离职双向确认通知</h2><p class=\"req-summary\">企业主发起离职后进入待确认，员工阅读风险并确认或拒绝。企业主收到待确认、确认、拒绝三类站内消息。本需求更新 ENT-UX-002：员工确认前不直接解绑。</p><p><a href=\"employee-message-confirm-demo.html\" target=\"_blank\" rel=\"noopener\">查看双端消息中心与确认弹窗 Demo →</a></p><h3>需求与操作流程</h3><ol class=\"req-list\"><li><b>企业主发起</b><p>保留关闭管理权限并保存的入口，通过弹窗发送申请。生成唯一申请编号，推送员工“离职待确认通知”，同时推送企业主“员工xx离职待确认”。待确认期间关系、权限保持不变，不回收余额。</p></li><li><b>员工消息中心</b><p>新增站内消息入口、未读数量及列表。通知详情展示发起企业、企业主、员工和时间，询问是否与该企业主解除当前企业关联。阅读不等于同意；暂不处理维持 let view='需求列表',selected=null,query='';const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function render(){document.getElementById('nav').innerHTML=sections.map(s=>`<button data-view="${s}" class="${view===s?'active':''}">${s}</button>`).join('');const main=document.getElementById('main');main.innerHTML=`<header><div><h1>${view}</h1><span class="muted">${view==='需求列表'?'统一维护需求目录、状态、版本与预计上线时间':view==='废纸篓'?'作废需求仅保留历史，不进行开发':view==='需求展示'?'仅展示开发中的需求':'企业号统一产品规则 · v0.1'}</span></div><button id="export">导出备份</button></header>`;
if(view==='产品规则'){main.innerHTML+=`<section class="panel"><h2>统一管理规则</h2><p>需求状态：待开发、开发中、待验收、已上线、废弃。状态统一在需求列表编辑；废纸篓提供恢复待开发快捷入口。</p><p>需求注明版本，预计上线时间非必填。待开发仅表示尚未开始，是否获准开发以需求评审为准。</p><p>需求展示仅收录开发中需求；包含基本规则、UX交互场景和前后端开发说明。</p><p>废弃需求不开发，保留内容并可编辑，恢复后回到待开发。</p><h2>企业号业务规则初稿</h2><p>普通员工、小组长、组员互斥；展示标签不改变真实身份与权限。常规分成与进阶分成分别管理。</p><p>员工管理采用独立页面；项目权限只保存变更项，混合配置需明确展示。离职需员工双向确认，待确认不解绑，保留历史收益与结算。</p><p>历史页面方案冲突、接口精度与权限等仍待核对。</p><a href="企业号产品规范-v0.1.md">查看完整产品规范及依据</a></section>`;return}
if(selected){const r=data.find(x=>x.id===selected);if(r){main.innerHTML+=`<button id="back">← 返回需求展示</button><section class="panel"><h2>${esc(r.name)}</h2><p class="muted">${esc(r.id)} · ${esc(r.version||'版本待定')} · 预计上线：${esc(r.date||'未设置')}</p><h3>基本规则</h3><div class="detail">${esc(r.rules||'待补充')}</div><h3>UX交互场景</h3><div class="detail">${esc(r.ux||'原始资料未提供UX场景')}</div><h3>原始需求内容与交互流程</h3><div class="detail">${esc(r.originalContent||'暂无补充资料')}</div><p>${safeLink(r.demo,'查看Demo源码')} · ${safeLink(r.source,'查看产品需求来源')}</p></section><button class="primary fixed-action" id="dev">开发说明</button>`;return}selected=null}
let rows=data.filter(r=>view==='废纸篓'?r.status==='废弃':view==='需求展示'?r.status==='开发中':true).filter(r=>(r.id+r.name).includes(query));main.innerHTML+=`<section class="panel"><input id="search" placeholder="搜索需求名称或编号" value="${esc(query)}" aria-label="搜索需求"> <div class="scroll"><table><thead><tr><th>需求编号</th><th>需求名称</th><th>状态</th><th>预计上线</th><th>备注</th><th>Demo / 产品需求来源</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.id)}</td><td><b>${esc(r.name)}</b></td><td>${view==='需求列表'?`<select data-status="${esc(r.id)}" aria-label="${esc(r.name)}状态">${states.map(t=>`<option ${t===r.status?'selected':''}>${t}</option>`).join('')}</select>`:`<span class="badge">${r.status}</span>`}</td><td>${view==='需求列表'?`<input type="date" data-date="${esc(r.id)}" aria-label="${esc(r.name)}预计上线时间" value="${esc(r.date)}">`:esc(r.date||'未设置')}</td><td style="max-width:280px;min-width:160px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(r.notes||'—')}</td><td>${safeLink(r.demo,'Demo源码')} · ${safeLink(r.source,'产品需求')}</td><td>${view==='需求展示'?`<button class="link" data-detail="${esc(r.id)}">查看需求</button>`:`<button class="link" data-read="${esc(r.id)}">需求内容</button><button class="link" data-edit="${esc(r.id)}">编辑${view==='需求列表'?' / 调整状态':''}</button>`}${view==='废纸篓'?`<button class="link" data-restore="${esc(r.id)}">恢复待开发</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7">暂无需求</td></tr>'}</tbody></table></div></section><p class="muted">记录保存在当前浏览器，可导出备份，尚未接入团队同步。</p>`;}
function edit(id){const r=data.find(x=>x.id===id);if(!r)return;const d=document.getElementById('editor');d.innerHTML=`<form id="form"><h2>${id?'编辑需求':'新增需求'}</h2><p class="muted">${esc(r.id)}</p><label>需求名称 *</label><input class="full" name="name" value="${esc(r.name)}" required><div class="grid"><div><label>需求版本</label><input class="full" name="version" value="${esc(r.version)}"></div><div><label>预计上线时间（非必填）</label><input class="full" type="date" name="date" value="${esc(r.date)}"></div></div>${view==='废纸篓'?'<p>状态：废弃。可保存修改，或返回列表后恢复待开发。</p>':`<label>需求状态</label><select name="status">${states.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`}<label>备注（异常及其他情况说明）</label><textarea name="notes" placeholder="例如：接口异常、依赖未就绪、规则待确认或其他说明">${esc(r.notes)}</textarea><label>Demo GitHub路径</label><input class="full" type="url" name="demo" value="${esc(r.demo)}"><label>产品需求来源 GitHub路径</label><input class="full" type="url" name="source" value="${esc(r.source)}">${[['rules','基本规则'],['ux','UX交互场景'],['front','前端开发说明'],['back','后端开发说明']].map(([k,t])=>`<label>${t}</label><textarea name="${k}">${esc(r[k])}</textarea>`).join('')}<p><button type="button" id="cancel">取消</button> <button class="primary">保存需求</button></p></form>`;d.showModal();d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!String(f.get('name')).trim())return;const updated={...r,...Object.fromEntries(f),name:String(f.get('name')).trim()};if(!id&&data.some(x=>x.id===updated.id)){alert('需求编码重复，请重新创建');return;}if(id)data[data.findIndex(x=>x.id===id)]=updated;else data.push(updated);save();d.close();render()}}
function drawer(tab='front'){const r=data.find(x=>x.id===selected);document.getElementById('layer').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="开发说明"><header><h2>开发说明</h2><button id="close">关闭</button></header><p>${esc(r.name)}</p><div class="tabs"><button data-tab="front" class="${tab==='front'?'active':''}">前端</button><button data-tab="back" class="${tab==='back'?'active':''}">后端</button></div><div class="copy">${esc(r[tab]||'待补充开发说明')}</div></section></div>`;document.getElementById('close').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;selected=null;query='';render()}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.read){selected=b.dataset.read;render()}else if(b.dataset.detail){selected=b.dataset.detail;render()}else if(b.dataset.restore){const r=data.find(x=>x.id===b.dataset.restore);r.status='待开发';save();render()}else if(b.dataset.tab)drawer(b.dataset.tab);else if(b.id==='back'){selected=null;render()}else if(b.id==='dev')drawer();else if(b.id==='close'){document.getElementById('layer').innerHTML='';document.getElementById('dev')?.focus()}else if(b.id==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='企业号需求池.json';a.click();URL.revokeObjectURL(u)}});document.addEventListener('change',e=>{const id=e.target.dataset.status||e.target.dataset.date;if(!id)return;const r=data.find(x=>x.id===id);if(!r)return;if(e.target.dataset.status)r.status=e.target.value;else r.date=e.target.value;save();});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('layer').innerHTML=''});save();render();
</script></html>
