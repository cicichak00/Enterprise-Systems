<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>企业号需求管理</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#24324a;background:#f4f6fa}aside{position:fixed;width:210px;inset:0 auto 0 0;background:#18253e;color:white;padding:24px 16px}aside h2{font-size:19px;margin:0 0 28px}button,input,select,textarea{font:inherit;border:1px solid #dce2eb;border-radius:6px;padding:9px;background:white;color:inherit}button{cursor:pointer}button:hover{border-color:#3478ed}nav button{display:block;width:100%;text-align:left;margin:8px 0;background:transparent;border:0;color:#c7d1e2;padding:12px}nav button.active{background:#2868d8;color:white}main{margin-left:210px;padding:30px;max-width:1600px}h1{font-size:24px;margin:0 0 10px}.muted{color:#748096}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.panel{background:white;border:1px solid #e4e8ef;border-radius:10px;padding:22px;margin:18px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #edf0f5;padding:14px 10px}th{background:#f8faff;color:#69768b;font-weight:500}.primary{background:#2868d8;color:white;border-color:#2868d8}.link{border:0;color:#2868d8;background:transparent;padding:6px}.badge{background:#eef3fc;color:#2868d8;padding:5px 8px;border-radius:4px}label{display:block;margin:14px 0 6px}textarea{width:100%;min-height:110px;resize:vertical}input.full{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fixed-action{position:fixed;bottom:26px;right:32px;box-shadow:0 4px 18px #22334a33}.detail{white-space:pre-wrap;line-height:1.8;padding-bottom:50px}.overlay{position:fixed;inset:0;background:#10213b66;z-index:10;display:flex;justify-content:flex-end}.drawer{width:min(620px,100%);height:100%;overflow:auto;background:white;padding:26px;box-shadow:-8px 0 32px #18253e22}.tabs{display:flex;gap:10px;border-bottom:1px solid #e2e7ef;padding-bottom:12px}.tabs .active{background:#2868d8;color:white}.copy{white-space:pre-wrap;line-height:1.8}.notice{padding:12px;background:#eef4ff;color:#41618e}dialog{border:0;border-radius:12px;width:min(760px,94vw);max-height:90vh;overflow:auto;padding:26px}dialog::backdrop{background:#10213b66}a{color:#2868d8}@media(max-width:700px){aside{position:static;width:auto;padding:16px}aside h2{margin:0 0 12px}nav{display:flex;flex-wrap:wrap}nav button{width:auto;margin:2px}main{margin:0;padding:18px}.grid{grid-template-columns:1fr}header{flex-wrap:wrap}}</style>
<aside><h2>企业号 · 需求管理</h2><nav id="nav"></nav></aside><main id="main"></main><div id="layer"></div><dialog id="editor"></dialog>
<script>
const KEY='enterprise-pool-v2';const states=['待开发','开发中','待验收','已上线','废弃'];const sections=['需求列表','产品规则','需求展示','废纸篓'];
const seed=[{id:'ENT-PM-001',name:'统一需求池与开发状态',status:'待开发',version:'v0.1',date:'',rules:'后台采用需求列表、产品规则、需求展示、废纸篓四个区域。所有状态从需求列表调整。',ux:'需求列表编辑 → 填写规则与开发说明 → 调整为开发中 → 需求展示查看 → 开发说明抽屉。',front:'实现四区导航、需求编辑、状态筛选和开发说明抽屉。当前记录为浏览器本地存储，团队同步接口待接入。',back:'待定义需求持久化、版本与状态更新接口；需校验状态及权限，保留修改记录。'}, {id:'ENT-SPEC-001',name:'企业号规则及产品一致性',status:'待开发',version:'v0.1',date:'',rules:'核对员工身份、分成、权限与页面路径，形成统一规则。',ux:'产品规则区域查看当前规则与待确认事项。',front:'待评审后补充。',back:'待评审后补充。'}, {id:'ENT-UX-002',name:'员工离职确认弹窗',status:'待开发',version:'v0.1',date:'',rules:'沿用员工权限入口；发起离职需风险告知。与ENT-UX-003合并评审，员工确认前不直接解绑。',ux:'企业主关闭管理权限并保存 → 风险弹窗 → 发起申请；取消不改变状态。',front:'弹窗展示身份、余额及风险；默认不勾选；失败可重试。详见原需求文档。',back:'校验身份、结算能力及申请状态，防重复提交；保留审计和历史结算。详见原需求文档。'}, {id:'ENT-UX-003',name:'消息中心与离职双向确认',status:'待开发',version:'v0.1',date:'',rules:'企业主发起，员工确认或拒绝。待确认期间关系和权限不变；历史收益不清零、不自动回收。',ux:'员工消息列表 → 通知详情 → 风险知悉 → 确认或拒绝 → 双端回执。',front:'未读与业务状态分别展示；旧消息只读；异常审核不显示已离职。',back:'同一员工与企业仅一条有效申请；确认与拒绝原子更新；通知持久化、去重和失败重试。'}, {id:'ENT-ROLE-001',name:'辅助角色',status:'待开发',version:'',date:'',rules:'后续规划，职责、角色类型和授权范围待确认，尚未批准实施。',ux:'待定义。',front:'待职责及范围确认后补充。',back:'待角色及权限边界确认后补充。'}];
let data;try{data=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(data))throw Error();}catch{let old;try{old=JSON.parse(localStorage.getItem('enterprise-pool-v1'))}catch{}data=Array.isArray(old)?old.map(r=>({...seed.find(x=>x.id===r[0]),id:r[0],name:r[1],status:states.includes(r[2])?r[2]:r[2]==='废纸篓'?'废弃':'待开发',version:'v0.1',date:'',rules:r[3]||'',evidence:r[4]||''})):seed;}
const githubBase='https://github.com/cicichak00/Enterprise-Systems/blob/codex/requirement-pool/';const sources={'ENT-UX-002':['employee-offboarding-simple-demo.html','deliverables/enterprise-requirement-pool/ENT-UX-002.md'],'ENT-UX-003':['employee-message-confirm-demo.html','deliverables/enterprise-requirement-pool/ENT-UX-003.md'],'ENT-PM-001':['deliverables/enterprise-requirement-pool/index.html','deliverables/enterprise-requirement-pool/企业号产品规范-v0.1.md'],'ENT-SPEC-001':['','deliverables/enterprise-requirement-pool/企业号产品规范-v0.1.md']};data.forEach(r=>{const v=sources[r.id];if(v){if(r.demo===undefined)r.demo=v[0]?githubBase+v[0]:'';if(r.source===undefined)r.source=githubBase+v[1]}});const safeLink=(u,label)=>{try{const url=new URL(u);return ['https:','http:'].includes(url.protocol)?`<a href="${esc(url.href)}" target="_blank" rel="noopener">${label}</a>`:'未上传'}catch{return '未上传'}};
let view='需求列表',selected=null,query='';const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
function render(){document.getElementById('nav').innerHTML=sections.map(s=>`<button data-view="${s}" class="${view===s?'active':''}">${s}</button>`).join('');const main=document.getElementById('main');main.innerHTML=`<header><div><h1>${view}</h1><span class="muted">${view==='需求列表'?'统一维护需求目录、状态、版本与预计上线时间':view==='废纸篓'?'作废需求仅保留历史，不进行开发':view==='需求展示'?'仅展示开发中的需求':'企业号统一产品规则 · v0.1'}</span></div><button id="export">导出备份</button></header>`;
if(view==='产品规则'){main.innerHTML+=`<section class="panel"><h2>统一管理规则</h2><p>需求状态：待开发、开发中、待验收、已上线、废弃。状态统一在需求列表编辑；废纸篓提供恢复待开发快捷入口。</p><p>需求注明版本，预计上线时间非必填。待开发仅表示尚未开始，是否获准开发以需求评审为准。</p><p>需求展示仅收录开发中需求；包含基本规则、UX交互场景和前后端开发说明。</p><p>废弃需求不开发，保留内容并可编辑，恢复后回到待开发。</p><h2>企业号业务规则初稿</h2><p>普通员工、小组长、组员互斥；展示标签不改变真实身份与权限。常规分成与进阶分成分别管理。</p><p>员工管理采用独立页面；项目权限只保存变更项，混合配置需明确展示。离职需员工双向确认，待确认不解绑，保留历史收益与结算。</p><p>历史页面方案冲突、接口精度与权限等仍待核对。</p><a href="企业号产品规范-v0.1.md">查看完整产品规范及依据</a></section>`;return}
if(view==='需求展示'&&selected){const r=data.find(x=>x.id===selected&&x.status==='开发中');if(r){main.innerHTML+=`<button id="back">← 返回需求展示</button><section class="panel"><h2>${esc(r.name)}</h2><p class="muted">${esc(r.id)} · ${esc(r.version||'版本待定')} · 预计上线：${esc(r.date||'未设置')}</p><h3>基本规则</h3><div class="detail">${esc(r.rules||'待补充')}</div><h3>UX交互场景</h3><div class="detail">${esc(r.ux||'待补充')}</div></section><button class="primary fixed-action" id="dev">开发说明</button>`;return}selected=null}
let rows=data.filter(r=>view==='废纸篓'?r.status==='废弃':view==='需求展示'?r.status==='开发中':true).filter(r=>(r.id+r.name).includes(query));main.innerHTML+=`<section class="panel"><input id="search" placeholder="搜索需求名称或编号" value="${esc(query)}" aria-label="搜索需求"> ${view==='需求列表'?'<button class="primary" id="add">新增需求</button>':''}<div class="scroll"><table><thead><tr><th>需求编号 / 名称</th><th>版本</th><th>状态</th><th>预计上线</th><th>Demo / 产品需求来源</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.id)}<br><b>${esc(r.name)}</b></td><td>${esc(r.version||'未设置')}</td><td><span class="badge">${r.status}</span></td><td>${esc(r.date||'未设置')}</td><td>${safeLink(r.demo,'Demo源码')} · ${safeLink(r.source,'产品需求')}</td><td>${view==='需求展示'?`<button class="link" data-detail="${esc(r.id)}">查看需求</button>`:`<button class="link" data-edit="${esc(r.id)}">编辑${view==='需求列表'?' / 调整状态':''}</button>`}${view==='废纸篓'?`<button class="link" data-restore="${esc(r.id)}">恢复待开发</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6">暂无需求</td></tr>'}</tbody></table></div></section><p class="muted">记录保存在当前浏览器，可导出备份，尚未接入团队同步。</p>`;}
function edit(id){const r=data.find(x=>x.id===id)||{id:'ENT-NEW-'+Date.now(),status:'待开发'};const d=document.getElementById('editor');d.innerHTML=`<form id="form"><h2>${id?'编辑需求':'新增需求'}</h2><p class="muted">${esc(r.id)}</p><label>需求名称 *</label><input class="full" name="name" value="${esc(r.name)}" required><div class="grid"><div><label>需求版本</label><input class="full" name="version" value="${esc(r.version)}"></div><div><label>预计上线时间（非必填）</label><input class="full" type="date" name="date" value="${esc(r.date)}"></div></div>${view==='废纸篓'?'<p>状态：废弃。可保存修改，或返回列表后恢复待开发。</p>':`<label>需求状态</label><select name="status">${states.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>`}<label>Demo GitHub路径</label><input class="full" type="url" name="demo" value="${esc(r.demo)}"><label>产品需求来源 GitHub路径</label><input class="full" type="url" name="source" value="${esc(r.source)}">${[['rules','基本规则'],['ux','UX交互场景'],['front','前端开发说明'],['back','后端开发说明']].map(([k,t])=>`<label>${t}</label><textarea name="${k}">${esc(r[k])}</textarea>`).join('')}<p><button type="button" id="cancel">取消</button> <button class="primary">保存需求</button></p></form>`;d.showModal();d.querySelector('#cancel').onclick=()=>d.close();d.querySelector('form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(!String(f.get('name')).trim())return;const updated={...r,...Object.fromEntries(f),name:String(f.get('name')).trim()};if(id)data[data.findIndex(x=>x.id===id)]=updated;else data.push(updated);save();d.close();render()}}
function drawer(tab='front'){const r=data.find(x=>x.id===selected);document.getElementById('layer').innerHTML=`<div class="overlay"><section class="drawer" role="dialog" aria-modal="true" aria-label="开发说明"><header><h2>开发说明</h2><button id="close">关闭</button></header><p>${esc(r.name)}</p><div class="tabs"><button data-tab="front" class="${tab==='front'?'active':''}">前端</button><button data-tab="back" class="${tab==='back'?'active':''}">后端</button></div><div class="copy">${esc(r[tab]||'待补充开发说明')}</div></section></div>`;document.getElementById('close').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;selected=null;query='';render()}else if(b.dataset.edit)edit(b.dataset.edit);else if(b.dataset.detail){selected=b.dataset.detail;render()}else if(b.dataset.restore){const r=data.find(x=>x.id===b.dataset.restore);r.status='待开发';save();render()}else if(b.dataset.tab)drawer(b.dataset.tab);else if(b.id==='add')edit();else if(b.id==='back'){selected=null;render()}else if(b.id==='dev')drawer();else if(b.id==='close'){document.getElementById('layer').innerHTML='';document.getElementById('dev')?.focus()}else if(b.id==='export'){const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='企业号需求池.json';a.click();URL.revokeObjectURL(u)}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('layer').innerHTML=''});save();render();
</script></html>
