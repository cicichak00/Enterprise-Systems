<script>
(()=>{const root=document.getElementById('staff-ux');const initialUsers=[{name:'用户1009',id:634,rate:51,settle:'线下结算',tasks:0,back:0},{name:'用户1003',id:708,rate:51,settle:'线下结算',tasks:18,back:1},{name:'用户1641',id:530,rate:5,settle:'线上结算',tasks:1,back:1}];const defs=[['进阶管理','advanced','身份与关联'],['分成比例','commission','收益与结算'],['结算方式','settlement','收益与结算'],['展示标签','tag','展示与工具'],['快捷提词','prompt','展示与工具'],['项目权限','project','权限与项目'],['收益数据','revenue','权限与项目'],['钱包权限','wallet','权限与项目']];
root.querySelectorAll('.phone').forEach(phone=>{const users=initialUsers.map((u,i)=>({...u,role:['normal','leader','member'][i],leader:i===2?1:-1,personal:i===1?60:5,team:30,view:false}));users.push({name:'用户1547',id:528,rate:10,settle:'线上结算',tasks:12,back:8,role:'normal',leader:-1,personal:5,team:0,view:false});let state={screen:'list',batch:false,selected:[],target:[],action:'commission',confirm:false,value:'',toast:'',query:''};const sortOptions=[['income_asc','收益从低到高'],['income_desc','收益从高到低'],['join_asc','加入时间从早到晚'],['join_desc','加入时间从晚到早']];let employeeSort='';const joinTimes=['2026-08-31 16:00','2026-08-27 14:53','2026-08-04 09:20','2026-08-06 10:30'];function sortedStaff(){return users.map((u,i)=>({u,i})).sort((a,b)=>{if(employeeSort.startsWith('income')){const amounts=[0,14.04,0,11.2];return (amounts[a.i]-amounts[b.i])*(employeeSort==='income_desc'?-1:1)||a.i-b.i;}if(employeeSort.startsWith('join'))return joinTimes[a.i].localeCompare(joinTimes[b.i])*(employeeSort==='join_desc'?-1:1)||a.i-b.i;return a.i-b.i;});}const design={compact:false};const find=(s)=>phone.querySelector(s);const esc=(v)=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\"','&quot;');function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{scheme:phone.dataset.layout,screen:state.screen,selectedCount:state.selected.length},privateContent:null}).catch(()=>{});}function scope(){return state.target.length===1?users[state.target[0]].name+' · ID '+users[state.target[0]].id:'已选择 '+state.target.length+' 位员工';}function current(i){const u=users[i];return {commission:u.rate+'%',settlement:u.settle,tag:u.tag,prompt:u.prompt?'开启':'关闭',revenue:u.revenue?'开启':'关闭',project:users[state.target[0]].projects?Object.values(users[state.target[0]].projects).filter(Boolean).length+' 项可用':'项目配置',wallet:u.wallet?'开启':'关闭'}[state.action];}function bar(title){return '<div class="top"><button class="link" data-do="back">‹ 返回</button><h2>'+title+'</h2></div>';}function rows(){let group='';return defs.filter(d=>d[1]!=='advanced'||state.target.length===1).map(([label,key,g])=>{const heading=g!==group?'<div class="group">'+g+'</div>':'';group=g;if(key==='commission'&&state.target.length===1&&users[state.target[0]].role!=='normal')return heading+'<button class="row" data-action="commission"><span>分成比例<small>已启用进阶管理，常规分成不生效</small></span><span class="value">不适用　›</span></button>';if(key==='advanced')return heading+'<button class="row" data-action="advanced"><span>进阶管理<small>身份、归属关系与进阶分成</small></span><span class="value">'+roleSummary(state.target[0])+'　›</span></button>';if(key==='commission'&&state.target.length>1&&state.target.some(i=>users[i].role!=='normal'))return heading+'<button class="row" disabled><span>常规分成<small>所选含进阶身份，请分别进入进阶管理</small></span></button>';const v=state.target.length===1?({commission:users[state.target[0]].rate+'%',settlement:users[state.target[0]].settle,tag:users[state.target[0]].tag,prompt:users[state.target[0]].prompt?'开启':'关闭',revenue:users[state.target[0]].revenue?'开启':'关闭',project:users[state.target[0]].projects?Object.values(users[state.target[0]].projects).filter(Boolean).length+' 项可用':'项目配置',wallet:users[state.target[0]].wallet?'开启':'关闭'}[key]):'批量修改';return heading+'<button class="row" data-action="'+key+'"><span>'+label+'</span><span class="value">'+v+'　›</span></button>';}).join('');}function list(){return '<div class="top"><h2>运营中心</h2></div><div class="tabs"><span class="on">员工管理</span><span>任务管理</span><span>收益管理</span></div>'+(state.toast?'<div class="success" role="status">'+state.toast+'</div>':'')+'<div class="content"><input class="search" aria-label="搜索员工" placeholder="输入 ID 或昵称" value="'+esc(state.query)+'">'+(state.batch?'<div class="batch-purpose">请选择需要批量设置的员工</div>':'')+'<div class="tools">'+(state.batch?'<button data-do="cancel">取消</button><span>已选 '+state.selected.length+' 人</span><button class="push" data-do="all">全选当前结果</button>':'<button data-sort-open>'+(sortOptions.find(x=>x[0]===employeeSort)?.[1]||'排序')+' ⌄</button><button data-do="batch">批量操作 ⌄</button><button class="link push" data-do="compact">'+(design.compact?'展开数据':'收起数据')+'</button>')+'</div>'+sortedStaff().map(({u,i})=>{if(state.query&&!u.name.includes(state.query)&&!String(u.id).includes(state.query))return '';return '<article class="staff owner-card"><div class="owner-head">'+(state.batch?'<input type="checkbox" aria-label="选择'+u.name+'" data-user="'+i+'" '+(state.selected.includes(i)?'checked':'')+'>':'')+'<div class="avatar">用</div><div class="owner-identity"><div class="owner-title"><h3>'+u.name+'</h3><span class="owner-user-id">ID · '+u.id+'</span></div><div class="owner-tags"><span class="employment">'+(u.active?'在职':'离职')+'</span><span>'+roleNames[u.role]+'</span>'+(u.tag?'<span>'+esc(u.tag)+'</span>':'')+'<span class="settlement-tag">'+u.settle+'</span></div></div>'+(!state.batch?'<button data-single="'+i+'">＋ 管理</button>':'')+'</div><div class="owner-joined">加入时间：'+['2026-08-31 16:00','2026-08-27 14:53','2026-08-04 09:20','2026-08-06 10:30'][i]+'</div>'+(u.role==='member'?'<div class="owner-relation">所属小组长：'+users[u.leader].name+'</div>':u.role==='leader'?'<div class="owner-relation">关联组员：'+memberIds(i).length+' 人</div>':'')+(!state.batch&&!design.compact?metricCards(u,i):'')+'</article>';}).join('')+'</div>'+(state.batch?'<div class="bottom"><button class="primary" data-do="next" '+(!state.selected.length?'disabled':'')+'>下一步（'+state.selected.length+'）</button></div>':'')+'<div class="nav"><span>总览</span><span>运营中心</span><span>排行榜</span><span>我的</span></div><dialog class="staff-sort-dialog" aria-label="员工排序"><div class="sort-sheet-heading"><h3>排序</h3><button data-sort-close aria-label="关闭排序">×</button></div>'+sortOptions.map(([key,label])=>'<button class="sort-choice" data-sort="'+key+'" aria-pressed="'+(employeeSort===key)+'">'+label+'<span>'+(employeeSort===key?'✓':'')+'</span></button>').join('')+'</dialog>';}

function batchName(){return batchActions.find(x=>x[0]===batchAction)?.[1]||'批量操作';}
function batchEligible(i){const u=users[i];if(!u.active)return false;if(batchAction==='commission')return u.role==='normal';if(batchAction==='settlement')return !u.settle;if(batchAction==='wallet')return u.settle==='线上结算';return true;}
function managedClone(i){const u=users[i];return {active:u.active,revenue:u.revenue,rate:u.rate,advanced:u.role!=='normal',role:u.role,leader:u.leader,members:memberIds(i),personal:u.personal,team:u.team,view:u.view,settle:u.settle,wallet:u.wallet,projects:{...u.projects}};}
function openManage(i){recordListScroll=window.scrollY;recordScrollPositions={};recordRenderedKey='';manageIndex=i;manageDraft=managedClone(i);manageOriginal=JSON.stringify(manageDraft);manageOverlay='manage';manageTab='employee';manageMessage='';projectQuery='';projectCollapsed=[];state.toast='';}
function changedManagement(){return JSON.stringify(manageDraft)!==manageOriginal;}
function switchField(key,label,help,value,disabled=false){return '<label class="record-switch"><span><b>'+label+'</b>'+(help?'<small>'+help+'</small>':'')+'</span><input type="checkbox" role="switch" data-mg="'+key+'" aria-label="'+label+'" '+(value?'checked':'')+' '+(disabled?'disabled':'')+'></label>';}
function rateField(key,label,value,disabled=false,max=100){return '<section class="record-rate"><label class="record-rate-title"><span>'+label+'</span><span><input type="number" min="0" max="'+max+'" data-rate="'+key+'" aria-label="'+label+'" value="'+value+'" '+(disabled?'disabled':'')+'> %</span></label><input type="range" min="0" max="'+max+'" data-slider="'+key+'" aria-label="'+label+'滑块" value="'+value+'" '+(disabled?'disabled':'')+'><div class="record-scale"><span>0</span><span>'+Math.round(max/2)+'</span><span>'+max+'</span></div>'+(disabled?'<small>进阶管理开启后常规分成比例失效且不可修改</small>':'')+'</section>';}
function employeePermissionBody(){const d=manageDraft;const target='<div class="scope"><h3>'+users[manageIndex].name+' · ID '+users[manageIndex].id+'</h3></div>';if(manageTab==='commission')return target+rateField('rate','常规分成比例',d.rate,d.advanced||!d.active)+(d.advanced?'<p class="record-note">该员工已启用进阶管理，请进入进阶管理调整对应身份的分成比例。</p>':'');return target+switchField('advanced','进阶管理','按员工身份和归属关系配置分佣；仅影响保存后的新订单。',d.advanced,!d.active)+(d.advanced?'<div class="record-advanced"><div class="record-step"><span><small>步骤 1</small> '+users[manageIndex].name+'身份调整</span><div class="record-role-buttons"><button data-mg-role="leader" aria-pressed="'+(d.role==='leader')+'">小组长</button><button data-mg-role="member" aria-pressed="'+(d.role==='member')+'">组员</button></div></div><div class="record-step"><span><small>步骤 2</small> '+(d.role==='member'?'所属小组长':'关联组员')+'</span><button data-open-candidate="'+(d.role==='member'?'leader':'member')+'">'+(d.role==='member'?(d.leader>=0?users[d.leader].name:'选择小组长'):(d.members.length?'已选 '+d.members.length+' 人':'选择员工'))+'　⌄</button></div>'+rateField('personal',d.role==='member'?'组员分成比例':'小组长分成比例',d.personal,false,d.role==='member'&&d.leader>=0?users[d.leader].personal:100)+(d.role==='leader'?rateField('team','该小组组员分成比例',d.team)+switchField('view','小组长权限配置','允许查看名下组员订单、个人收益和做单统计',d.view):'<p class="record-note">组员分成不得高于所属小组长个人分成。</p>')+'</div>':'');}
function projectManagementBody(){const isBatch=manageOverlay==='batchProject';const targets=isBatch?state.selected:[manageIndex];const values=isBatch?batchDraft.projects:manageDraft.projects;const matched=projectItems.filter(p=>!projectQuery||p.name.toLowerCase().includes(projectQuery.toLowerCase())||p.type.includes(projectQuery));return '<div class="record-project-controls"><input class="search" data-record-project-search aria-label="搜索项目名称" placeholder="搜索项目名称" value="'+esc(projectQuery)+'"><div class="record-expand"><button data-record-expand>全部展开</button><button data-record-collapse>全部收起</button></div></div>'+projectGroups.map(([type])=>{const items=matched.filter(p=>p.type===type);if(!items.length)return '';const open=!!projectQuery||!projectCollapsed.includes(type);return '<section class="record-project-group"><button class="record-project-title" data-record-fold="'+type+'" aria-expanded="'+open+'"><span>'+type+' <small>'+items.length+' 项</small></span><span>'+(open?'⌃':'⌄')+'</span></button>'+(open?'<label class="record-project-all"><span>本分类全部可用</span><input type="checkbox" data-record-group="'+type+'" aria-label="'+type+'全部可用"></label>'+items.map(p=>{const override=isBatch?Object.hasOwn(values,p.id):true;const on=override?!!values[p.id]:targets.every(i=>users[i].projects[p.id]);const mixed=!override&&targets.some(i=>users[i].projects[p.id])&&!on;return '<label class="record-project-row"><span>'+p.name+(p.isNew?' <small class="badge">新增</small>':'')+(mixed?'<small>所选员工配置不同</small>':'')+'</span><input type="checkbox" role="switch" data-record-project="'+p.id+'" aria-label="'+p.name+'可用权限" '+(on?'checked':'')+' data-mixed="'+mixed+'"></label>';}).join(''):'')+'</section>';}).join('')+(!matched.length?'<p>暂无匹配项目</p>':'');}
function candidateReason(i){const u=users[i];if(i===manageIndex)return '本人不可关联';if(!u.active)return '离职员工不可关联';if(candidateType==='leader')return u.role==='leader'?'':'当前不是小组长';if(u.leader===manageIndex)return '';if(u.role==='leader')return '小组长不可作为组员';if(u.role==='member')return '已归属其他小组长';return '';}
function candidateBody(){return '<input class="search" data-candidate-search aria-label="搜索关联员工" placeholder="输入员工 ID 或昵称" value="'+esc(candidateQuery)+'"><p class="record-note">已选 '+candidateSelected.length+' 人</p>'+users.map((u,i)=>{if(candidateQuery&&!u.name.includes(candidateQuery)&&!String(u.id).includes(candidateQuery))return '';const why=candidateReason(i);return '<label class="record-candidate"><input type="'+(candidateType==='leader'?'radio':'checkbox')+'" name="association" data-candidate="'+i+'" aria-label="选择'+u.name+'" '+(candidateSelected.includes(i)?'checked':'')+' '+(why?'disabled':'')+'><span>'+u.name+'<small>用户 ID：'+u.id+(why?' · '+why:'')+'</small></span></label>';}).join('');}
function batchScope(){return '<div class="record-batch-target"><span>应用员工 <small>已选 '+state.selected.length+' 人</small></span><p>'+state.selected.map(i=>users[i].name).join('、')+'</p></div>';}
function batchForm(){const d=batchDraft;if(batchReview)return batchScope()+'<div class="record-review"><h3>请确认本次批量操作</h3><p>操作员工　'+state.selected.length+' 人</p><p>操作内容　'+(batchAction==='tag'?(d.mode==='reset'?'恢复系统标签':'统一标签：'+esc(d.tag)):batchAction==='commission'?'常规分成 '+d.rate+'%':batchAction==='settlement'?d.settle:batchName()+'：'+(d.enabled?'开启':'关闭'))+'</p><div class="record-info">仅修改本次选定内容，其他身份、归属与配置保持不变。</div></div>';
if(batchAction==='tag')return batchScope()+'<h3 class="record-subhead">选择操作方式</h3><div class="record-mode"><button data-tag-mode="custom" aria-pressed="'+(d.mode==='custom')+'">统一自定义<small>设置同一个展示标签</small></button><button data-tag-mode="reset" aria-pressed="'+(d.mode==='reset')+'">恢复系统标签<small>按真实角色自动显示</small></button></div>'+(d.mode==='custom'?'<label class="record-tag-label">标签名称 <small data-tag-count>'+Array.from(d.tag).length+'/5</small><input class="field" data-tag-text aria-label="标签名称" maxlength="5" placeholder="请输入最多5个字符" value="'+esc(d.tag)+'"></label><h3 class="record-subhead">展示预览</h3><div class="record-tag-preview">员工姓名　<span data-tag-preview>'+esc(d.tag||'自定义标签')+'</span></div>':'<div class="record-info">恢复后按普通员工、小组长、组员的真实身份显示。</div>')+'<div class="record-warning">仅修改姓名旁展示标签，不改变真实角色、权限、分成比例和归属关系。</div>';
if(batchAction==='commission')return batchScope()+rateField('batchRate','员工分成比例',d.rate)+'<p class="record-note">仅普通员工常规分成适用，进阶身份请单独管理。</p>';
if(batchAction==='settlement')return batchScope()+'<label class="record-radio"><input type="radio" name="settle" data-batch-settle="线下结算" '+(d.settle==='线下结算'?'checked':'')+'>线下结算</label><label class="record-radio"><input type="radio" name="settle" data-batch-settle="线上结算" '+(d.settle==='线上结算'?'checked':'')+'>线上结算</label><p class="record-note">只配置尚未设置结算方式的员工，不改变分成比例。</p>';
return batchScope()+'<h3 class="record-subhead">'+batchName()+'</h3><label class="record-radio"><input type="radio" name="batchFlag" data-batch-enabled="true" '+(d.enabled?'checked':'')+'>开启</label><label class="record-radio"><input type="radio" name="batchFlag" data-batch-enabled="false" '+(!d.enabled?'checked':'')+'>关闭</label><p class="record-note">'+(batchAction==='prompt'?'控制员工字节项目中的快捷提词组件，默认关闭。':'线下结算员工钱包不可开启，仅操作线上结算员工。')+'</p>';}
function managementSheet(){let title='',body='',footer='',tabs='',error=manageMessage?'<p class="record-error" role="alert">'+esc(manageMessage)+'</p>':'';
if(manageOverlay==='manage'){title=manageTab==='commission'?'分成比例':'进阶管理';body=employeePermissionBody();footer='<button class="primary" data-management-save '+(manageTab==='commission'&&manageDraft.advanced?'disabled':'')+'>确认</button>';}
else if(manageOverlay==='batchMenu'){title='批量设置';body=batchScope()+'<div class="record-action-list">'+batchActions.map(([key,name,desc])=>{const reason=batchReason(key);return '<button data-batch-action="'+key+'" '+(reason?'disabled':'')+'><span>'+name+'<small>'+esc(reason||desc)+'</small></span><span>›</span></button>';}).join('')+'</div>';}
else if(manageOverlay==='candidate'){title=candidateType==='leader'?'选择小组长':'选择关联组员';body=candidateBody();footer='<button class="primary" data-candidate-confirm>确定'+(candidateType==='member'?'（'+candidateSelected.length+'）':'')+'</button>';}
else if(manageOverlay==='batchConfig'){title='批量'+(batchAction==='tag'?'自定义标签':batchName().replace('设置',''));body=batchForm();footer='<div class="record-footer-pair"><button data-batch-back>'+(batchReview?'返回修改':'取消')+'</button><button class="primary" '+(batchReview?'data-batch-save':'data-batch-review')+'>'+(batchReview?'确认保存':'下一步')+'</button></div>';}
else if(manageOverlay==='batchProject'){title='项目管理';body=batchScope()+projectManagementBody();footer='<button class="primary" data-batch-project-save>保存配置</button>';}
else if(manageOverlay==='discard'){title='未保存配置';body='<p>有未保存的修改，是否继续编辑？</p>';footer='<div class="record-footer-pair"><button data-discard-management>放弃修改</button><button class="primary" data-continue-management>继续编辑</button></div>';}
return '<section class="record-dialog record-page" aria-label="'+title+'"><div class="record-shell"><header class="record-dialog-head"><button data-management-close aria-label="返回上一页">‹ 返回</button><h2>'+title+'</h2></header>'+tabs+'<div class="record-sheet-body">'+body+'</div>'+error+(footer?'<footer class="record-dialog-foot">'+footer+'</footer>':'')+'</div></section>';}
function closeManagement(){if(manageOverlay==='candidate'){manageOverlay='manage';manageMessage='';return;}if(manageOverlay==='manage'&&changedManagement()){manageOverlay='discard';return;}if(manageOverlay==='batchConfig'){manageOverlay='batchMenu';}else{manageOverlay=null;state.screen='picker';}manageMessage='';}
function validateManage(){const d=manageDraft,u=users[manageIndex];if(u.role==='leader'&&memberIds(manageIndex).length&&(!d.advanced||d.role!=='leader'||!d.active))return '请先解绑该小组长名下所有组员并保存，再关闭进阶管理或切换身份。';if(!Number.isFinite(Number(d.rate))||d.rate===''||Number(d.rate)<0||Number(d.rate)>100)return '常规分成比例须在 0–100 之间。';if(d.advanced){if(!['leader','member'].includes(d.role))return '请选择进阶身份。';if([d.personal,...(d.role==='leader'?[d.team]:[])].some(x=>x===''||!Number.isFinite(Number(x))||Number(x)<0||Number(x)>100))return '请输入 0–100 的有效进阶分成比例。';if(d.role==='member'&&(d.leader<0||users[d.leader]?.role!=='leader'||!users[d.leader].active))return '请选择一名在职小组长。';if(d.role==='member'&&Number(d.personal)>users[d.leader].personal)return '组员分成不得高于所属小组长个人分成。';if(d.role==='leader'&&d.members.some(i=>users[i].personal>Number(d.personal)))return '小组长分成不能低于关联组员分成。';}return '';}
function applyManage(){const issue=validateManage();if(issue){manageMessage=issue;return false;}const d=manageDraft,u=users[manageIndex];if(manageTab==='commission'){if(d.advanced){manageMessage='进阶身份请在进阶管理中调整分成。';return false;}u.rate=Number(d.rate);}else{const old=memberIds(manageIndex);old.filter(i=>!d.advanced||d.role!=='leader'||!d.members.includes(i)).forEach(i=>{users[i].role='normal';users[i].leader=-1;});Object.assign(u,{role:d.advanced?d.role:'normal',leader:d.advanced&&d.role==='member'?d.leader:-1,personal:Number(d.personal),team:d.advanced&&d.role==='leader'?Number(d.team):0,view:d.advanced&&d.role==='leader'&&d.view});if(d.advanced&&d.role==='leader')d.members.forEach(i=>{users[i].role='member';users[i].leader=manageIndex;});}manageOverlay=null;state.screen='picker';state.toast='保存配置成功';return true;}

function batchReason(action){const selected=state.selected;if(selected.some(i=>!users[i].active))return '包含离职员工，请返回调整选择';if(action==='commission'&&selected.some(i=>users[i].role!=='normal'))return '仅适用于普通员工，请返回调整选择';if(action==='settlement'&&selected.some(i=>!!users[i].settle))return '仅适用于尚未设置结算方式的员工';if(action==='wallet'&&selected.some(i=>users[i].settle!=='线上结算'))return '仅适用于线上结算员工';return '';}
function startBatchAction(action){const reason=batchReason(action);if(reason){manageMessage=reason;return;}batchAction=action;state.target=[...state.selected];if(action==='project'){manageOverlay=null;startProjects();return;}openBatchConfig();}
function openBatchConfig(){if(!state.selected.length)return;batchDraft={rate:'',mode:'custom',tag:'',enabled:false,settle:'线下结算',projects:{}};batchReview=false;manageMessage='';projectQuery='';projectCollapsed=[];manageOverlay=batchAction==='project'?'batchProject':'batchConfig';}
function batchValidation(){if(!state.selected.length)return '请先选择员工。';if(state.selected.some(i=>!batchEligible(i)))return '所选员工已不符合操作条件，请重新选择。';if(batchAction==='tag'&&batchDraft.mode==='custom'&&(Array.from(batchDraft.tag.trim()).length<1||Array.from(batchDraft.tag.trim()).length>5))return '请输入 1–5 个字符的标签。';if(batchAction==='commission'&&(batchDraft.rate===''||!Number.isFinite(Number(batchDraft.rate))||Number(batchDraft.rate)<0||Number(batchDraft.rate)>100))return '请输入 0–100 的分成比例。';return '';}
phone.addEventListener('input',e=>{const t=e.target;if(!manageOverlay)return;if(t.dataset.rate){if(t.dataset.rate==='batchRate')batchDraft.rate=t.value;else manageDraft[t.dataset.rate]=t.value;const slider=phone.querySelector('[data-slider="'+t.dataset.rate+'"]');if(slider)slider.value=t.value;}else if(t.dataset.slider){const key=t.dataset.slider;if(key==='batchRate')batchDraft.rate=t.value;else manageDraft[key]=t.value;const n=phone.querySelector('[data-rate="'+key+'"]');if(n)n.value=t.value;}else if(t.hasAttribute('data-tag-text')){batchDraft.tag=Array.from(t.value).slice(0,5).join('');phone.querySelector('[data-tag-count]').textContent=Array.from(batchDraft.tag).length+'/5';phone.querySelector('[data-tag-preview]').textContent=batchDraft.tag||'自定义标签';}else if(t.hasAttribute('data-candidate-search')){candidateQuery=t.value;renderRecordInput('data-candidate-search');}else if(t.hasAttribute('data-record-project-search')){projectQuery=t.value;renderRecordInput('data-record-project-search');}else return;e.stopImmediatePropagation();},true);
function renderRecordInput(attr){const el=phone.querySelector('['+attr+']'),pos=el?.selectionStart;render();const after=phone.querySelector('['+attr+']');if(after){after.focus();after.setSelectionRange(pos,pos);}}
phone.addEventListener('change',e=>{const t=e.target;if(!manageOverlay)return;if(t.dataset.mg){const key=t.dataset.mg;if((key==='advanced'&&!t.checked||key==='active'&&!t.checked)&&users[manageIndex].role==='leader'&&memberIds(manageIndex).length){manageMessage='请先解绑该小组长名下所有组员后，再关闭进阶管理。';}else{manageDraft[key]=t.checked;manageMessage='';if(key==='advanced'){if(t.checked&&manageDraft.role==='normal')manageDraft.role='leader';if(!t.checked){manageDraft.role='normal';manageDraft.leader=-1;manageDraft.members=[];manageDraft.view=false;}}}}else if(t.dataset.candidate!==undefined){const i=Number(t.dataset.candidate);candidateSelected=candidateType==='leader'?[i]:t.checked?[...new Set([...candidateSelected,i])]:candidateSelected.filter(x=>x!==i);}else if(t.dataset.recordProject!==undefined){const p=Number(t.dataset.recordProject);(manageOverlay==='batchProject'?batchDraft.projects:manageDraft.projects)[p]=t.checked;}else if(t.dataset.recordGroup){const values=manageOverlay==='batchProject'?batchDraft.projects:manageDraft.projects;projectItems.filter(p=>p.type===t.dataset.recordGroup&&(!projectQuery||p.name.toLowerCase().includes(projectQuery.toLowerCase())||p.type.includes(projectQuery))).forEach(p=>values[p.id]=t.checked);}else if(t.dataset.batchSettle)batchDraft.settle=t.dataset.batchSettle;else if(t.dataset.batchEnabled)batchDraft.enabled=t.dataset.batchEnabled==='true';else return;e.stopImmediatePropagation();render();},true);
phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let handled=true;
if(b.dataset.single!==undefined){state.target=[Number(b.dataset.single)];state.screen='picker';manageOverlay=null;}
else if(b.dataset.action==='advanced'||b.dataset.action==='commission'&&state.target.length===1){openManage(state.target[0]);manageTab=b.dataset.action;}
else if(b.dataset.action==='project'){startProjects();}
else if(b.dataset.do==='batch'){recordListScroll=window.scrollY;state.batch=true;state.selected=[];batchAction='';state.toast='';manageMessage='';}
else if(b.dataset.do==='next'&&state.batch){state.target=[...state.selected];manageOverlay='batchMenu';manageMessage='';}
else if(b.dataset.do==='all'&&state.batch){const ids=users.map((u,i)=>i).filter(i=>users[i].active&&(!state.query||users[i].name.includes(state.query)||String(users[i].id).includes(state.query)));const all=ids.every(i=>state.selected.includes(i));state.selected=all?state.selected.filter(i=>!ids.includes(i)):[...new Set([...state.selected,...ids])];}
else if(b.dataset.do==='cancel'&&state.batch){state.batch=false;state.selected=[];batchAction='';}
else if(b.dataset.batchAction){startBatchAction(b.dataset.batchAction);}
else if(b.dataset.manageTab){manageTab=b.dataset.manageTab;manageMessage='';}
else if(b.dataset.mgRole){if(users[manageIndex].role==='leader'&&memberIds(manageIndex).length&&b.dataset.mgRole!=='leader')manageMessage='请先解绑全部组员并保存后再切换身份。';else{manageDraft.role=b.dataset.mgRole;manageDraft.leader=manageDraft.role==='member'&&users[manageIndex].role==='member'?users[manageIndex].leader:-1;manageDraft.members=manageDraft.role==='leader'?memberIds(manageIndex):[];manageMessage='';}}
else if(b.dataset.openCandidate){candidateType=b.dataset.openCandidate;candidateSelected=candidateType==='member'?[...manageDraft.members]:manageDraft.leader>=0?[manageDraft.leader]:[];candidateQuery='';manageOverlay='candidate';manageMessage='';}
else if(b.hasAttribute('data-candidate-confirm')){if(candidateType==='member')manageDraft.members=[...candidateSelected];else manageDraft.leader=candidateSelected[0]??-1;manageOverlay='manage';}
else if(b.hasAttribute('data-management-close'))closeManagement();
else if(b.hasAttribute('data-management-save'))applyManage();
else if(b.hasAttribute('data-continue-management'))manageOverlay='manage';
else if(b.hasAttribute('data-discard-management')){manageOverlay=null;manageDraft=null;}
else if(b.dataset.recordFold){if(!projectQuery){const t=b.dataset.recordFold;projectCollapsed=projectCollapsed.includes(t)?projectCollapsed.filter(x=>x!==t):[...projectCollapsed,t];}}
else if(b.hasAttribute('data-record-expand'))projectCollapsed=[];
else if(b.hasAttribute('data-record-collapse'))projectCollapsed=projectGroups.map(x=>x[0]);
else if(b.dataset.tagMode){batchDraft.mode=b.dataset.tagMode;manageMessage='';}
else if(b.hasAttribute('data-batch-back')){if(batchReview)batchReview=false;else manageOverlay='batchMenu';manageMessage='';}
else if(b.hasAttribute('data-batch-review')){manageMessage=batchValidation();if(!manageMessage)batchReview=true;}
else if(b.hasAttribute('data-batch-save')){manageMessage=batchValidation();if(!manageMessage){state.selected.forEach(i=>{const u=users[i];if(batchAction==='commission')u.rate=Number(batchDraft.rate);if(batchAction==='tag')u.tag=batchDraft.mode==='reset'?'':batchDraft.tag.trim();if(batchAction==='prompt')u.prompt=batchDraft.enabled;if(batchAction==='wallet')u.wallet=batchDraft.enabled;if(batchAction==='settlement'){u.settle=batchDraft.settle;if(u.settle==='线下结算')u.wallet=false;}});manageOverlay=null;state.toast='保存配置成功';}}
else if(b.hasAttribute('data-batch-project-save')){state.selected.forEach(i=>Object.entries(batchDraft.projects).forEach(([id,value])=>users[i].projects[id]=value));manageOverlay=null;state.toast='项目配置保存成功';}
else handled=false;
if(handled){e.stopImmediatePropagation();render();persist();}},true);
function syncRecordDOM(scroll=0){const dialog=phone.querySelector('.record-dialog');if(!dialog)return;window.scrollTo(0,scroll);const values=manageOverlay==='batchProject'?batchDraft.projects:manageDraft?.projects;dialog.querySelectorAll('[data-record-group]').forEach(el=>{const items=projectItems.filter(p=>p.type===el.dataset.recordGroup&&(!projectQuery||p.name.toLowerCase().includes(projectQuery.toLowerCase())||p.type.includes(projectQuery)));const targets=manageOverlay==='batchProject'?state.selected:[manageIndex];const flags=items.flatMap(p=>targets.map(i=>manageOverlay==='batchProject'?(Object.hasOwn(values,p.id)?values[p.id]:users[i].projects[p.id]):values[p.id]));const on=flags.filter(Boolean).length;el.checked=on===flags.length;el.indeterminate=on>0&&on<flags.length;});}

function render(){if(manageOverlay){if(recordRenderedKey)recordScrollPositions[recordRenderedKey]=window.scrollY;const nextKey=manageOverlay+':'+manageTab;recordRenderedKey=nextKey;phone.innerHTML=managementSheet();syncRecordDOM(recordScrollPositions[nextKey]||0);phone.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));return;}if(recordRenderedKey){recordRenderedKey='';window.scrollTo(0,recordListScroll);}phone.innerHTML=state.screen==='projects'?projectBody():state.screen==='roles'?roleBody():state.screen==='list'?list():state.screen==='picker'?picker():edit();if(state.screen==='projects'&&!projectDraft.exit&&!projectDraft.review){const all=find('[data-project-all]');const visible=projectVisible();const n=visible.filter(p=>projectDraft.selected.includes(p.id)).length;if(all){all.indeterminate=n>0&&n<visible.length;all.disabled=!visible.length;}phone.querySelectorAll('[data-project-group]').forEach(el=>{const items=projectVisible().filter(p=>p.type===el.dataset.projectGroup);const total=items.length*state.target.length;const on=items.reduce((n,p)=>n+state.target.filter(i=>effectiveProject(i,p.id)).length,0);el.checked=on===total;el.indeterminate=on>0&&on<total;});}if(state.screen==='edit'&&!state.confirm&&find('#value')?.tagName==='SELECT'&&state.value)find('#value').value=state.value;phone.querySelectorAll('button').forEach(b=>b.classList.add('cursor-interaction'));}phone.addEventListener('input',e=>{if(state.screen==='edit'&&e.target.id==='value')state.value=e.target.value;if(state.screen==='list'&&e.target.classList.contains('search')){state.query=e.target.value;const pos=e.target.selectionStart;render();find('.search').focus();find('.search').setSelectionRange(pos,pos);}});phone.addEventListener('change',e=>{if(e.target.dataset.user!==undefined){const i=Number(e.target.dataset.user);state.selected=e.target.checked?[...state.selected,i]:state.selected.filter(x=>x!==i);render();persist();}});phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.single!==undefined){state.target=[Number(b.dataset.single)];state.screen='picker';}else if(b.dataset.action){state.action=b.dataset.action;state.value=state.target.length===1&&b.dataset.action!=='advanced'&&b.dataset.action!=='project'?(current(state.target[0])||'').replace('%',''):'';state.confirm=false;state.screen='edit';}else switch(b.dataset.do){case 'compact':design.compact=!design.compact;break;case 'batch':state.batch=true;state.toast='';break;case 'cancel':state.batch=false;state.selected=[];break;case 'all':state.selected=users.map((u,i)=>i).filter(i=>!state.query||users[i].name.includes(state.query)||String(users[i].id).includes(state.query));break;case 'next':state.target=[...state.selected];state.screen='picker';break;case 'back':if(state.confirm)state.confirm=false;else if(state.screen==='edit')state.screen='picker';else state.screen='list';break;case 'review':{let v=find('#value').value.trim();if(state.action==='commission'&&(v===''||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100)){find('#error').textContent='请输入 0–100 的有效比例';return;}if(state.action==='tag'&&!v){find('#error').textContent='请输入展示标签';return;}state.value=state.action==='commission'?v+'%':state.action==='project'?find('#project').value+' · '+v:v;state.confirm=true;break;}case 'save':if(state.action==='commission')state.target.forEach(i=>users[i].rate=parseFloat(state.value));if(state.action==='settlement')state.target.forEach(i=>users[i].settle=state.value);if(state.action==='tag')state.target.forEach(i=>users[i].tag=state.value);if(['prompt','wallet','revenue'].includes(state.action))state.target.forEach(i=>users[i][state.action]=state.value==='开启');state.toast='演示：'+state.target.length+' 人的'+defs.find(d=>d[1]===state.action)[0]+'已更新';state.screen='list';state.confirm=false;break;}if(state.action==='advanced'&&state.screen==='edit')startRole();if(state.action==='project'&&state.screen==='edit')startProjects();render();persist();});if(location.hash==='#projects'){state.target=[0];startProjects();}render();if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:render});t.addToggle(design,'compact',{label:'默认收起经营数据'});}});
})();
