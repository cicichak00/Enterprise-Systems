<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离职确认 · 双端消息中心</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#273044;font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #dce2ec;border-radius:7px;padding:10px 14px;background:white;color:#4c586b}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#2b59c3;color:white;border-color:#2b59c3}.wrap{max-width:940px;margin:30px auto;padding:0 18px}h1{font-size:24px;margin-bottom:8px}.intro{color:#778196;line-height:1.8}.tools{display:flex;gap:10px;align-items:center;margin:20px 0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.phone{background:#fff;border:1px solid #e1e5ee;border-radius:16px;overflow:hidden;min-height:620px}.head{padding:20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}.head b{font-size:17px}.badge{font-size:11px;background:#eef2ff;color:#2b59c3;padding:4px 8px;border-radius:5px}.body{padding:18px}.staff{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee;margin-bottom:16px}.muted{color:#8992a3;font-size:12px;line-height:1.8}.message{width:100%;text-align:left;margin:12px 0;padding:16px;border:1px solid #e3e8f1;background:#fff;border-radius:9px;color:#273044}.message h3{font-size:15px;margin:8px 0}.message p{font-size:12px;color:#738094;line-height:1.8;margin:8px 0}.message time{font-size:11px;color:#9aa3b1}.dot{display:inline-block;width:7px;height:7px;background:#2b59c3;border-radius:50%;margin-right:6px}.empty{text-align:center;color:#9aa3b1;padding:70px 10px}.notice{padding:13px;background:#fff7eb;color:#875724;font-size:12px;line-height:1.9;border-radius:7px;margin:14px 0}.overlay{position:fixed;inset:0;background:#17213870;display:flex;align-items:center;justify-content:center;padding:18px}.overlay[hidden]{display:none}.dialog{background:white;padding:24px;border-radius:14px;width:430px;max-height:90dvh;overflow:auto}.dialog h2{margin:0 0 10px;font-size:20px}.dialog p{line-height:1.9}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}.check{display:flex;gap:9px;font-size:13px;line-height:1.8;margin:14px 0}.check input{accent-color:#2b59c3;flex-shrink:0;margin-top:5px}textarea{width:100%;border:1px solid #dce2ec;border-radius:6px;padding:10px;min-height:80px}.history{border-top:1px solid #eee;margin-top:20px;padding-top:10px;font-size:12px;color:#788498;line-height:2}.full{width:100%}@media(max-width:650px){.columns{grid-template-columns:1fr}.wrap{margin:20px auto}.phone{min-height:400px}}
</style></head><body><main class="wrap"><h1>离职确认 · 双端消息中心</h1><p class="intro">企业主发起后，员工阅读风险并确认或拒绝；企业主同步收到各阶段通知。</p><div class="tools"><span class="badge" id="flow">未发起</span><button id="reset">重置演示</button><span class="muted">示例数据 · 不提交真实业务操作</span></div><div class="columns"><section class="phone"><header class="head"><b>企业主 · 消息中心</b><span id="ownerCount" class="badge">0 条未读</span></header><div class="body"><div class="staff"><div><b>用户1641</b><div class="muted">协作 ID 530 · <span id="relation">在职</span></div></div><button class="primary" id="initiate">发起离职</button></div><div id="ownerMessages"></div></div></section><section class="phone"><header class="head"><b>员工 · 消息中心</b><span id="employeeCount" class="badge">0 条未读</span></header><div class="body"><div class="muted">当前企业：星辰信息科技有限公司</div><div id="employeeMessages"></div></div></section></div><p class="muted">演示为当前页面内的双端联动；正式开发需接入持久化消息、服务端状态校验及可靠投递。</p></main><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" id="dialog"></section></div><script>
const $=id=>document.getElementById(id);let state='idle',owner=[],employee=[],reason='',serial=0;const status={idle:'未发起',pending:'待员工确认',confirmed:'员工已确认',rejected:'员工已拒绝'};function notify(list,title,copy){list.unshift({id:++serial,title,copy,read:false,time:new Date().toLocaleString('zh-CN',{hour12:false})})}function cards(list,side){return list.length?list.map(m=>`<button class="message" data-side="${side}" data-id="${m.id}"><span class="badge">离职通知</span><h3>${m.read?'':'<span class="dot"></span>'}${m.title}</h3><p>${m.copy}</p><time>${m.time}　查看详情 ›</time></button>`).join(''):'<div class="empty">暂无离职消息</div>'}function render(){$('flow').textContent=status[state];$('relation').textContent=state==='confirmed'?'已离职 / 已解绑':state==='pending'?'在职 · 离职待确认':'在职';$('initiate').disabled=state==='pending'||state==='confirmed';$('initiate').textContent=state==='pending'?'等待员工确认':state==='confirmed'?'已完成离职':'发起离职';$('ownerMessages').innerHTML=cards(owner,'owner');$('employeeMessages').innerHTML=cards(employee,'employee');$('ownerCount').textContent=owner.filter(x=>!x.read).length+' 条未读';$('employeeCount').textContent=employee.filter(x=>!x.read).length+' 条未读'}function modal(html){$('dialog').innerHTML=html;$('overlay').hidden=false}function close(){$('overlay').hidden=true}function send(){if(state==='pending'||state==='confirmed')return;state='pending';reason='';notify(employee,'离职待确认通知','企业主申请与你解除当前企业关联，请阅读风险告知并确认或拒绝。处理前关系保持不变。');notify(owner,'用户1641离职待确认','离职通知已发送给用户1641，等待员工处理，当前企业关联保持不变。');close();render()}function start(){modal('<h2 id="dialogTitle">向员工发起离职确认？</h2><p class="muted">用户1641 · 协作 ID 530</p><p>通知发送后，员工将在消息中心阅读风险告知，并选择确认或拒绝。</p><div class="notice">员工确认前维持当前企业关联，不提前解绑、回收余额或切断相关访问。拒绝后本次申请结束，可沟通后重新发起。</div><div class="actions"><button data-act="close">取消</button><button class="primary" data-act="send">发送待确认通知</button></div>')}function detail(side,id){const list=side==='owner'?owner:employee,m=list.find(x=>x.id===id);if(!m)return;m.read=true;render();if(side==='employee'&&state==='pending'){modal('<h2 id="dialogTitle">离职待确认通知</h2><p class="muted">发起企业：星辰信息科技有限公司<br>企业主申请与你解除企业关联</p><p>请确认是否与当前企业主解除平台内的企业关联关系。</p><div class="notice"><b>关系解除及数据影响</b><br>确认后，你将退出当前企业，依赖企业关联的项目权限、后续任务分配及部分企业共享数据访问将停止。历史订单、企业协作记录等数据包含企业关联信息，其展示范围按已公示规则和合法权限调整。<br><br><b>你的已有余额、待结收益、合法查询及申诉权利继续保留，不清零、不自动转给企业主。</b>必要结算和维权记录应继续提供查询或申请渠道。</div><p class="muted">已确认余额 ¥43.39 · 待结收益 ¥0.90<br>本操作仅处理平台企业关联，不替代现实劳动关系解除手续。</p><label class="check"><input type="checkbox" id="risk"><span>我已阅读并理解企业关联解除及相关数据访问变化的风险告知。</span></label><label class="check"><input type="checkbox" id="consent"><span>我自愿确认与该企业主解除当前企业关联；本确认不代表款项结清或放弃合法权益。</span></label><div class="actions"><button data-act="reject">拒绝离职</button><button class="primary" id="confirm" data-act="confirm" disabled>确认解除关系</button></div><button class="full" style="margin-top:10px" data-act="close">暂不处理</button>');}else{modal('<h2 id="dialogTitle">'+m.title+'</h2><p>'+m.copy+'</p><div class="notice">当前申请状态：'+status[state]+'<br>当前关系：'+(state==='confirmed'?'已解除企业关联':'企业关联保留')+'</div><div class="history">'+[...owner].reverse().map(x=>x.time+' · '+x.title).join('<br>')+'</div><button class="primary full" style="margin-top:20px" data-act="close">知道了</button>')}}function reject(){modal('<h2 id="dialogTitle">拒绝本次离职申请？</h2><p>拒绝后，你与当前企业的关联保持不变，企业主将收到拒绝通知。</p><label for="reason" class="muted">拒绝原因（选填，最多200字）</label><textarea id="reason" maxlength="200" placeholder="如：离职事项或结算情况尚未沟通一致"></textarea><div class="actions"><button data-act="back">返回通知</button><button class="primary" data-act="rejectSubmit">确认拒绝</button></div>')}function settle(ok){if(state!=='pending')return;if(ok&&(!$('risk')?.checked||!$('consent')?.checked))return;reason=ok?'':$('reason').value.trim().replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');state=ok?'confirmed':'rejected';notify(owner,ok?'用户1641已进行离职确认':'用户1641已拒绝离职申请',ok?'员工已阅读风险告知并确认，企业关联已解除；历史收益及结算责任继续保留。':'员工拒绝本次离职申请，企业关联保持不变。'+(reason?'拒绝原因：'+reason:''));notify(employee,ok?'离职确认已完成':'已拒绝离职申请',ok?'你的企业关联已解除，已通知企业主。历史收益与申诉权利继续保留。':'本次申请已结束，企业关联保持不变，已通知企业主。');close();render()}
$('initiate').onclick=start;$('reset').onclick=()=>{state='idle';owner=[];employee=[];reason='';close();render()};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.side){detail(b.dataset.side,+b.dataset.id);return}const a=b.dataset.act;if(a==='close')close();if(a==='send')send();if(a==='confirm')settle(true);if(a==='reject')reject();if(a==='rejectSubmit')settle(false);if(a==='back')detail('employee',employee.find(x=>x.title==='离职待确认通知').id)});document.addEventListener('change',()=>{if($('confirm'))$('confirm').disabled=!($('risk').checked&&$('consent').checked)});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
</script></body></html>
